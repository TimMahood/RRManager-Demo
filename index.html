lidateSet":[],"default":null,"description":"The computer to remove the profile from.","isTarget":true,"fillable":true}],"targetParam":"ComputerName","runOn":"Server","runOnSource":"detected","modified":"2026-10-28T08:34:30.1666078+00:00","size":626,"sha256":"09326DC677BDC377545741685E4679AC248D53A68EBE6D1C2F0736890DFDD645","readiness":{"status":"NeedsChanges","errors":2,"warnings":2,"restarts":false,"findings":[{"level":"error","code":"Interactive","title":"Waits for someone to type or click","detail":"Uses Read-Host. Nobody can answer a prompt when the script runs from the web app, so it would sit there until it times out.","fix":"Turn each prompt into a parameter. The web page shows a box for every parameter and asks for it before the script runs. Remove pop-up windows (forms, message boxes) and write messages with Write-Output instead.","example":"param(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [Parameter(Mandatory)][string]$UserName     # was: $UserName = Read-Host 'User name'\n)","lines":[11]},{"level":"info","code":"RunOnServer","title":"Runs on the web server, against the target in -ComputerName","detail":"The computer typed at the top of the page is passed in -ComputerName. The script itself runs on the web server, so every command that should act on the target has to be pointed at it.","fix":"If the script was written to run on the PC itself, add the line '# RemoteRun: RunOn=Target' near the top and the app will run it on the target instead.","example":"","lines":[]},{"level":"error","code":"TargetUnused","title":"Never uses -ComputerName","detail":"The script has a -ComputerName parameter but doesn't use it, so whatever it does happens on the web server, not the target computer.","fix":"Pass $ComputerName to each command that should act on the target, or wrap the work in Invoke-Command -ComputerName $ComputerName.","example":"Invoke-Command -ComputerName $ComputerName -ScriptBlock {\n    # commands here run on the target computer\n}","lines":[]},{"level":"warning","code":"MissingComputerName","title":"Some commands will run against the web server","detail":"Get-WmiObject without -ComputerName (or -CimSession) act on the computer the script runs on, which is the web server.","fix":"Add -ComputerName $ComputerName to each of them.","example":"Get-CimInstance -ClassName Win32_OperatingSystem -ComputerName $ComputerName","lines":[12]},{"level":"warning","code":"LocalComputer","title":"Refers to \"this computer\"","detail":"$env:COMPUTERNAME, localhost or \".\" mean the web server when the script runs here, not the target computer.","fix":"Use $ComputerName instead.","example":"","lines":[13]}]}},{"team":"Service Desk","path":"Test-HomeDriveAccess.ps1","category":"","name":"Test-HomeDriveAccess","file":"Test-HomeDriveAccess.ps1","synopsis":"Checks that the computer can reach the home drive and shared drive servers.","description":"","owner":"Service Desk","notes":"Owner: Service Desk","examples":[],"parameters":[],"targetParam":null,"runOn":"Target","runOnSource":"detected","modified":"2026-10-28T08:34:30.1666206+00:00","size":316,"sha256":"5B7E9867B156A081C745623FD11CA379DD010D355EAE230A9CDD9F26AE78AD51","readiness":{"status":"Check","errors":0,"warnings":1,"restarts":false,"findings":[{"level":"info","code":"RunOnTarget","title":"Runs on the target computer","detail":"The script has no computer name parameter, so the app copies it to the target computer and runs it there through PowerShell remoting (WinRM), as the run-as account. $env:COMPUTERNAME and local paths refer to the target.","fix":"If the script is meant to run on the server and reach out to the target itself, add a -ComputerName parameter (or '# RemoteRun: RunOn=Server').","example":"","lines":[]},{"level":"warning","code":"SecondHop","title":"Reads or writes a network share","detail":"When the script runs on the target computer through remoting, it can't pass the run-as account's password on to a third server (the \"second hop\"), so network shares usually return Access denied.","fix":"Give the target computers' own accounts (the Domain Computers group) read access to the share, or make the script run on the server instead and copy files to \\\\<target>\\C$.","example":"","lines":[9]}]}},{"team":"Telecoms","path":"Get-SoftphoneVersion.ps1","category":"","name":"Get-SoftphoneVersion","file":"Get-SoftphoneVersion.ps1","synopsis":"Shows the installed softphone client version.","description":"","owner":"Telecoms","notes":"Owner: Telecoms","examples":[],"parameters":[],"targetParam":null,"runOn":"Target","runOnSource":"detected","modified":"2026-10-28T08:34:30.1667661+00:00","size":287,"sha256":"7A415DC2C1027FF6C0A28F9A343920E39C10B90CC4BCC848D953B7BDFF9F3A97","readiness":{"status":"Ready","errors":0,"warnings":0,"restarts":false,"findings":[{"level":"info","code":"RunOnTarget","title":"Runs on the target computer","detail":"The script has no computer name parameter, so the app copies it to the target computer and runs it there through PowerShell remoting (WinRM), as the run-as account. $env:COMPUTERNAME and local paths refer to the target.","fix":"If the script is meant to run on the server and reach out to the target itself, add a -ComputerName parameter (or '# RemoteRun: RunOn=Server').","example":"","lines":[]}]}}],"sources":{"Cyber Security\\Get-BitLockerStatus.ps1":"<#\n.SYNOPSIS\n    Shows BitLocker status for each drive and whether the key is backed up to AD.\n.NOTES\n    Owner: Cyber Security\n#>\nparam()\n\n. \"$PSScriptRoot\\Shared\\Common-Functions.ps1\"\n\nGet-BitLockerVolume | ForEach-Object {\n    [pscustomobject]@{\n        Drive      = $_.MountPoint\n        Status     = $_.VolumeStatus\n        Protection = $_.ProtectionStatus\n        Encrypted  = \"$($_.EncryptionPercentage)%\"\n        KeyInAD    = Test-KeyBackedUp -Volume $_\n    }\n}","Cyber Security\\Get-LocalAdmins.ps1":"<#\n.SYNOPSIS\n    Lists the members of the local Administrators group.\n.DESCRIPTION\n    Flags anyone who isn't one of the expected admin groups.\n.NOTES\n    Owner: Cyber Security\n#>\nparam()\n\n$expected = 'Administrator', 'Domain Admins', 'SG-Workstation-Admins'\n$members = net localgroup Administrators | Select-Object -Skip 6 | Where-Object { $_ -and $_ -notmatch 'command completed' }\nforeach ($m in $members) {\n    $name = $m.Trim()\n    [pscustomobject]@{ Member = $name; Expected = [bool]($expected | Where-Object { $name -like \"*$_\" }) }\n    if (-not ($expected | Where-Object { $name -like \"*$_\" })) { Write-Warning \"Unexpected local admin: $name\" }\n}","Cyber Security\\Invoke-DefenderScan.ps1":"<#\n.SYNOPSIS\n    Starts a Microsoft Defender scan and shows the latest threats found.\n.PARAMETER ScanType\n    QuickScan (a few minutes) or FullScan (can take an hour or more).\n.PARAMETER UpdateSignatures\n    Update the virus definitions first.\n.NOTES\n    Owner: Cyber Security\n#>\nparam(\n    [ValidateSet('QuickScan', 'FullScan')][string]$ScanType = 'QuickScan',\n    [switch]$UpdateSignatures\n)\n\nif ($UpdateSignatures) {\n    Write-Verbose 'Updating signatures' -Verbose\n    Update-MpSignature\n}\nWrite-Output \"Starting $ScanType on $env:COMPUTERNAME\"\nStart-MpScan -ScanType $ScanType\n$status = Get-MpComputerStatus\nWrite-Output \"Definitions: $($status.AntivirusSignatureVersion) ($($status.AntivirusSignatureLastUpdated))\"\nGet-MpThreatDetection | Select-Object -First 10 InitialDetectionTime, ThreatID, ActionSuccess, Resources","Desktop Support\\Get-DeviceInfo.ps1":"<#\n.SYNOPSIS\n    Shows the make, model, serial number, OS build, uptime and free disk space of a computer.\n.DESCRIPTION\n    Reads the details over CIM (WinRM) from the web server, so nothing is copied to the computer.\n    Useful as a first look before any other troubleshooting.\n.PARAMETER ComputerName\n    The computer to look at. Filled in from the target box.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.2\n#>\n[CmdletBinding()]\nparam(\n    [Parameter(Mandatory)][string]$ComputerName\n)\n\n$session = New-CimSession -ComputerName $ComputerName -ErrorAction Stop\ntry {\n    $os   = Get-CimInstance -CimSession $session -ClassName Win32_OperatingSystem\n    $cs   = Get-CimInstance -CimSession $session -ClassName Win32_ComputerSystem\n    $bios = Get-CimInstance -CimSession $session -ClassName Win32_BIOS\n    $disk = Get-CimInstance -CimSession $session -ClassName Win32_LogicalDisk -Filter \"DeviceID='C:'\"\n\n    Write-Host \"Connected to $ComputerName\"\n    [pscustomobject]@{\n        Computer     = $ComputerName\n        Manufacturer = $cs.Manufacturer\n        Model        = $cs.Model\n        Serial       = $bios.SerialNumber\n        OS           = $os.Caption\n        Build        = $os.BuildNumber\n        LastBoot     = $os.LastBootUpTime\n        UptimeDays   = [math]::Round(((Get-Date) - $os.LastBootUpTime).TotalDays, 1)\n        MemoryGB     = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)\n        FreeDiskGB   = [math]::Round($disk.FreeSpace / 1GB, 1)\n        LoggedOnUser = $cs.UserName\n    }\n    if ($disk.FreeSpace / $disk.Size -lt 0.1) { Write-Warning \"C: has less than 10% free space.\" }\n}\nfinally {\n    Remove-CimSession $session\n}","Desktop Support\\Get-InstalledSoftware.ps1":"<#\n.SYNOPSIS\n    Lists the software installed on a computer, optionally filtered by name.\n.DESCRIPTION\n    Reads the Uninstall keys (64-bit and 32-bit) on the computer through PowerShell remoting.\n.PARAMETER ComputerName\n    The computer to look at.\n.PARAMETER Name\n    Only show software whose name contains this text, e.g. \"Adobe\". Leave blank for everything.\n.NOTES\n    Owner: Desktop Support\n#>\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [string]$Name\n)\n\nInvoke-Command -ComputerName $ComputerName -ArgumentList $Name -ScriptBlock {\n    param($Name)\n    $keys = 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*',\n            'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*'\n    Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue |\n        Where-Object { $_.DisplayName -and (-not $Name -or $_.DisplayName -like \"*$Name*\") } |\n        Select-Object DisplayName, DisplayVersion, Publisher, InstallDate |\n        Sort-Object DisplayName\n}","Desktop Support\\Get-PendingReboot.ps1":"<#\n.SYNOPSIS\n    Shows whether the computer is waiting for a restart, and why.\n.DESCRIPTION\n    Checks the usual places Windows records a pending restart: Windows Update, Component\n    Based Servicing, pending file renames and the ConfigMgr client.\n.NOTES\n    Owner: Desktop Support\n#>\n# RemoteRun: RunOn=Target\nparam()\n\n$reasons = @()\nif (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\WindowsUpdate\\Auto Update\\RebootRequired') { $reasons += 'Windows Update' }\nif (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing\\RebootPending') { $reasons += 'Component Based Servicing' }\n$renames = Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue\nif ($renames) { $reasons += 'Pending file renames' }\ntry {\n    $ccm = Invoke-CimMethod -Namespace 'root\\ccm\\ClientSDK' -ClassName CCM_ClientUtilities -MethodName DetermineIfRebootPending -ErrorAction Stop\n    if ($ccm.RebootPending -or $ccm.IsHardRebootPending) { $reasons += 'ConfigMgr client' }\n} catch { Write-Verbose 'ConfigMgr client not found' }\n\n$os = Get-CimInstance -ClassName Win32_OperatingSystem\n[pscustomobject]@{\n    Computer       = $env:COMPUTERNAME\n    RestartPending = [bool]$reasons\n    Reasons        = $reasons -join ', '\n    LastBoot       = $os.LastBootUpTime\n}","Desktop Support\\Get-UserProfileSize.ps1":"<#\n.SYNOPSIS\n    Shows how much disk space each user profile is using.\n.NOTES\n    Owner: Desktop Support\n#>\nparam()\n\nGet-ChildItem 'C:\\Users' -Directory | ForEach-Object {\n    $size = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum\n    [pscustomobject]@{ Profile = $_.Name; SizeGB = [math]::Round($size / 1GB, 2); LastUsed = $_.LastWriteTime }\n} | Sort-Object SizeGB -Descending","Desktop Support\\Printing\\Clear-PrintQueue.ps1":"<#\n.SYNOPSIS\n    Clears stuck print jobs and restarts the Print Spooler.\n.DESCRIPTION\n    Stops the spooler, deletes everything in the spool folder and starts it again.\n    Runs on the computer itself. Any jobs waiting to print are lost.\n.NOTES\n    Owner: Desktop Support\n#>\n[CmdletBinding()]\nparam()\n\n$spool = Join-Path $env:SystemRoot 'System32\\spool\\PRINTERS'\n$jobs = @(Get-ChildItem -Path $spool -File -ErrorAction SilentlyContinue)\nWrite-Output \"$($jobs.Count) file(s) in the spool folder on $env:COMPUTERNAME\"\n\nStop-Service -Name Spooler -Force\n$jobs | Remove-Item -Force -ErrorAction Continue\nStart-Service -Name Spooler\n\n$svc = Get-Service -Name Spooler\nWrite-Output \"Print Spooler is $($svc.Status)\"","Desktop Support\\Reset-TeamsCache.ps1":"<#\n.SYNOPSIS\n    Clears the Microsoft Teams cache for every user on the computer.\n.DESCRIPTION\n    Closes Teams and deletes the cache folders (classic and new Teams). Users will need to\n    sign in to Teams again.\n.NOTES\n    Owner: Desktop Support\n#>\nparam()\n\nGet-Process -Name 'Teams', 'ms-teams' -ErrorAction SilentlyContinue | Stop-Process -Force\nforeach ($profile in Get-ChildItem 'C:\\Users' -Directory) {\n    $paths = \"$($profile.FullName)\\AppData\\Roaming\\Microsoft\\Teams\",\n             \"$($profile.FullName)\\AppData\\Local\\Packages\\MSTeams_8wekyb3d8bbwe\\LocalCache\"\n    foreach ($p in $paths) {\n        if (Test-Path $p) {\n            Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue\n            Write-Output \"Cleared $p\"\n        }\n    }\n}","Desktop Support\\Restart-ConfigMgrClient.ps1":"<#\n.SYNOPSIS\n    Restarts the ConfigMgr client (SMS Agent Host) on a computer.\n.PARAMETER ComputerName\n    The computer whose client should be restarted.\n.NOTES\n    Owner: Desktop Support\n#>\nparam([Parameter(Mandatory)][string]$ComputerName)\n\nWrite-Output \"Restarting the ConfigMgr client on $ComputerName\"\nRestart-Service -Name CcmExec -Force\nGet-Service -Name CcmExec -ComputerName $ComputerName | Select-Object Name, Status","Desktop Support\\Restart-Device.ps1":"<#\n.SYNOPSIS\n    Restarts a computer after a warning to the logged-on user.\n.PARAMETER ComputerName\n    The computer to restart.\n.PARAMETER DelayMinutes\n    How long to give the user before the restart (0-60).\n.PARAMETER Message\n    The message shown to the user.\n.NOTES\n    Owner: Desktop Support\n#>\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [ValidateRange(0, 60)][int]$DelayMinutes = 5,\n    [string]$Message = 'ICT need to restart this computer to finish some work. Please save your work.'\n)\n\n$seconds = $DelayMinutes * 60\nInvoke-Command -ComputerName $ComputerName -ArgumentList $seconds, $Message -ScriptBlock {\n    param($seconds, $Message)\n    shutdown.exe /r /t $seconds /c $Message /d p:4:1\n}\nWrite-Output \"$ComputerName will restart in $DelayMinutes minute(s).\"","Network Team\\Get-NetworkConfig.ps1":"<#\n.SYNOPSIS\n    Shows the IP configuration, DNS servers and default gateway of a computer.\n.NOTES\n    Owner: Network Team\n#>\nparam()\n\nGet-NetIPConfiguration | Where-Object { $_.IPv4DefaultGateway } | ForEach-Object {\n    [pscustomobject]@{\n        Adapter = $_.InterfaceAlias\n        IPv4    = ($_.IPv4Address.IPAddress -join ', ')\n        Gateway = ($_.IPv4DefaultGateway.NextHop -join ', ')\n        DNS     = ($_.DNSServer.ServerAddresses -join ', ')\n        Status  = $_.NetAdapter.Status\n    }\n}","Network Team\\Test-PortConnectivity.ps1":"<#\n.SYNOPSIS\n    Tests which TCP ports are open on a computer from the server.\n.PARAMETER ComputerName\n    The computer to test.\n.PARAMETER Port\n    The ports to test, one per line or comma-separated.\n.NOTES\n    Owner: Network Team\n#>\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [int[]]$Port = @(135, 445, 3389, 5985)\n)\n\nforeach ($p in $Port) {\n    $client = New-Object System.Net.Sockets.TcpClient\n    $open = $client.ConnectAsync($ComputerName, $p).Wait(1500)\n    $client.Close()\n    [pscustomobject]@{ Computer = $ComputerName; Port = $p; Open = $open }\n}","Service Desk\\Get-LoggedOnUser.ps1":"<#\n.SYNOPSIS\n    Shows who is logged on to a computer and whether the session is locked.\n.PARAMETER ComputerName\n    The computer to check.\n.NOTES\n    Owner: Service Desk\n#>\nparam([Parameter(Mandatory)][string]$ComputerName)\n\n$cs = Get-CimInstance -ClassName Win32_ComputerSystem -ComputerName $ComputerName\n$locked = [bool](Get-CimInstance -ClassName Win32_Process -ComputerName $ComputerName -Filter \"Name='LogonUI.exe'\")\nif (-not $cs.UserName) { Write-Output \"Nobody is logged on to $ComputerName.\" ; return }\n[pscustomobject]@{ Computer = $ComputerName; User = $cs.UserName; Locked = $locked }","Service Desk\\Remove-UserProfile.ps1":"<#\n.SYNOPSIS\n    Deletes a user's profile from a computer so it is rebuilt at their next logon.\n.PARAMETER ComputerName\n    The computer to remove the profile from.\n.NOTES\n    Owner: Service Desk\n#>\nparam([Parameter(Mandatory)][string]$ComputerName)\n\n$user = Read-Host 'Which user (e.g. jsmith)?'\n$profile = Get-WmiObject -Class Win32_UserProfile | Where-Object { $_.LocalPath -like \"*\\$user\" }\nif (-not $profile) { Write-Output \"No profile for $user on $env:COMPUTERNAME\"; return }\nif ($profile.Loaded) { throw \"$user is logged on - ask them to log off first.\" }\n$profile.Delete()\nWrite-Output \"Removed the profile of $user\"","Service Desk\\Test-HomeDriveAccess.ps1":"<#\n.SYNOPSIS\n    Checks that the computer can reach the home drive and shared drive servers.\n.NOTES\n    Owner: Service Desk\n#>\nparam()\n\n$shares = '\\\\fileserver01\\home$', '\\\\fileserver01\\shared'\nforeach ($s in $shares) {\n    [pscustomobject]@{ Share = $s; Reachable = Test-Path -Path $s; From = $env:COMPUTERNAME }\n}","Telecoms\\Get-SoftphoneVersion.ps1":"<#\n.SYNOPSIS\n    Shows the installed softphone client version.\n.NOTES\n    Owner: Telecoms\n#>\nparam()\nGet-ItemProperty 'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*' |\n    Where-Object DisplayName -like '*Softphone*' | Select-Object DisplayName, DisplayVersion"},"version":{"name":"Remote Run Manager","version":"1.0.0","released":"2026-10-28","credits":{"app":"Tim Mahood (Cyber Team Manager)"},"history":[{"version":"1.0.0","date":"2026-10-28","changes":["First release: a page for each ICT team, built from the sub folders of the scripts folder","Access by AD group: app admins, and a script owner group and executor group for each team; break-glass admin account","Target computer box with a quick DNS, ping and remote management (WinRM) check","Signature check on every script, shown green, amber or red: executors see who signed it, script owners and admins also see when and the certificate details","Rescan folder button for script owners: re-reads the team folder, re-checks every signature and says what is new, newly signed, changed or removed","Remote-readiness check: spots prompts, missing -ComputerName, local paths, second-hop shares and more, with guidance for the script owner","Parameters shown as a form; the target computer is filled in automatically","Live output (output, host, warnings, errors, verbose), table view, copy and download","Run history for each team; every run kept with its output, the exact script copy, signer and run-as account","Options: scripts folder, team groups, run-as accounts (encrypted), signing policy, time limits, break-glass account","Audit log, troubleshooting log and user activity log"]}]}}; window.RR_DEMO.data = window.RR_DEMO_DATA; window.RR_GUIDE = "# Remote Run Manager user guide\n\nRemote Run Manager is where ICT teams keep the PowerShell scripts they use to fix and look at computers, and run them against a computer without having to open PowerShell. Each team has its own page, built from its own folder of scripts. Everything that is run is recorded: who ran it, against which computer, why, as which account, and what it printed.\n\n## Running a script\n\n1. **Pick your team** in the menu on the left. You only see the teams you are a member of.\n2. **Type the target computer** in the box at the top of the page and press **Check** (or Enter). The app looks the name up in DNS, pings it and checks that remote management (WinRM) is reachable:\n   - **Online** (green) - ready to go.\n   - **Online, no remote management** (amber) - it answers ping but WinRM is blocked, so scripts that run on the computer will fail.\n   - **Offline** or **Not found** (red) - it is switched off, asleep, off the network, or the name is wrong.\n3. **Press Run** on the script you want. The button shows the computer it will run against.\n4. If the script has options (parameters), fill them in. Anything marked *required* must be filled in. The computer name is filled in for you.\n5. Add a **reason**, such as the ticket number. It is saved with the run.\n6. Press **Run on** *computer*. The output appears as the script runs.\n\nThe target computer stays in the box when you move between teams, so you can run several teams' scripts against the same computer. The last few computers you checked are listed under the box.\n\n> Scripts that restart or shut down a computer ask you to type the computer name to confirm.\n\n## Reading the output\n\nThe output page shows everything the script prints, as it happens:\n\n| Colour | What it is |\n|---|---|\n| Grey | Normal output |\n| White | Messages written with Write-Host |\n| Yellow | Warnings |\n| Red | Errors |\n| Blue | Verbose messages |\n| Purple | Remote Run Manager's own notes (connecting, finished, stopped) |\n\nUse the tick boxes to hide the kinds you don't need. If the script outputs objects (a list of software, for example), **Table** shows them as a table, and **Download .csv** saves them for Excel. **Copy** and **Download .txt** take the text as shown.\n\nThe status at the top is one of:\n\n- **Succeeded** - finished with no errors.\n- **Completed with errors** - finished, but wrote one or more errors. Read the red lines.\n- **Failed** - couldn't start, couldn't connect, or stopped with an error.\n- **Timed out** - still running when the time limit was reached, so it was stopped. A script waiting for someone to type something will do this.\n- **Stopped** - someone pressed **Stop**.\n\nYou can leave the page while a script runs. It carries on, and you can find it again under **Run history**.\n\n## What the colours on a script mean\n\nEvery script has two checks, shown on its card. Click either one for the details. Executors see whether a script is signed and who signed it; script owners and admins also see when, and the certificate details.\n\n### Signature\n\nScripts must be signed with the code signing certificate, so that nobody can change a script without it showing.\n\n- **Green - Signed** by *name* on *date*. The signature is valid and the script hasn't changed since.\n- **Amber - Signed, but not by an approved signer.** The signature is valid but the certificate isn't one of the approved signers. It can still run.\n- **Red - Not signed.** It can't be run until the script owner signs it.\n- **Red - Changed since it was signed.** Someone edited the file after it was signed. It can't be run until the script owner signs it again.\n\nThe signature is checked again just before a script runs, and the exact copy that ran is kept with the run record.\n\n### Remote readiness\n\nLots of scripts are written to be run by hand on the PC. Run from here against another computer, some of them will hang, fail or act on the wrong computer. The app reads each script (it doesn't run it) and looks for the usual problems.\n\n- **Green - Ready to run remotely.** Nothing found.\n- **Amber - Check before running remotely.** It will probably run, but something may not do what you expect. Read the warnings.\n- **Red - Needs changes to run remotely.** As written, it will fail, hang or do the wrong thing. You will be warned before running it. Let the script owner know.\n\n## Run history\n\n**Run history** lists the runs you can see: your own, and every run of your teams' scripts. Filter by team, computer, status and period, and click a run to see its output again. **Team run history** on a team page opens it filtered to that team. Each script's **Details › Runs** tab shows its own history.\n\n## For script owners\n\nScript owners look after their team's scripts. Your team's scripts are the `.ps1` files in your team's folder on the web server, for example `D:\\Scripts\\TeamScripts\\Desktop Support`. Sub folders become headings on the team page.\n\n### Adding or changing a script\n\n1. Write or change the script on your own PC, and test it.\n2. Add a help comment at the top, so people know what it does (see the template below). `.SYNOPSIS` is shown on the card. Put `Owner: <your team>` in `.NOTES`.\n3. Sign it using the Trust's code signing process. Signing must be the very last step: any change afterwards, even a space, breaks the signature and the script shows **Changed since it was signed** until it is signed again.\n4. Copy it into the team folder. It appears on the team page the next time the page is opened.\n\nTo retire a script, move it out of the folder. Its run history stays.\n\n### Rescan folder\n\nNew, changed and removed scripts show up on their own the next time anyone opens the team page. If you have just signed a script, or something doesn't look right, press **Rescan folder** on the team page. It reads every script in the folder again, re-checks every signature, and tells you what it found: new scripts, scripts that are now signed (or no longer signed), changed scripts and removed ones. Only script owners and app admins see the button.\n\n### Making scripts work in Remote Run Manager\n\nRemote Run Manager can run a script in one of two ways. It picks one from the script itself:\n\n| | Runs on the target | Runs from the server |\n|---|---|---|\n| When | The script has **no** computer name parameter | The script has a `-ComputerName` parameter (or `-Computer`, `-Target`, `-HostName`, `-DeviceName`) |\n| How | The script is sent to the target computer and run there through PowerShell remoting (WinRM) | The script runs on the web server, with the target computer passed in `-ComputerName` |\n| `$env:COMPUTERNAME`, `C:\\`, `HKLM:` | Mean the target computer | Mean the **web server** |\n| Good for | Fixing things on the PC: services, files, registry, caches | Looking things up remotely (CIM/WMI), checking ports, anything that talks to several systems |\n\nTo choose yourself, put one of these lines near the top of the script:\n\n```\n# RemoteRun: RunOn=Target\n# RemoteRun: RunOn=Server\n```\n\nThe checks look for these problems:\n\n- **Waits for someone to type or click** (needs changes). `Read-Host`, `Get-Credential`, `Pause`, `Out-GridView`, message boxes and forms. Nobody can answer them, so the script sits there until the time limit. Turn each question into a parameter: the web page shows a box for every parameter and asks for it before the script runs.\n- **Never uses -ComputerName** (needs changes). The script has the parameter but doesn't use it, so everything happens on the web server.\n- **Some commands will run against the web server** (check). On the server, `Get-CimInstance`, `Get-WmiObject`, `Get-Service`, `Get-EventLog` and similar act on the server unless you add `-ComputerName $ComputerName`.\n- **Some commands can only act on the computer they run on** (check). `Restart-Service`, `Stop-Process`, `Start-Process` and similar have no `-ComputerName`. Put them inside `Invoke-Command -ComputerName $ComputerName -ScriptBlock { ... }`, or make the whole script run on the target.\n- **Refers to \"this computer\"** (check). `$env:COMPUTERNAME`, `localhost` and `.` mean the web server when the script runs from the server. Use `$ComputerName`.\n- **Uses local drive or registry paths** (check). `C:\\...` and `HKLM:\\...` are the server's when the script runs from the server.\n- **Needs files that sit next to the script** (needs changes). Only the script itself is sent to the target, so `$PSScriptRoot`, dot-sourced `.ps1` files and modules loaded from a path aren't there. Copy the functions into the script.\n- **Reads or writes a network share** (check). From the target computer, the run-as account's password can't be passed on to a file server (the \"second hop\"), so shares usually say Access denied. Give the target computers' own accounts read access to the share, or run the script from the server and copy files to `\\\\<computer>\\C$`.\n- **Starts its own remote session** (check). A script already running on the target that connects to another computer is a second hop.\n- **Has parameters the web page can't fill in**. The page can pass text, numbers, true/false switches, dates and lists. For credentials, use the team's run-as account instead of a `[PSCredential]` parameter.\n- **Has a password written in the script** (check). Remove it and use a run-as account.\n- **Restarts or shuts down the computer** (note). People are asked to confirm before running it.\n\nWrite results with `Write-Output` (or just output objects) rather than `Write-Host` where you can. Objects appear in the **Table** view and can be downloaded as CSV.\n\n### A template\n\n```\n<#\n.SYNOPSIS\n    One line saying what the script does - shown on the card.\n.DESCRIPTION\n    More detail, shown under Details.\n.PARAMETER ComputerName\n    The computer to run against. Filled in from the target box.\n.PARAMETER UserName\n    Describe each of your own parameters - shown on the run form.\n.NOTES\n    Owner: Desktop Support\n#>\n[CmdletBinding()]\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [Parameter(Mandatory)][string]$UserName,\n    [switch]$WhatIf\n)\n\nInvoke-Command -ComputerName $ComputerName -ArgumentList $UserName -ScriptBlock {\n    param($UserName)\n    # This part runs on the target computer\n    Get-CimInstance -ClassName Win32_UserProfile | Where-Object LocalPath -like \"*\\$UserName\" |\n        Select-Object LocalPath, Loaded, LastUseTime\n}\n```\n\n### Owner settings\n\nOn a script's **Details › Owner settings** tab you can:\n\n- **Run as** a different account from the team default, choosing from the accounts the app admins have allowed your team to use.\n- **Hide it from executors**, for example while you are testing a new version. Owners and admins still see it.\n\n## For app admins\n\nApp admins see every team and the **Options** page (open it from your name at the bottom of the menu), plus **User activity** and **Logs**.\n\n### Setting up a team\n\n1. Create a sub folder of the scripts folder named after the team, e.g. `Desktop Support`. It appears on **Options › Teams and groups** as *Not set up*, and only admins can see it.\n2. Press **Edit** and add the AD group(s) for the team's **script owners** and **executors**. **Search AD** finds groups by name or description.\n3. Choose the account the team's scripts run as (see below).\n4. Save. Members of the groups can use it straight away; there's no restart.\n\nGive the script owners modify rights on the team folder in Windows, and everyone else read-only.\n\n### Run-as accounts\n\nScripts run as the run-as account chosen for the team (or for the script), or the app's own account if none is chosen. Add accounts on **Options › Run-as accounts**:\n\n- Use a dedicated service account for each team, with only the rights the team's scripts need (for example local admin on workstations).\n- Tick the teams that may use it; leave them all unticked to let every team use it.\n- **Test** checks the password with Active Directory and can connect to a computer with PowerShell remoting as the account.\n- Passwords are encrypted for the app's own account on this server, and can't be read back. If the app's account or server changes, enter them again.\n\n### Signing and running\n\nOn **Options › Scripts and signing**:\n\n- **Allow unsigned scripts to run** - off by default. Leave it off.\n- **Approved signers** - certificate thumbprints or names. Leave blank to accept any valid signature from a certificate the server trusts. Scripts signed by anyone else show amber.\n- **Block scripts that need changes** - stop people running scripts the check marks red.\n- **Ask for a reason before every run** - make the reason box required.\n- **Time limit**, **scripts running at once**, **target check timeout**, and how long runs and activity are kept.\n\n### Admins and break-glass\n\n**Options › Admins and break-glass** sets the AD groups for app admins, and the break-glass admin account: a local account for when AD sign-in isn't working. Keep its password in the password vault. Every sign-in with it is in the audit log, and five wrong passwords lock it for 15 minutes.\n\n## Records and logs\n\n| What | Where | Who can see it |\n|---|---|---|\n| Run history, with output and the exact script that ran | `data\\jobs` | The person who ran it, the team, app admins |\n| User activity - every page and action, in plain English | `data\\activity` | App admins (**User activity**) |\n| Audit log - runs, changes to settings, teams, accounts and sign-ins | `Logs\\RRManager-Audit.log` | App admins (**Logs**), or CMTrace |\n| Troubleshooting log - errors and timings | `Logs\\RRManager-Troubleshooting.log` | App admins (**Logs**), or CMTrace |\n";</script>
<script>
'use strict';
/*
  Remote Run Manager - front end
  Plain JavaScript with no external dependencies, so it works on networks without internet access.
  Talks to the Pode API under ./api/. With window.RR_DEMO set (the demo build) it runs entirely
  on built-in sample data.
*/

/* ================================================================ helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const toDate = v => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
const fmtDateTime = v => { const d = toDate(v); return d ? d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : (v || '—'); };
const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : (v || '—'); };
const fmtTime = v => { const d = toDate(v); return d ? d.toLocaleTimeString('en-GB') : (v || ''); };
function ago(v) {
  const d = toDate(v); if (!d) return '';
  const s = (Date.now() - d) / 1000, a = Math.abs(s);
  const f = (n, u) => { n = Math.round(n); return `${n} ${u}${n === 1 ? '' : 's'}`; };
  const t = a < 60 ? null : a < 3600 ? f(a / 60, 'min') : a < 86400 ? f(a / 3600, 'hour') : f(a / 86400, 'day');
  if (!t) return 'just now';
  return s < 0 ? `in ${t}` : `${t} ago`;
}
function duration(a, b) {
  const x = toDate(a), y = toDate(b) || (x ? new Date() : null); if (!x || !y) return '—';
  const s = Math.max(0, Math.round((y - x) / 1000));
  return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min ${s % 60} s` : `${Math.floor(s / 3600)} h ${Math.floor(s / 60) % 60} min`;
}
const shortUser = u => String(u || '').split('\\').pop();
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;

/* ================================================================ state & API */
const App = {
  demo: !!window.RR_DEMO,
  me: null, view: null, timers: [], teams: [], team: null, poll: null,
  target: { name: '', result: null, checking: false }
};
const TARGET_KEY = 'rr.target', RECENT_KEY = 'rr.recentTargets', THEME_KEY = 'rr.theme';

async function api(path, { method = 'GET', body, quiet = false } = {}) {
  if (App.demo) return Mock.handle(path, method, body);
  const headers = body ? { 'Content-Type': 'application/json' } : {};
  if (quiet) headers['X-RR-Background'] = '1';
  let res;
  try { res = await fetch('api/' + path, { method, credentials: 'same-origin', headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Can’t reach the web server. Check your network connection, or ask an app admin whether the Remote Run Manager service is running.'); }
  if (res.status === 401) throw new Error('Your sign-in has expired or wasn’t accepted. Refresh the page to sign in again.');
  let data = null;
  try { data = await res.json(); } catch (_) { }
  if (!res.ok) throw new Error((data && data.error) || `${res.status} ${res.statusText}`);
  return data;
}
const logActivity = action => api('activity', { method: 'POST', body: { action } }).catch(() => { });

async function copyText(text, done = 'Copied to the clipboard') {
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(done, 'ok');
}
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvText = (cols, rows) => [cols, ...rows.map(r => cols.map(c => r[c]))].map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\r\n');

/* ================================================================ UI bits */
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 4500);
  setTimeout(() => el.remove(), 5000);
}
const badge = (text, kind = '', title = '') => `<span class="badge ${kind}"${title ? ` title="${esc(title)}"` : ''}>${esc(text)}</span>`;
const spinEl = () => `<span class="spin" style="animation-delay:-${Math.round(performance.now() % 1100)}ms"></span>`;
const spinner = (text = 'Loading…') => `<div class="loading">${spinEl()}${esc(text)}</div>`;
function prefGet(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (_) { return def; } }
function prefSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { } }
const errorBox = e => `<div class="alert error">${esc(e && e.message ? e.message : e)}</div>`;
const empty = text => `<div class="empty">${esc(text)}</div>`;
const kv = (label, value, raw = false) => `<div><span>${esc(label)}</span>${value === null || value === undefined || value === '' ? '—' : raw ? value : esc(value)}</div>`;
const pageHeader = (title, sub, actions = '') =>
  `<div class="page-head"><div><h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="toolbar">${actions}</div></div>`;
const card = (label, valueHtml, subHtml = '') =>
  `<div class="card"><div class="label">${esc(label)}</div><div class="value">${valueHtml}</div><div class="sub">${subHtml}</div></div>`;
const table = (head, rows, cls = '') =>
  `<div class="table-wrap"><table class="data ${cls}"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;

/* Modal. confirmText:null gives an information dialog with just a Close button. */
function modal({ title, body, confirmText = 'Confirm', danger = false, confirmMatch = null, onConfirm, wide = false, tall = false, onOpen }) {
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `<div class="dialog${wide ? ' wide' : ''}${tall ? ' tall' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <header><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">×</button></header>
      <div class="dialog-body">${body}
        ${confirmMatch ? `<label class="field"><span>Type <code>${esc(confirmMatch)}</code> to confirm</span><input id="confirmInput" autocomplete="off" spellcheck="false"></label>` : ''}
        <div class="alert error hidden" id="dialogError"></div>
      </div>
      <footer><button class="btn" data-close>${confirmText ? 'Cancel' : 'Close'}</button>
        ${confirmText ? `<button class="btn ${danger ? 'danger' : 'primary'}" id="modalOk">${esc(confirmText)}</button>` : ''}</footer></div>`;
    m.classList.remove('hidden');
    const close = v => { m.classList.add('hidden'); m.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(false); };
    document.addEventListener('keydown', onKey);
    $$('[data-close]', m).forEach(b => b.onclick = () => close(false));
    if (onOpen) onOpen(m, close);
    const ok = $('#modalOk', m);
    if (!ok) return;
    const inp = $('#confirmInput', m);
    if (inp) {
      ok.disabled = true;
      inp.addEventListener('input', () => ok.disabled = inp.value.trim().toUpperCase() !== confirmMatch.toUpperCase());
    }
    ok.onclick = async () => {
      ok.disabled = true;
      const errEl = $('#dialogError', m);
      errEl.classList.add('hidden');
      try { const r = onConfirm ? await onConfirm(m) : true; if (r !== false) close(r === undefined ? true : r); else ok.disabled = false; }
      catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); ok.disabled = false; }
    };
  });
}

/* ================================================================ status helpers */
const SIG = {
  ok: { dot: 'ok', label: 'Signed' },
  warn: { dot: 'warn', label: 'Signed - check signer' },
  bad: { dot: 'err', label: 'Not signed' }
};
function sigLabel(sig) {
  if (sig.status === 'Valid') return sig.state === 'warn' ? 'Signed, but not by an approved signer' : 'Signed';
  return { NotSigned: 'Not signed', HashMismatch: 'Changed since it was signed', NotTrusted: 'Signed, certificate not trusted', UnknownError: 'Signature can’t be verified', Unknown: 'Signature not checked' }[sig.status] || 'Signature problem';
}
// Executors are only told whether a script is signed and by whom; owners and admins also see when.
function sigDetail(sig, full) {
  if (!sig.signer) return sig.status === 'NotSigned' ? 'Can’t be run until the script owner signs it.' : esc(sig.summary);
  if (!full) return `by <b>${esc(sig.signer)}</b>`;
  const when = sig.signedOn ? `on ${fmtDateTime(sig.signedOn)}` : 'date unknown (no timestamp)';
  return `by <b>${esc(sig.signer)}</b> ${when}`;
}
const READY = {
  Ready: { kind: 'ok', label: 'Ready to run remotely', short: 'Ready' },
  Check: { kind: 'warn', label: 'Check before running remotely', short: 'Check' },
  NeedsChanges: { kind: 'err', label: 'Needs changes to run remotely', short: 'Needs changes' }
};
const RUN_STATUS = {
  Queued: ['Queued', 'info'], Running: ['Running', 'info'], Succeeded: ['Succeeded', 'ok'], CompletedWithErrors: ['Completed with errors', 'warn'],
  Failed: ['Failed', 'err'], Stopped: ['Stopped', 'warn'], TimedOut: ['Timed out', 'err']
};
const runBadge = s => { const [l, k] = RUN_STATUS[s] || [s, '']; return badge(l, k); };
const runOnText = s => s.runOn === 'Target' ? 'Runs on the target computer (PowerShell remoting)' : `Runs on the web server against the target (-${s.targetParam || 'ComputerName'})`;
const runAsText = (name, me) => name ? name : 'the app’s own account';
const roleBadge = r => badge({ Admin: 'App admin', Owner: 'Script owner', Executor: 'Executor' }[r] || r, { Admin: 'brand', Owner: 'info', Executor: '' }[r] || '');

/* ================================================================ routing */
const VIEWS = { team: renderTeam, run: renderRun, history: renderHistory, activity: renderActivity, logs: renderLogs, options: renderOptions, help: renderHelp };
const ADMIN_VIEWS = ['activity', 'logs', 'options'];

function route() {
  App.timers.forEach(clearTimeout); App.timers = [];
  if (App.poll) { clearTimeout(App.poll); App.poll = null; }
  closeUserMenu();
  const [v, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
  const arg = rest.length && rest[0] ? decodeURIComponent(rest.join('/')) : null;
  if (!App.me.isAdmin && !Object.keys(App.me.teams || {}).length && v !== 'help') { App.view = 'noaccess'; renderNoAccess(); return; }
  let view = VIEWS[v] && (App.me.isAdmin || !ADMIN_VIEWS.includes(v)) ? v : 'team';
  App.view = view;
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view && (view !== 'team' || a.dataset.team === (arg || App.teams[0]?.name))));
  const ub = $('#userBtn'); if (ub) ub.classList.toggle('active', view === 'options');
  const titles = { run: 'Run', history: 'Run history', activity: 'User activity', logs: 'Logs', options: 'Options', help: 'Help' };
  document.title = `${App.demo ? 'DEMO - ' : ''}${view === 'team' ? (arg || App.teams[0]?.name || 'Teams') : titles[view]} · Remote Run Manager`;
  VIEWS[view](arg);
}
const later = (fn, ms) => App.timers.push(setTimeout(fn, ms));

/* ================================================================ sidebar */
const ICON = {
  refresh: '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" style="margin-right:6px;vertical-align:-2px"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>',
  team: '<svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>',
  history: '<svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/></svg>',
  activity: '<svg viewBox="0 0 24 24"><path d="M3 11h4l3-7 4 16 3-9h4v2h-2.6L14 23 10 9l-1.7 4H3z"/></svg>',
  logs: '<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM8 12h8v1.5H8zm0 3h8v1.5H8zm0 3h5v1.5H8z"/></svg>',
  help: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>'
};

function renderNav() {
  if (!App.me.isAdmin && !Object.keys(App.me.teams || {}).length) { $('#nav').innerHTML = `<a href="#noaccess" data-view="noaccess">${ICON.team}<span>Access</span></a><a href="#help" data-view="help">${ICON.help}<span>Help &amp; guidance</span></a>`; return; }
  const teams = App.teams.map(t => `<a href="#team/${encodeURIComponent(t.name)}" data-view="team" data-team="${esc(t.name)}">${ICON.team}<span>${esc(t.name)}</span>
      ${!t.configured ? '<em class="nav-pill warn" title="No groups set yet - only app admins can see it">Not set up</em>' : !t.enabled ? '<em class="nav-pill" title="Turned off on the Options page">Off</em>' : `<em class="nav-count">${t.scripts}</em>`}</a>`).join('');
  $('#nav').innerHTML = `<div class="nav-head">Teams</div>${teams || '<div class="nav-empty">No team folders found</div>'}
    <div class="nav-sep"></div>
    <a href="#history" data-view="history">${ICON.history}<span>Run history</span></a>
    ${App.me.isAdmin ? `<a href="#activity" data-view="activity">${ICON.activity}<span>User activity</span></a><a href="#logs" data-view="logs">${ICON.logs}<span>Logs</span></a>` : ''}
    <div class="nav-sep"></div>
    <a href="#help" data-view="help">${ICON.help}<span>Help &amp; guidance</span></a>`;
}

async function loadTeams() {
  if (!App.me.isAdmin && !Object.keys(App.me.teams || {}).length) { App.teams = []; return; }
  const d = await api('teams', { quiet: true });
  App.teams = d.items; App.scriptRoot = d.scriptRoot; App.rootExists = d.rootExists;
}

/* ================================================================ target computer */
function recentTargets() { return prefGet(RECENT_KEY, []); }
function addRecent(n) { prefSet(RECENT_KEY, [n, ...recentTargets().filter(x => x !== n)].slice(0, 6)); }

function targetBarHtml() {
  const t = App.target;
  return `<section class="target-bar" aria-label="Target computer">
    <div class="tb-main">
      <label for="tgtInput">Target computer</label>
      <div class="tb-input"><input id="tgtInput" value="${esc(t.name)}" placeholder="Computer name, e.g. PC-DEMO-0142" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="tgtCheck">Check</button></div>
      <div id="tgtStatus" class="tb-status" aria-live="polite">${targetStatusHtml()}</div>
    </div>
    ${recentTargets().length ? `<div class="tb-recent"><span>Recent:</span>${recentTargets().map(n => `<button class="chip" data-recent="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
  </section>`;
}
function targetStatusHtml() {
  const t = App.target, r = t.result;
  if (t.checking) return `<span class="tb-state">${spinEl()} Checking ${esc(t.name)}…</span>`;
  if (!r) return `<span class="tb-msg">Type a computer name and press <b>Check</b> to see if it’s online. Scripts run against this computer.</span>`;
  const dot = !r.dns || !r.online ? 'err' : r.winrm ? 'ok' : 'warn';
  const head = !r.dns ? 'Not found' : !r.online ? 'Offline' : r.winrm ? 'Online' : 'Online, no remote management';
  const bits = [r.ms !== null && r.ms !== undefined ? `${r.ms} ms` : '', r.ip || '', r.dns && r.online ? `WinRM ${r.winrm ? 'OK' : 'not reachable'}` : ''].filter(Boolean);
  return `<span class="tb-state"><i class="dot ${dot}"></i><b>${esc(r.computer)}</b> ${badge(head, dot)} ${bits.map(b => `<span class="muted">${esc(b)}</span>`).join('<span class="sep">·</span>')}</span>
    <span class="tb-msg">${esc(r.message)} <span class="muted">Checked ${esc(ago(r.checked))}.</span></span>`;
}
function bindTargetBar(onChange) {
  const inp = $('#tgtInput'), btn = $('#tgtCheck');
  const go = () => checkTarget(inp.value, onChange);
  btn.onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  inp.oninput = () => {
    const v = inp.value.trim().toUpperCase();
    if (v !== App.target.name) { App.target = { name: v, result: null, checking: false }; $('#tgtStatus').innerHTML = targetStatusHtml(); onChange && onChange(); }
  };
  $$('[data-recent]').forEach(b => b.onclick = () => { inp.value = b.dataset.recent; go(); });
}
async function checkTarget(name, onChange) {
  const n = String(name || '').trim().toUpperCase();
  if (!n) { toast('Type a computer name first.'); $('#tgtInput')?.focus(); return null; }
  App.target = { name: n, result: null, checking: true };
  const st = $('#tgtStatus'); if (st) st.innerHTML = targetStatusHtml();
  onChange && onChange();
  try {
    const r = await api('target/' + encodeURIComponent(n));
    if (App.target.name !== n) return null;
    App.target = { name: n, result: r, checking: false };
    prefSet(TARGET_KEY, n);
    if (r.dns) addRecent(n);
  }

// Script owners and admins: read the folder again, re-check every signature, and say what changed.
async function rescanTeam() {
  const btn = $('#teamRefresh'); btn.disabled = true; btn.innerHTML = `${ICON.refresh}Rescanning…`;
  const before = new Map(App.team.data.items.map(s => [s.path, s]));
  await loadTeam(true);
  if (!App.team.data || App.view !== 'team') return;
  const after = App.team.data.items, found = [], gone = [], signed = [], unsigned = [], changed = [];
  after.forEach(s => {
    const b = before.get(s.path);
    if (!b) { found.push(s.name); return; }
    if (b.signature.state !== 'ok' && s.signature.state === 'ok') signed.push(s.name);
    else if (b.signature.state === 'ok' && s.signature.state !== 'ok') unsigned.push(s.name);
    else if (b.sha256 !== s.sha256) changed.push(s.name);
  });
  before.forEach((b, p) => { if (!after.some(s => s.path === p)) gone.push(b.name); });
  const parts = [[found, 'new'], [signed, 'now signed'], [unsigned, 'no longer signed'], [changed, 'changed'], [gone, 'removed']]
    .filter(([l]) => l.length).map(([l, w]) => `${l.length} ${w} (${l.join(', ')})`);
  toast(parts.length ? `Rescanned: ${parts.join('; ')}.` : `Rescanned ${plural(after.length, 'script')}. Nothing has changed.`, parts.length ? 'ok' : '');
}

/* ---------------------------------------------------------------- run dialog */
function paramField(p) {
  const id = 'p_' + p.name, req = p.mandatory ? ' <em class="req">required</em>' : '';
  const label = `<span>-${esc(p.name)}${req} <span class="hint mono">[${esc(p.type)}]</span></span>`;
  const help = p.description ? `<small>${esc(p.description)}</small>` : '';
  const def = p.default ? String(p.default).replace(/^['"]|['"]$/g, '') : '';
  if (!p.fillable) return `<div class="field">${label}<div class="alert ${p.mandatory ? 'error' : 'info'}">This parameter can’t be filled in from the web page${p.mandatory ? ', so the script can’t run' : ' and will be left at its default'}.</div></div>`;
  if (p.type === 'SwitchParameter' || p.type === 'Boolean') return `<label class="check"><input type="checkbox" id="${id}" data-param="${esc(p.name)}"> -${esc(p.name)}${help ? ` <span class="hint">- ${esc(p.description)}</span>` : ''}</label>`;
  if (p.validateSet.length) return `<label class="field">${label}<select id="${id}" data-param="${esc(p.name)}">${p.mandatory ? '' : '<option value="">(default)</option>'}${p.validateSet.map(v => `<option ${v === def ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>${help}</label>`;
  if (/\[\]$/.test(p.type)) return `<label class="field">${label}<textarea id="${id}" data-param="${esc(p.name)}" rows="3" placeholder="${esc(def ? 'Default: ' + def : 'One per line')}"></textarea>${help || '<small>One per line.</small>'}</label>`;
  const type = /^Int|Double/.test(p.type) ? 'number' : p.type === 'DateTime' ? 'datetime-local' : 'text';
  return `<label class="field">${label}<input id="${id}" type="${type}" data-param="${esc(p.name)}" placeholder="${esc(def ? 'Default: ' + def : '')}" autocomplete="off">${help}</label>`;
}

  const body = `${warnings.join('')}
    <div class="run-summary">
      ${kv('Target computer', `<b>${esc(t.computer)}</b> ${badge(t.online ? 'Online' : 'Offline', t.online ? 'ok' : 'err')}`, true)}

    </div>
    ${ps.length ? `<h4>Options</h4>${ps.map(paramField).join('')}` : ''}
    <label class="field"><span>Reason${App.team.data.policy.requireReason ? ' <em class="req">required</em>' : ' <span class="hint">(optional)</span>'}</span><input id="runReason" placeholder="e.g. INC0123456 - printer jobs stuck" maxlength="500" autocomplete="off"><small>Saved in the run history and activity log.</small></label>
    ${r.restarts ? `<div class="alert warn">This script restarts or shuts down <b>${esc(t.computer)}</b>. Anyone using it will lose unsaved work.</div>` : ''}`;
  await modal({
    title: `Run ${s.name} on ${t.computer}`, body, confirmText: `Run on ${t.computer}`, confirmMatch: r.restarts ? t.computer : null, wide: true,
    onConfirm: async m => {
      const params = {};
      $$('[data-param]', m).forEach(i => { params[i.dataset.param] = i.type === 'checkbox' ? i.checked : i.value; });
      const res = await api('run', { method: 'POST', body: { team, path: s.path, computer: t.computer, params, reason: $('#runReason', m).value.trim() } });
      later(() => { location.hash = '#run/' + res.jobId; }, 10);
    }
  });
}

/* ================================================================ a run (live output) */
const LINE_TYPES = [['output', 'Output'], ['host', 'Messages'], ['warning', 'Warnings'], ['error', 'Errors'], ['verbose', 'Verbose'], ['system', 'Remote Run Manager']];
async function renderRun(id) {
  const c = $('#content');
  c.innerHTML = spinner();
  const st = { id, job: null, lines: [], view: 'text', show: prefGet('rr.lineTypes', { output: 1, host: 1, warning: 1, error: 1, verbose: 1, system: 1, debug: 1 }) };
  const tick = async () => {
    try {
      const j = await api(`jobs/${encodeURIComponent(id)}?since=${st.lines.length}`, { quiet: !!st.job });
      if (App.view !== 'run') return;
      const fresh = j.lines || [];
      st.lines = st.lines.concat(fresh);
      const first = !st.job;
      st.job = j;
      if (first) draw(); else update(fresh);
      if (['Queued', 'Running'].includes(j.status)) App.poll = setTimeout(tick, 1000);
    }
    catch (e) { if (!st.job) c.innerHTML = pageHeader('Run', '') + errorBox(e); else toast(e.message, 'err'); }
  };
  const lineHtml = l => `<div class="ln-${esc(l.t)}${st.show[l.t] === 0 ? ' hidden' : ''}"><span class="lt">${esc(fmtTime(l.at))}</span><span class="lx">${esc(l.x) || ' '}</span></div>`;
  const summaryHtml = () => {
    const j = st.job;
    return `<div class="cards run-cards">
      ${card('Status', runBadge(j.status), ['Queued', 'Running'].includes(j.status) ? `${spinEl()} running for ${esc(duration(j.started || j.created))}` : `took ${esc(duration(j.started || j.created, j.finished))}`)}
      ${card('Target computer', esc(j.computer), j.runOn === 'Target' ? 'Ran on the computer itself' : `Ran on the web server, -${esc(j.targetParam)} ${esc(j.computer)}`)}
      ${card('Run as', esc(shortUser(j.runAsUser)), j.runAs ? `Run-as account “${esc(j.runAs)}”` : 'The app’s own account')}
      ${card('Errors and warnings', `${j.errors} / ${j.warnings}`, j.errors ? 'See the red lines below' : 'None')}
    </div>`;
  };
  const draw = () => {
    const j = st.job;
    const params = Object.entries(j.params || {}).filter(([k]) => k !== j.targetParam);
    c.innerHTML = pageHeader(`${j.scriptName} on ${j.computer}`,
      `<a href="#team/${encodeURIComponent(j.team)}">${esc(j.team)}</a> · started by <b>${esc(j.user)}</b> ${esc(fmtDateTime(j.created))} (${esc(ago(j.created))})`,
      `<a class="btn" href="#team/${encodeURIComponent(j.team)}">Back to ${esc(j.team)}</a><button class="btn danger-ghost ${['Queued', 'Running'].includes(j.status) ? '' : 'hidden'}" id="runStop">Stop</button>`) +
      `<div id="runSummary">${summaryHtml()}</div>
      <div class="panel">
        <h3>Output <span class="right toolbar">
          <span class="line-filters">${LINE_TYPES.map(([k, l]) => `<label class="check small"><input type="checkbox" data-lt="${k}" ${st.show[k] === 0 ? '' : 'checked'}> ${l}</label>`).join('')}</span>
          <span class="segmented" id="viewSeg"><button data-v="text" class="active">Text</button><button data-v="table" ${j.table && j.table.length ? '' : 'disabled title="The script didn’t output any objects"'}>Table</button></span>
          <button class="btn small" id="outCopy">Copy</button><button class="btn small" id="outTxt">Download .txt</button><button class="btn small ${j.table && j.table.length ? '' : 'hidden'}" id="outCsv">Download .csv</button>
        </span></h3>
        <div id="outText" class="console" role="log" aria-live="polite">${st.lines.map(lineHtml).join('')}</div>
        <div id="outTable" class="hidden"></div>
      </div>
      <details class="panel about-run"><summary>About this run</summary><div class="kv">
        ${kv('Script', `${j.team}\\${j.script}`)}${kv('Reason', j.reason || '(none given)')}${kv('Options', params.length ? params.map(([k, v]) => `-${k} ${Array.isArray(v) ? v.join(',') : v}`).join('  ') : 'None')}
        ${kv('Signed by', j.signature && j.signature.signer ? `${j.signature.signer}${j.signature.signedOn ? ' on ' + fmtDateTime(j.signature.signedOn) : ''}` : 'Not signed')}
        ${kv('Script hash (SHA256)', j.sha256)}${kv('Remote readiness when run', READY[j.readiness] ? READY[j.readiness].short : j.readiness)}${kv('Run id', j.id)}
      </div><p class="hint">A copy of exactly the script that ran is kept with this record on the server.</p></details>`;
    const out = $('#outText'); out.scrollTop = out.scrollHeight;
    $$('[data-lt]').forEach(cb => cb.onchange = () => { st.show[cb.dataset.lt] = cb.checked ? 1 : 0; if (cb.dataset.lt === 'verbose') st.show.debug = st.show.verbose; prefSet('rr.lineTypes', st.show); $$(`.ln-${cb.dataset.lt}`, out).forEach(x => x.classList.toggle('hidden', !cb.checked)); });
    $$('#viewSeg button').forEach(b => b.onclick = () => { st.view = b.dataset.v; $$('#viewSeg button').forEach(x => x.classList.toggle('active', x === b)); drawTable(); });
    $('#outCopy').onclick = () => copyText(plainText());
    $('#outTxt').onclick = () => { download(`${j.scriptName}-${j.computer}-${j.id}.txt`, plainText()); logActivity(`Downloaded the output of run ${j.id} (${j.scriptName} on ${j.computer})`); };
    $('#outCsv').onclick = () => { const t = st.job.table || []; const cols = Object.keys(t[0] || {}); download(`${j.scriptName}-${j.computer}-${j.id}.csv`, csvText(cols, t), 'text/csv'); logActivity(`Downloaded the table output of run ${j.id} as CSV`); };
    const stop = $('#runStop');
    stop.onclick = () => modal({ title: 'Stop this run?', body: `<p>Stop <b>${esc(j.scriptName)}</b> on <b>${esc(j.computer)}</b>? Anything it has already changed stays changed.</p>`, confirmText: 'Stop it', danger: true,
      onConfirm: async () => { await api(`jobs/${j.id}/stop`, { method: 'POST' }); toast('Asked the script to stop'); } });
  };
  const update = fresh => {
    $('#runSummary').innerHTML = summaryHtml();
    const out = $('#outText');
    if (fresh.length && out) {
      const atEnd = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
      out.insertAdjacentHTML('beforeend', fresh.map(lineHtml).join(''));
      if (atEnd) out.scrollTop = out.scrollHeight;
    }
    if (!['Queued', 'Running'].includes(st.job.status)) {
      $('#runStop')?.classList.add('hidden');
      const has = st.job.table && st.job.table.length;
      const tb = $('#viewSeg [data-v=table]'); if (tb && has) { tb.disabled = false; tb.title = ''; }
      $('#outCsv')?.classList.toggle('hidden', !has);
      toast(`${st.job.scriptName} on ${st.job.computer}: ${RUN_STATUS[st.job.status][0].toLowerCase()}`, st.job.status === 'Succeeded' ? 'ok' : '');
    }
  };
  const drawTable = () => {
    const t = st.job.table || [];
    $('#outText').classList.toggle('hidden', st.view !== 'text');
    const el = $('#outTable'); el.classList.toggle('hidden', st.view !== 'table');
    if (st.view !== 'table') return;
    const cols = Object.keys(t[0] || {});
    el.innerHTML = t.length ? table(cols, t.map(r => `<tr>${cols.map(k => `<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')) + `<p class="hint">${plural(t.length, 'row')}${t.length >= 1000 ? ' (the first 1000)' : ''}.</p>` : empty('No objects were output.');
  };
  const plainText = () => st.lines.filter(l => st.show[l.t] !== 0).map(l => `${fmtTime(l.at)}  ${l.t === 'output' || l.t === 'host' ? '' : `[${l.t.toUpperCase()}] `}${l.x}`).join('\r\n');
  await tick();
}

/* ================================================================ run history */
function runTable(items, showTeam = true) {
  return table(['Started', ...(showTeam ? ['Team'] : []), 'Script', 'Computer', 'By', 'Status', 'Took', 'Reason'], items.map(j => `<tr class="clickable" data-job="${esc(j.id)}">
    <td class="nowrap" title="${esc(fmtDateTime(j.created))}">${esc(fmtDateTime(j.created))}<div class="hint">${esc(ago(j.created))}</div></td>${showTeam ? `<td>${esc(j.team)}</td>` : ''}
    <td>${esc(j.scriptName)}</td><td class="mono nowrap">${esc(j.computer)}</td><td>${esc(shortUser(j.user))}</td><td>${runBadge(j.status)}${j.errors ? ` <span class="hint">${plural(j.errors, 'error')}</span>` : ''}</td>
    <td class="nowrap">${esc(duration(j.started || j.created, j.finished))}</td><td>${esc(j.reason || '')}</td></tr>`).join(''));
}

/* ================================================================ help */
function mdInline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((#[a-z]+(?:\/[\w-]*)?|https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
}
function renderMarkdown(md) {
  const ls = md.replace(/\r/g, '').split('\n'), out = [], toc = [];
  let i = 0, slugN = 0;
  const para = [];
  const flush = () => { if (para.length) { out.push(`<p>${mdInline(para.join(' '))}</p>`); para.length = 0; } };
  while (i < ls.length) {
    const l = ls[i];
    let m;
    if (!l.trim()) { flush(); i++; continue; }
    if (l.startsWith('```')) {
      flush(); const code = []; i++;
      while (i < ls.length && !ls[i].startsWith('```')) code.push(ls[i++]);
      i++; out.push(`<pre class="code">${esc(code.join('\n'))}</pre>`); continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
      flush();
      const lvl = m[1].length, id = 'g-' + (++slugN);
      out.push(`<h${lvl} id="${id}">${mdInline(m[2])}</h${lvl}>`);
      if (lvl === 2) toc.push(`<a href="#help" data-target="${id}">${esc(m[2].replace(/[`*]/g, ''))}</a>`);
      i++; continue;
    }
    if (/^---+$/.test(l.trim())) { flush(); out.push('<hr>'); i++; continue; }
    if (l.startsWith('>')) {
      flush(); const q = [];
      while (i < ls.length && ls[i].startsWith('>')) q.push(ls[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote><p>${mdInline(q.join(' '))}</p></blockquote>`); continue;
    }
    if (/^\|.*\|\s*$/.test(l)) {
      flush(); const rows = [];
      while (i < ls.length && /^\|.*\|\s*$/.test(ls[i])) rows.push(ls[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^\|[\s:|-]+\|$/.test(r.trim())));
      out.push(`<table><thead><tr>${cells(body[0]).map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if ((m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/))) {
      flush(); const ordered = /\d/.test(m[2]), items = [];
      while (i < ls.length) {
        const mm = ls[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (mm) { items.push(mm[3]); i++; }
        else if (ls[i].trim() && /^\s{2,}/.test(ls[i])) { items[items.length - 1] += ' ' + ls[i].trim(); i++; }
        else break;
      }
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.map(x => `<li>${mdInline(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`);
      continue;
    }
    para.push(l.trim()); i++;
  }
  flush();
  return { html: out.join('\n'), toc: toc.join('') };
}

  const c = $('#content');

        return { items: D().data.adGroups.filter(g => `${g.name} ${g.description}`.toLowerCase().includes(s)) };
      }
      if (p === 'breakglass' && method === 'GET') { needAdmin(); return clone(st.breakglass); }
      if (p === 'breakglass') {
        needAdmin();
        if (body.password && body.password.length < 16) throw err('Use a password of at least 16 characters for the break-glass account.');
        if (body.enabled && !st.breakglass.passwordSet && !body.password) throw err('Set a password before turning the break-glass account on.');
        Object.assign(st.breakglass, { userName: body.userName, enabled: body.enabled });
        if (body.password) Object.assign(st.breakglass, { passwordSet: true, passwordSetOn: now(), passwordSetBy: me });
        activity('Change', 'Changed the break-glass admin account'); audit(`Break-glass admin account '${body.userName}' changed`, me, 2, 'SignIn');
        return clone(st.breakglass);
      }
      if (p === 'about') return { version: D().version.version, released: D().version.released, history: D().version.history, credits: D().version.credits, powershell: '5.1.20348.2849', pode: '2.11.0', server: D().data.server, appAccount: D().data.appAccount, appRoot: 'D:\\Apps\\RRManager' };
      if (p === 'server/restart') { needAdmin(); audit('Web server restart requested from the Options page', me, 2, 'Options'); return { ok: true }; }
      throw err(`Not available in the demo: ${method} ${p}`, 404);
    }
    catch (e) { if (e.code === 403) activity('Denied', `${method} /${p}`, 'Denied', e.message); throw e; }
  }
  return { init, handle };
})();

init();

</script>
