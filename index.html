<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO - Remote Run Manager | Belfast Health and Social Care Trust</title>
<script>
  /* Apply the saved theme before first paint to avoid a flash */
  try { var t = localStorage.getItem('rr.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { }
</script>
<style>
/* ==========================================================================
   Remote Run Manager - Belfast Health and Social Care Trust theme (shared with Software Update Manager)
   Light theme (default) uses the Trust website palette:
     purple #813292, deep plum #51024E, warm off-white #F3F3EE, Lato type.
   Dark theme is the original Software Update Manager navy and teal.
   Theme is chosen per user (user menu or Options): light / dark / system.
   ========================================================================== */
:root, html[data-theme="light"] {
  --bg: #f3f3ee; --surface: #ffffff; --surface-2: #f8f7f3; --border: #e3e0d8; --text: #1c1c1c; --heading: #3e3e3e; --muted: #5c5d5f;
  --accent: #813292; --accent-strong: #51024e; --accent-soft: #f4e9f6; --on-accent: #ffffff;
  --ok: #1e7b45; --ok-soft: #e2f3e8; --warn: #95560a; --warn-soft: #fbefd8; --err: #b3261e; --err-soft: #fbe6e4;
  --info: #2a5ea8; --info-soft: #e5edf8;
  --sidebar: #ffffff; --sidebar-text: #3e3e3e; --sidebar-hover: #f6f1f7; --sidebar-active: #f4e9f6; --sidebar-active-text: #51024e;
  --footer-bg: #813292; --footer-text: #ffffff;
  --radius: 8px; --shadow: 0 1px 2px rgba(40, 20, 45, .05), 0 1px 3px rgba(40, 20, 45, .07);
  --font: Lato, "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  /* chart series (fixed order, colour-vision checked) and the "unknown" status grey */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --unknown: #9aa4ad;
  color-scheme: light;
}
/* Dark - the original navy and teal */
html[data-theme="dark"] {
  --bg: #0b1218; --surface: #111b23; --surface-2: #0e171e; --border: #22323e; --text: #e3eaef; --heading: #f0f4f7; --muted: #8fa3b2;
  --accent: #2db2cf; --accent-strong: #63c9df; --accent-soft: #0f303a; --on-accent: #ffffff;
  --ok: #4ed38a; --ok-soft: #10291b; --warn: #f2b84b; --warn-soft: #2d2311; --err: #f47b70; --err-soft: #2f1513;
  --info: #6aa5f4; --info-soft: #132439;
  --sidebar: #071a22; --sidebar-text: #c3d2da; --sidebar-hover: rgba(255, 255, 255, .06); --sidebar-active: rgba(45, 178, 207, .2); --sidebar-active-text: #ffffff;
  --footer-bg: #071a22; --footer-text: #c3d2da;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --unknown: #5f6d78;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="system"] {
    --bg: #0b1218; --surface: #111b23; --surface-2: #0e171e; --border: #22323e; --text: #e3eaef; --heading: #f0f4f7; --muted: #8fa3b2;
    --accent: #2db2cf; --accent-strong: #63c9df; --accent-soft: #0f303a; --on-accent: #ffffff;
    --ok: #4ed38a; --ok-soft: #10291b; --warn: #f2b84b; --warn-soft: #2d2311; --err: #f47b70; --err-soft: #2f1513;
    --info: #6aa5f4; --info-soft: #132439;
    --sidebar: #071a22; --sidebar-text: #c3d2da; --sidebar-hover: rgba(255, 255, 255, .06); --sidebar-active: rgba(45, 178, 207, .2); --sidebar-active-text: #ffffff;
    --footer-bg: #071a22; --footer-text: #c3d2da;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --unknown: #5f6d78;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.55 var(--font); background: var(--bg); color: var(--text); }
h1, h2, h3, h4 { color: var(--heading); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); padding: 0 4px; border-radius: 4px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.nowrap { white-space: nowrap; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--sidebar) 247px, var(--border) 247px, var(--border) 248px, transparent 248px); }
.sidebar { background: var(--sidebar); color: var(--sidebar-text); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; border-top: 4px solid var(--accent); }
.brand { padding: 2px 8px 18px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
.brand .logo-img { display: block; width: 100%; max-width: 200px; height: auto; margin-bottom: 12px; }
/* The logo has a white background - in dark mode it sits on its own white panel */
html[data-theme="dark"] .brand .logo-img { background: #fff; padding: 6px 8px; border-radius: 6px; }
@media (prefers-color-scheme: dark) { html[data-theme="system"] .brand .logo-img { background: #fff; padding: 6px 8px; border-radius: 6px; } }
.brand .logo-text { font-weight: 700; color: var(--accent); line-height: 1.2; font-size: 13px; margin-bottom: 10px; }
.brand strong { display: block; color: var(--heading); font-size: 15px; }
.brand span { font-size: 12px; color: var(--muted); }
#nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: inherit; text-decoration: none; margin-bottom: 2px; border-left: 3px solid transparent; }
#nav a:hover { background: var(--sidebar-hover); }
#nav a.active { background: var(--sidebar-active); color: var(--sidebar-active-text); border-left-color: var(--accent); font-weight: 700; }
#nav svg { width: 18px; height: 18px; fill: currentColor; flex: none; opacity: .85; }
#nav .nav-sep { height: 1px; background: var(--border); margin: 10px 4px; }
.user { margin-top: auto; padding: 10px 0 0; border-top: 1px solid var(--border); }
.user-btn { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: 6px; padding: 8px; font: inherit; color: var(--sidebar-text); cursor: pointer; text-align: left; }
.user-btn:hover, .user-btn[aria-expanded="true"], .user-btn.active { background: var(--sidebar-hover); }
.user-btn .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.user-btn .who { flex: 1; min-width: 0; font-size: 12px; line-height: 1.35; }
.user-btn .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.user-btn .who span { color: var(--muted); }
.user-btn .caret { opacity: .6; font-size: 11px; }
.user-menu { position: fixed; z-index: 40; min-width: 230px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, .18); padding: 6px; }
.user-menu a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 13.5px; }
.user-menu a:hover, .user-menu a:focus-visible { background: var(--surface-2); outline: none; }
.user-menu svg { width: 16px; height: 16px; fill: currentColor; opacity: .75; flex: none; }
.user-menu .sep { height: 1px; background: var(--border); margin: 6px 4px; }
.user-menu .menu-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 4px 10px 6px; }
.user-menu .segmented { margin: 0 6px 4px; display: flex; }
.user-menu .segmented button { flex: 1; padding: 5px 6px; font-size: 12px; }
.user-menu .menu-user { padding: 6px 10px 8px; font-size: 13px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.user-menu .menu-user span { display: block; font-size: 12px; color: var(--muted); }
.user-menu .menu-foot { font-size: 11.5px; color: var(--muted); padding: 6px 10px 2px; }
.main-col { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; }
main { padding: 24px 32px 40px; min-width: 0; flex: 1; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 14px; margin-bottom: 16px; font-weight: 700; font-size: 13px; }
.site-footer { background: var(--footer-bg); color: var(--footer-text); padding: 14px 32px; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; }
.site-footer strong { font-weight: 700; }
.site-footer .sep { opacity: .5; }
.site-footer a { color: var(--footer-text); text-decoration: underline; }

/* ---------- Page furniture ---------- */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; min-width: 0; }
.panel > h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel > h3 .right { margin-left: auto; font-weight: 400; font-size: 13px; }
.panel > p.lead { margin: -6px 0 14px; color: var(--muted); font-size: 13px; }
.hint { font-weight: 400; font-size: 12px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
.card .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.card .value { font-size: 18px; font-weight: 700; margin: 4px 0 2px; color: var(--heading); }
.card .sub { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.grid2 > .panel { margin-bottom: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 22px; }
.kv > div > span:not(.badge) { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.kv > div { overflow-wrap: anywhere; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 7px 14px; border-radius: 6px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); border-color: var(--accent); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.danger-ghost { color: var(--err); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 8px; border-radius: 6px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); color: var(--err); }
input, select, textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; }
input:focus, select:focus, textarea:focus, .btn:focus-visible, #nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar.end { margin-top: 12px; }
.spacer { flex: 1; }
.filter { font-size: 13px; padding: 5px 10px; min-width: 220px; margin-left: auto; font-weight: 400; }
label.check { display: inline-flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: 13px; }
label.check input { margin-top: 3px; accent-color: var(--accent); }
.field { display: block; margin: 12px 0; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
.field input, .field select { width: 100%; }
.field input[type=checkbox] { width: auto; }
.field small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 20px; }
.form-grid .field { margin: 8px 0; }
.search { display: flex; gap: 8px; max-width: 640px; }
.search input { flex: 1; font-size: 15px; padding: 10px 12px; text-transform: uppercase; }
.search input::placeholder { text-transform: none; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.segmented button { border: 0; background: var(--surface); color: var(--text); padding: 7px 16px; font: inherit; font-size: 13px; cursor: pointer; border-right: 1px solid var(--border); }
.segmented button:last-child { border-right: 0; }
.segmented button.active { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.sticky-save { position: sticky; bottom: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 -4px 14px rgba(0, 0, 0, .06); padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; z-index: 4; }

/* ---------- Badges, chips, alerts ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge.brand { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--text); font-family: inherit; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.static { cursor: default; }
.chip.static:hover { border-color: var(--border); color: var(--text); }
.alert { border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.alert.error { background: var(--err-soft); color: var(--err); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--info-soft); color: var(--info); }
.empty { color: var(--muted); padding: 22px; text-align: center; font-size: 13px; }

/* ---------- Tables ---------- */
.table-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 6px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 700; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--surface); white-space: nowrap; z-index: 1; }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover td { background: var(--surface-2); }
table.data tr.clickable { cursor: pointer; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.log td.msg { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
table.log tr.t2 td { background: var(--warn-soft); }
table.log tr.t3 td { background: var(--err-soft); }
.edit-table td { padding: 4px 6px; }
.edit-table input { width: 100%; padding: 5px 8px; border-color: transparent; background: transparent; }
.edit-table input:hover:not(:disabled) { border-color: var(--border); }
.edit-table input:focus { background: var(--surface); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -4px 0 14px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.tabs .count { font-size: 11px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; margin-left: 4px; }

/* ---------- Host ---------- */
.host-title { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.host-title h2 { margin: 0; font-size: 20px; font-family: var(--mono); letter-spacing: .02em; }
.compliance { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.ring { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--ring) calc(var(--p) * 1%), var(--border) 0); }
.ring > div { width: 86px; height: 86px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 21px; font-weight: 700; }
.stat-list { display: grid; gap: 6px; font-size: 13px; }
.stat-list b { display: inline-block; min-width: 34px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; display: flex; min-width: 90px; }
.bar i { display: block; height: 100%; }
.bar .s { background: var(--ok); } .bar .p { background: var(--info); } .bar .e { background: var(--err); } .bar .u { background: var(--unknown); }
.progress { display: flex; align-items: center; gap: 8px; }
pre.messages { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; max-height: 320px; overflow: auto; margin: 12px 0 0; }

/* ---------- Options / About ---------- */
.check-list { display: grid; gap: 0; }
.check-row { display: grid; grid-template-columns: 26px 220px 1fr; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: start; }
.check-row:last-child { border-bottom: 0; }
.check-row .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; margin-top: 1px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.fail { background: var(--err); }
.changelog h4 { margin: 14px 0 4px; font-size: 14px; }
.changelog h4:first-child { margin-top: 0; }
.changelog ul { margin: 4px 0 0; padding-left: 20px; }
.changelog li { margin: 2px 0; }
.version-tag { font-family: var(--mono); background: var(--accent-soft); color: var(--accent-strong); padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }

/* ---------- Help (rendered user guide) ---------- */
.guide { max-width: 860px; font-size: 14.5px; line-height: 1.65; }
.guide h1 { font-size: 24px; margin: 0 0 8px; }
.guide h2 { font-size: 19px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-soft); }
.guide h3 { font-size: 16px; margin: 20px 0 6px; }
.guide p, .guide ul, .guide ol { margin: 8px 0; }
.guide li { margin: 3px 0; }
.guide blockquote { margin: 12px 0; padding: 10px 14px; background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 6px 6px 0; }
.guide blockquote p { margin: 0; }
.guide table { border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
.guide th, .guide td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.guide th { background: var(--surface-2); }
.guide-toc { position: sticky; top: 16px; font-size: 13px; }
.guide-toc a { display: block; padding: 3px 0; color: var(--text); }
.guide-toc a:hover { color: var(--accent); }
.guide-layout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; align-items: start; }

/* ---------- About (Options) ---------- */
details.about > summary { cursor: pointer; font-weight: 700; color: var(--heading); list-style: none; display: flex; align-items: center; gap: 8px; }
details.about > summary::-webkit-details-marker { display: none; }
details.about > summary::before { content: "▸"; color: var(--muted); }
details.about[open] > summary::before { content: "▾"; }
details.about[open] > summary { margin-bottom: 12px; }
.credits { font-size: 13px; color: var(--muted); margin: 0 0 14px; }

/* ---------- Connection accounts and break-glass (Options) ---------- */
.conn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.conn-card { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
.conn-card > b { font-size: 14px; }
.conn-card > .hint { margin: 2px 0 8px; display: block; }
.conn-status { font-size: 13px; margin-bottom: 8px; }

.conn-card .field { margin: 8px 0; }
.conn-card .row { display: flex; gap: 6px; } .conn-card .row input { flex: 1; min-width: 0; }
.conn-result:not(:empty) { margin-top: 10px; }
.conn-result .check-row { grid-template-columns: 26px 170px 1fr; }
.banner.bg-banner { background: var(--err-soft); color: var(--err); }
.chip.clear { color: var(--muted); border-style: dashed; }
.chip.clear:hover { color: var(--err); border-color: var(--err); }

/* ---------- Active Directory helper (Options) ---------- */
.how-to p { margin: 6px 0 0; }
.how-to { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; margin: 0 0 14px; font-size: 13px; }
.how-to ol { margin: 6px 0 0; padding-left: 20px; } .how-to li { margin: 4px 0; }
.ad-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 6px; }
.ad-tools .tool { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.ad-tools .tool > b { display: block; font-size: 13px; margin-bottom: 6px; }
.ad-tools .row { display: flex; gap: 6px; }
.ad-tools .row input { flex: 1; min-width: 0; }
#adResult:not(:empty) { margin-top: 14px; }

/* ---------- Reporting ---------- */
.rep-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.rep-bar label { font-size: 12px; color: var(--muted); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.rep-bar select { max-width: 340px; }
select.compact { font-size: 12.5px; padding: 3px 6px; font-weight: 400; }
.rep-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.rep-grid > .panel { margin: 0; }
.rep-grid > .full { grid-column: 1 / -1; }
.panel > h3 .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; font-weight: 400; }
.w-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); gap: 12px; }
.kpi { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; background: var(--surface-2); }
.kpi .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.kpi .value { font-size: 24px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; color: var(--heading); }
.kpi .sub { color: var(--muted); font-size: 12px; }
.delta { font-weight: 700; font-size: 12px; white-space: nowrap; }
.delta.good { color: var(--ok); } .delta.bad { color: var(--err); } .delta.flat { color: var(--muted); }
svg.chart { display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
svg.chart text.lbl { fill: var(--text); font-weight: 700; }
svg.chart .gl { stroke: var(--border); stroke-width: 1; }
svg.chart .target { stroke: var(--text); stroke-width: 1; stroke-dasharray: 4 4; opacity: .55; }
svg.chart .mk { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
svg.chart .band { fill: transparent; }
svg.chart .band:hover { fill: var(--accent-soft); fill-opacity: .55; }
svg.chart .band.click { cursor: pointer; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .tip-row i, .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend i.line { height: 3px; width: 14px; border-radius: 2px; }
.legend i.dash { height: 0; width: 14px; border-top: 2px dashed; border-radius: 0; background: none !important; }
#tip { position: fixed; z-index: 70; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .16); padding: 8px 10px; font-size: 12px; min-width: 150px; max-width: 320px; }
#tip > b { display: block; margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 8px; }
.tip-row span { flex: 1; color: var(--muted); }
.tip-row b { font-variant-numeric: tabular-nums; }
.donut-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.status-list { display: grid; gap: 8px; font-size: 13px; min-width: 200px; flex: 1; }
.status-list > div { display: flex; align-items: center; gap: 8px; }
.status-list > div > span:nth-child(2) { flex: 1; }
.status-list b { font-variant-numeric: tabular-nums; }
.hbars { display: grid; gap: 9px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 3px 12px; align-items: center; font-size: 12.5px; }
.hbar .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.hbar .track { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 99px; background: var(--c1); }
.spark { display: block; }
.cycle-strip { display: flex; gap: 6px; flex-wrap: wrap; }
.cyc { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; background: var(--surface); }
.st-dots { display: flex; gap: 4px; }
.st-dots i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sorted::after { content: " ▾"; }
th.sorted.asc::after { content: " ▴"; }
.widget-list { display: grid; gap: 6px; margin: 12px 0; }
.widget-list > div { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
.widget-list label { flex: 1; }
.summary-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

/* ---------- Loading ---------- */
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 18px 4px; font-size: 13px; }
.spin { width: 15px; height: 15px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1.1s linear infinite; will-change: transform; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Modal & toasts ---------- */
.modal { position: fixed; inset: 0; background: rgba(20, 8, 24, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { width: min(580px, 100%); background: var(--surface); border-radius: 10px; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); max-height: 92vh; display: flex; flex-direction: column; border-top: 4px solid var(--accent); }
.dialog header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.dialog header h3 { margin: 0; font-size: 16px; }
.dialog-body { padding: 4px 18px 8px; overflow: auto; }
.dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--heading); color: var(--surface); padding: 10px 14px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); font-size: 13px; max-width: 380px; transition: opacity .4s; }
.toast.ok { background: var(--ok); color: #fff; } .toast.err { background: var(--err); color: #fff; }
.toast.out { opacity: 0; }

@media (max-width: 1100px) { .guide-layout { grid-template-columns: 1fr; } .guide-toc { display: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; background: none; }
  .sidebar { position: sticky; z-index: 5; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 8px 10px; gap: 6px; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand { padding: 0 6px 0 0; border: 0; margin: 0; } .brand .logo-img { width: 90px; margin: 0; } .brand .brand-text, .brand .logo-text, #nav .nav-sep, #nav .nav-head { display: none; }
  .user { margin: 0 0 0 auto; padding: 0 0 0 6px; border: 0; position: sticky; right: 0; background: var(--sidebar); } .user-btn { padding: 4px; } .user-btn .who, .user-btn .caret { display: none; }
  .rep-grid { grid-template-columns: 1fr; }
  #nav { display: flex; gap: 2px; } #nav a { white-space: nowrap; margin: 0; border-left: 0; } #nav a span { font-size: 13px; }
  .grid2 { grid-template-columns: 1fr; }
  main { padding: 16px; }
  .site-footer { padding: 12px 16px; }
  .filter { min-width: 0; width: 100%; margin-left: 0; }
  .check-row { grid-template-columns: 26px 1fr; } .check-row > :last-child { grid-column: 2; }
}

/* ---------- Overview: compliance by ring ---------- */
.ring-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.ring-tile { display: block; color: inherit; text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: var(--surface-2); transition: border-color .15s, box-shadow .15s; }
.ring-tile:hover { text-decoration: none; border-color: var(--accent); box-shadow: var(--shadow); }
.ring-tile.total { background: var(--accent-soft); border-color: transparent; }
.rt-pick { position: relative; margin: 6px 0 2px; font-size: 12px; font-weight: 400; }
.rt-pick > summary { list-style: none; cursor: pointer; border: 1px solid var(--border); border-radius: 6px; padding: 3px 24px 3px 8px; background: var(--surface); position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt-pick > summary::-webkit-details-marker { display: none; }
.rt-pick > summary::after { content: '▾'; position: absolute; right: 8px; top: 3px; color: var(--muted); }
.rt-pick-list { position: absolute; z-index: 20; left: 0; right: 0; margin-top: 4px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); display: grid; gap: 4px; }
.rt-pick-foot { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; }
.rt-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: var(--heading); }
.rt-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 8px; }
.rt-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--heading); font-variant-numeric: tabular-nums; line-height: 1.1; }
.rt-bar { height: 8px; margin-bottom: 8px; }
.rt-sub { font-size: 12.5px; }
.rt-counts { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- Support information ---------- */
.diag-text { width: 100%; min-height: 360px; margin: 12px 0 8px; font-family: var(--mono); font-size: 12px; line-height: 1.45; white-space: pre; background: var(--surface-2); }

/* ==========================================================================
   Polish (3.4) - one consistent layer over the rules above: spacing, type
   scale, quieter surfaces, consistent controls and focus states.
   ========================================================================== */
:root { --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .05); --shadow-hover: 0 4px 14px rgba(16, 24, 40, .08); --ring: 0 0 0 3px var(--accent-soft); }
body { font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4 { letter-spacing: -.01em; }

/* Layout: comfortable reading width on very wide screens */
main { padding: 28px 36px 48px; }
#content { max-width: 1480px; margin: 0 auto; }
.banner { max-width: 1480px; margin: 0 auto 16px; font-weight: 600; font-size: 12.5px; padding: 7px 14px; border-radius: 8px; }

/* Page header */
.page-head { margin-bottom: 22px; align-items: flex-end; }
.page-head h1 { font-size: 23px; font-weight: 700; line-height: 1.2; }
.page-head p { margin-top: 4px; font-size: 13.5px; max-width: 780px; }

/* Sidebar */
.sidebar { padding: 18px 14px; }
.brand { padding: 2px 6px 16px; margin-bottom: 12px; }
.brand strong { font-size: 14.5px; }
#nav a { padding: 8px 10px; font-size: 13.5px; border-radius: 7px; border-left: 0; margin-bottom: 1px; transition: background .12s, color .12s; }
#nav a.active { font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
#nav svg { width: 17px; height: 17px; opacity: .7; }
#nav a.active svg { opacity: 1; }

/* Surfaces */
.panel { border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
.panel > h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
.panel > p.lead { font-size: 13px; line-height: 1.55; max-width: 900px; }
.grid2 { gap: 18px; margin-bottom: 18px; }
.cards { gap: 14px; margin-bottom: 18px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.card { border-top-width: 1px; border-top-color: var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .85; }
.card .label { font-size: 11px; letter-spacing: .06em; font-weight: 700; }
.card .value { font-size: 17px; margin: 6px 0 2px; }
.kv { gap: 14px 24px; }
.kv > div > span:not(.badge) { font-size: 11px; letter-spacing: .05em; margin-bottom: 2px; }
.rep-grid { gap: 18px; }
.kpi { border-radius: 8px; padding: 12px 14px; }
.ring-tile { border-radius: var(--radius); }

/* Controls */
.btn { min-height: 34px; padding: 6px 14px; border-radius: 7px; font-weight: 600; transition: background .12s, border-color .12s, box-shadow .12s, color .12s; }
.btn.primary { box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.btn.small { min-height: 28px; padding: 3px 10px; border-radius: 6px; }
.btn:focus-visible, .chip:focus-visible, .icon-btn:focus-visible, .user-btn:focus-visible, .tabs button:focus-visible, .segmented button:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--accent); }
input, select, textarea { min-height: 34px; border-radius: 7px; transition: border-color .12s, box-shadow .12s; }
input[type=checkbox], input[type=radio] { min-height: 0; }
input:hover:not(:disabled), select:hover:not(:disabled), textarea:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
select.compact { min-height: 28px; }
.search input { min-height: 42px; }
.segmented { border-radius: 7px; }
.chip { padding: 3px 11px; transition: border-color .12s, color .12s; }

/* Tables */
.table-wrap { border-radius: 8px; }
table.data th { background: var(--surface-2); font-size: 11px; letter-spacing: .06em; padding: 9px 12px; border-bottom: 1px solid var(--border); }
table.data td { padding: 9px 12px; vertical-align: middle; }
table.data tbody tr { transition: background .1s; }
table.data td.num, table.data td .mono { font-variant-numeric: tabular-nums; }
table.log td { vertical-align: top; }

/* Status */
.badge { font-weight: 600; padding: 2px 9px; letter-spacing: .01em; }
.alert { border-radius: 8px; border-left: 3px solid currentColor; padding: 10px 14px; line-height: 1.5; }
.tabs { margin-bottom: 16px; }
.tabs button { font-weight: 600; padding: 9px 14px; }
.empty { padding: 26px; }
.dialog { border-radius: 12px; box-shadow: 0 24px 64px rgba(0, 0, 0, .28); }
.dialog header { padding: 16px 20px; }
.dialog-body { padding: 6px 20px 10px; }
.dialog footer { padding: 12px 20px; }
.toast { border-radius: 8px; padding: 11px 16px; }

/* Thin, quiet scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: .01ms !important; } }
@media (max-width: 900px) {
  main { padding: 16px; }
  .page-head { align-items: flex-start; }
  .page-head h1 { font-size: 20px; }
}

/* ---------- 3.5: command preview, wide dialogs, support bar ---------- */
.dialog.wide { width: min(980px, 100%); }
details.cmd-preview { margin: 4px 0 12px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: var(--surface-2); }
details.cmd-preview > summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--accent); }
details.cmd-preview[open] > summary { margin-bottom: 8px; }
pre.code { font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; max-height: 340px; overflow: auto; white-space: pre; margin: 8px 0; tab-size: 4; }
.support-bar { margin: -2px 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); }

/* v3.6.0 */
.panel.inset { background: var(--surface-2); box-shadow: none; padding: 12px 14px; margin: 0 0 12px; }
#nav .nav-head { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 10px 6px; }
/* Overview: compact Run now / Dry run box in the page header */
.run-mini { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px 12px; min-width: 230px; }
.run-mini .rm-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--heading); }
.run-mini .rm-head .rm-info { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; cursor: help; }
.run-mini .rm-btns { display: flex; gap: 6px; }
.run-mini .rm-btns .btn { flex: 1; }
.run-mini .rm-note { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.run-mini .rm-note.warn { color: var(--warn, #9a6700); }
.run-mini .spin { width: 12px; height: 12px; }

/* Host troubleshooting: update errors and health checks */
.code-chip { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--err); background: transparent; color: var(--err); cursor: pointer; line-height: 1.5; }
.code-chip:hover { background: var(--err); color: var(--surface); }
.chip .code-chip { margin-left: 2px; }
h3 .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; font-size: 12px; text-align: center; color: var(--surface); background: var(--muted); vertical-align: middle; }
h3 .count.err { background: var(--err); }
h3 .count.warn { background: var(--warn); }
.ok-line { color: var(--ok); font-weight: 500; }
#tip .tip-list { margin: 2px 0 6px; padding-left: 18px; }
#tip .tip-list li { margin: 2px 0; }
#tip { max-width: 360px; }
.fix-list { padding-left: 20px; margin: 0; }
.fix-list li { margin: 0 0 10px; }
.fix-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.fix-btns:empty { display: none; }
.fix-cmd { margin-top: 14px; }
.fix-cmd-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fix-cmd p { margin: 4px 0; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px 18px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 6px 0; }
.check .ci { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--surface); background: var(--ok); margin-top: 1px; }
.check.warn .ci { background: var(--warn); }
.check.err .ci { background: var(--err); }
.check.info .ci { background: var(--muted); font-style: italic; font-family: Georgia, serif; }
.check .fix { margin-top: 4px; color: var(--text); }
.check .fix .btn { margin-left: 6px; }
.fix-cmds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
#hcDetails > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
#hcDetails > summary::-webkit-details-marker { display: none; }
#hcDetails > summary::before { content: '▸'; color: var(--muted); font-size: 14px; transition: transform .15s; }
#hcDetails[open] > summary::before { transform: rotate(90deg); }
#hcDetails > summary h3 { margin: 0; }
#hcDetails[open] > summary { margin-bottom: 12px; }

/* Windows security compliance (Overview) */
.sec-grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.4fr); gap: 14px; align-items: start; }
.sec-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sec-fact { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.sec-fact .v { font-size: 20px; font-weight: 700; color: var(--heading); }
.sec-fact .l { font-size: 12px; color: var(--muted); line-height: 1.35; }
.sec-fact.warn .v { color: var(--warn); }
.sec-fact.bad .v { color: var(--err); }
.sec-grid > * { min-width: 0; }
.sec-os { overflow-x: auto; grid-column: 1 / -1; }
.sec-os table { width: 100%; }
@media (max-width: 800px) { .sec-grid { grid-template-columns: 1fr; } }

/* Overview: Customise layout */
.ov-head-actions { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.ov-cust { list-style: none; margin: 10px 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ov-cust li { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; background: var(--surface); }
.ov-cust label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; min-width: 0; }
.ov-cust label input { margin-top: 3px; }
.ov-cust label span { display: flex; flex-direction: column; }
.ov-cust small { color: var(--muted); }
.ov-cust .oc-move { display: flex; gap: 4px; flex-shrink: 0; }
.ov-cust .icon-btn:disabled { opacity: .3; cursor: default; }

/* ==========================================================================
   Remote Run Manager
   ========================================================================== */
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--unknown); flex: none; vertical-align: middle; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err, .dot.fail { background: var(--err); } .dot.info { background: var(--info); }
.err-text { color: var(--err); }
.req { font-style: normal; font-size: 11px; color: var(--err); font-weight: 700; margin-left: 4px; }
.small-break { word-break: break-all; font-size: 12px; }

/* sidebar team list */
#nav a em { margin-left: auto; font-style: normal; }
.nav-count { font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; font-weight: 700; }
#nav a.active .nav-count { background: var(--surface); }
.nav-pill { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 0 7px; background: var(--surface-2); color: var(--muted); }
.nav-pill.warn { background: var(--warn-soft); color: var(--warn); }
.nav-empty { font-size: 12px; color: var(--muted); padding: 6px 12px; }

/* demo banner */
.demo-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; }
.demo-banner label { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
.demo-banner select { padding: 4px 8px; font-size: 13px; }

/* target computer */
.target-bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius);
  box-shadow: 0 2px 10px rgba(40, 20, 45, .08); padding: 12px 16px; margin: -8px 0 20px; }
.tb-main { display: grid; grid-template-columns: auto minmax(260px, 420px) 1fr; gap: 8px 16px; align-items: center; }
.tb-main > label { font-weight: 700; color: var(--heading); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.tb-input { display: flex; gap: 8px; }
.tb-input input { flex: 1; font-size: 15px; font-family: var(--mono); text-transform: uppercase; padding: 8px 12px; min-width: 0; }
.tb-input input::placeholder { text-transform: none; font-family: var(--font); font-size: 13px; }
.tb-status { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; }
.tb-state { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tb-state .sep { color: var(--border); }
.tb-state .dot { width: 12px; height: 12px; box-shadow: 0 0 0 3px var(--surface-2); }
.tb-msg { font-size: 12px; color: var(--muted); }
.tb-recent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
.tb-recent .chip { font-family: var(--mono); font-size: 11.5px; }

/* team page */
.team-summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -6px 0 18px; }
.sum-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.sum-chip:disabled { cursor: default; opacity: .8; }
.sum-chip:not(:disabled):hover { border-color: var(--accent); }
.sum-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
.team-summary .search { margin-left: auto; }
.team-summary .search input { text-transform: none; font-size: 13px; padding: 7px 12px; min-height: 0; width: 240px; }
.cat-head { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 10px; }
.script-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.script-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.script-card.blocked { background: var(--surface-2); }
.sc-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.sc-title { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.sc-title h3 { margin: 0; font-size: 15.5px; font-family: var(--mono); font-weight: 700; word-break: break-word; }
.sc-actions { display: flex; gap: 6px; flex: none; }
.sc-run svg { flex: none; }
.sc-syn { margin: 0; color: var(--text); font-size: 13px; }
.sc-checks { display: grid; gap: 6px; }
.sc-check { display: grid; grid-template-columns: 12px auto 1fr; gap: 4px 9px; align-items: baseline; text-align: left; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--text); background: var(--surface-2); }
.sc-check .dot { align-self: center; }
.sc-check b { white-space: nowrap; }
.sc-check span { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.sc-check span b { color: var(--text); white-space: normal; }
.sc-check.ok { background: var(--ok-soft); } .sc-check.ok b { color: var(--ok); }
.sc-check.warn { background: var(--warn-soft); } .sc-check.warn > b { color: var(--warn); }
.sc-check.err { background: var(--err-soft); } .sc-check.err > b { color: var(--err); }
.sc-check:hover { border-color: currentColor; }
.sc-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
.sc-meta a { color: var(--muted); }
.sc-meta a:hover { color: var(--accent); }
.sc-blocked { font-size: 12px; color: var(--err); font-weight: 700; }

/* script details */
.lead-text { font-size: 14px; font-weight: 700; }
.dialog h4 { margin: 18px 0 8px; font-size: 13.5px; }
.sig-head { display: flex; gap: 12px; align-items: flex-start; border-radius: 8px; padding: 12px 14px; margin: 4px 0 14px; font-size: 13px; }
.sig-head .dot { width: 14px; height: 14px; margin-top: 3px; }
.sig-head b { font-size: 14px; }
.sig-head.ok { background: var(--ok-soft); } .sig-head.ok b { color: var(--ok); }
.sig-head.warn { background: var(--warn-soft); } .sig-head.warn b { color: var(--warn); }
.sig-head.err { background: var(--err-soft); } .sig-head.err b { color: var(--err); }
.tabs .dot { width: 8px; height: 8px; margin-left: 4px; }
.finding { border: 1px solid var(--border); border-left: 4px solid var(--info); border-radius: 6px; padding: 10px 14px; margin: 0 0 10px; font-size: 13px; }
.finding.error { border-left-color: var(--err); } .finding.warning { border-left-color: var(--warn); }
.finding .f-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.finding .f-lines { margin-left: auto; font-size: 12px; color: var(--muted); }
.finding p { margin: 6px 0 0; }
.finding .f-fix { color: var(--text); }
.finding pre.code { margin: 8px 0 0; }
.source { border: 1px solid var(--border); border-radius: 6px; max-height: 55vh; overflow: auto; background: var(--surface-2); }
.source table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.source td { padding: 0 10px; vertical-align: top; white-space: pre; }
.source td.ln { text-align: right; color: var(--muted); user-select: none; width: 1%; border-right: 1px solid var(--border); background: var(--surface); }
.source tr.flag td { background: var(--warn-soft); }
.source tr.jump td { background: var(--accent-soft); outline: 1px solid var(--accent); }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px 12px; margin-top: 4px; }
.form-grid.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.ad-find { display: flex; gap: 8px; margin: 4px 0 8px; }
.ad-find input { flex: 1; }
.ad-list { display: grid; gap: 4px; max-height: 200px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px; margin-bottom: 10px; }
.ad-list > div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.ad-list .hint { flex: 1; }
label.check.opt { display: flex; margin: 10px 0; }
label.check.opt span { display: flex; flex-direction: column; }
label.check.opt small { color: var(--muted); font-size: 12px; }
label.check.small { font-size: 12px; gap: 4px; }
.check-list .check-row { grid-template-columns: 22px 1fr; }
.check-list .check-row .dot { width: 12px; height: 12px; margin-top: 4px; }

/* run dialog */
.run-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 20px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 6px 0 4px; font-size: 13px; }
.run-summary > div > span { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.dialog .alert { margin: 8px 0; }
.dialog textarea { min-height: 60px; }

/* run output */
.run-cards .card .value { font-size: 16px; overflow-wrap: anywhere; }
.run-cards .card .sub { display: flex; gap: 6px; align-items: center; }
.panel > h3 .right.toolbar { gap: 8px 10px; }
.line-filters { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
.segmented button:disabled { opacity: .45; cursor: not-allowed; }
.console { background: #14161a; color: #e6e6e6; border-radius: 8px; padding: 10px 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; max-height: 62vh; min-height: 220px; overflow: auto; }
.console > div { display: grid; grid-template-columns: 76px 1fr; padding: 0 14px; }
.console > div:hover { background: rgba(255, 255, 255, .04); }
.console .lt { color: #6f7680; user-select: none; }
.console .lx { white-space: pre-wrap; overflow-wrap: anywhere; }
.console .ln-host .lx { color: #ffffff; }
.console .ln-warning .lx { color: #ffcc5c; }
.console .ln-warning .lx::before { content: 'WARNING: '; font-weight: 700; }
.console .ln-error { background: rgba(244, 123, 112, .1); }
.console .ln-error .lx { color: #ff8f85; }
.console .ln-verbose .lx, .console .ln-debug .lx { color: #7fb8ff; }
.console .ln-verbose .lx::before { content: 'VERBOSE: '; }
.console .ln-system .lx { color: #c79ad2; font-style: italic; }
.about-run > summary { cursor: pointer; font-weight: 700; color: var(--heading); }
.about-run[open] > summary { margin-bottom: 12px; }

/* history, activity */
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; margin: -6px 0 16px; }
.filter-bar label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.filter-bar select, .filter-bar input { font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text); }
.filter-bar .btn { margin-left: auto; }
.changelog h4 { margin: 14px 0 4px; }

@media (max-width: 900px) {
  .tb-main { grid-template-columns: 1fr; }
  .target-bar { position: static; }
  .team-summary .search { margin-left: 0; width: 100%; }
  .team-summary .search input { width: 100%; }
  .sc-head { flex-direction: column; }
  .console > div { grid-template-columns: 1fr; }
  .console .lt { display: none; }
}
.dialog.tall { height: 88vh; }
.dialog.tall .dialog-body { flex: 1; }
.dialog.tall .source { max-height: none; }
.alert { display: block; }
.run-summary > div > span.badge { display: inline-flex; font-size: 11px; text-transform: none; letter-spacing: 0; }
@media (max-width: 600px) {
  .sc-check { grid-template-columns: 12px 1fr; }
  .sc-check > span { grid-column: 2; }
  .demo-banner select { max-width: 100%; }
}
/* Phones and narrow windows: logo, app name and user on one row, the menu as a scrolling row of tabs under it */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { flex-wrap: wrap; overflow: visible; padding: 8px 12px 0; row-gap: 4px; top: 0; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .brand-text { display: block; min-width: 0; padding-left: 10px; border-left: 1px solid var(--border); }
  .brand .brand-text strong { font-size: 14px; white-space: nowrap; }
  .brand .brand-text span { display: none; }
  .user { order: 2; position: static; }
  #nav { order: 3; flex: 1 0 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  #nav::-webkit-scrollbar { display: none; }
  #nav a { padding: 6px 10px; }
  .demo-banner label { width: 100%; min-width: 0; }
  .demo-banner select { flex: 1; min-width: 0; }
}
.page-head p .badge { display: inline-flex; width: auto; vertical-align: 1px; }

</style>
