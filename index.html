erName.","example":"Invoke-Command -ComputerName $ComputerName -ScriptBlock {\n    # commands here run on the target computer\n}","lines":[]},{"level":"warning","code":"MissingComputerName","title":"Some commands will run against the web server","detail":"Get-WmiObject without -ComputerName (or -CimSession) act on the computer the script runs on, which is the web server.","fix":"Add -ComputerName $ComputerName to each of them.","example":"Get-CimInstance -ClassName Win32_OperatingSystem -ComputerName $ComputerName","lines":[12]},{"level":"warning","code":"LocalComputer","title":"Refers to \"this computer\"","detail":"$env:COMPUTERNAME, localhost or \".\" mean the web server when the script runs here, not the target computer.","fix":"Use $ComputerName instead.","example":"","lines":[13]}]}},{"path":"User\\Reset-TeamsCache.ps1","category":"User","name":"Reset-TeamsCache","file":"Reset-TeamsCache.ps1","synopsis":"Clears the Microsoft Teams cache for every user on the computer.","description":"Closes Teams and deletes the cache folders (classic and new Teams). Users will need to\nsign in to Teams again.","owner":"Desktop Support","notes":"Owner: Desktop Support","examples":[],"parameters":[],"targetParam":null,"runOn":"Target","runOnSource":"detected","modified":"2026-10-28T09:25:49.7321360+00:00","size":763,"sha256":"950AE4C809321E33EB3942CECF3992AA68A605E7D72D241A5DF7AD528B11A55A","readiness":{"status":"Ready","errors":0,"warnings":0,"restarts":false,"findings":[{"level":"info","code":"RunOnTarget","title":"Runs on the target computer","detail":"The script has no computer name parameter, so the app copies it to the target computer and runs it there through PowerShell remoting (WinRM), as the run-as account. $env:COMPUTERNAME and local paths refer to the target.","fix":"If the script is meant to run on the server and reach out to the target itself, add a -ComputerName parameter (or '# RemoteRun: RunOn=Server').","example":"","lines":[]}]}},{"path":"User\\Test-HomeDriveAccess.ps1","category":"User","name":"Test-HomeDriveAccess","file":"Test-HomeDriveAccess.ps1","synopsis":"Checks that the computer can reach the home drive and shared drive servers.","description":"","owner":"Service Desk","notes":"Owner: Service Desk","examples":[],"parameters":[],"targetParam":null,"runOn":"Target","runOnSource":"detected","modified":"2026-10-28T09:25:49.7322314+00:00","size":316,"sha256":"5B7E9867B156A081C745623FD11CA379DD010D355EAE230A9CDD9F26AE78AD51","readiness":{"status":"Check","errors":0,"warnings":1,"restarts":false,"findings":[{"level":"info","code":"RunOnTarget","title":"Runs on the target computer","detail":"The script has no computer name parameter, so the app copies it to the target computer and runs it there through PowerShell remoting (WinRM), as the run-as account. $env:COMPUTERNAME and local paths refer to the target.","fix":"If the script is meant to run on the server and reach out to the target itself, add a -ComputerName parameter (or '# RemoteRun: RunOn=Server').","example":"","lines":[]},{"level":"warning","code":"SecondHop","title":"Reads or writes a network share","detail":"When the script runs on the target computer through remoting, it can't pass the run-as account's password on to a third server (the \"second hop\"), so network shares usually return Access denied.","fix":"Give the target computers' own accounts (the Domain Computers group) read access to the share, or make the script run on the server instead and copy files to \\\\<target>\\C$.","example":"","lines":[9]}]}}],"sources":{"Clinical\\Get-TapAndGoStatus.ps1":"<#\n.SYNOPSIS\n    Checks the tap-and-go single sign-on agent and the smart card readers on a shared clinical PC.\n.DESCRIPTION\n    Runs on the target computer. Shows whether the single sign-on agent and Smart Card services are\n    running, which card readers Windows can see, and the agent version. Use it when staff say their\n    badge tap isn't logging them in.\n    The service names below are placeholders - change them to match your SSO product.\n.PARAMETER RestartAgent\n    Restart the SSO agent service if it isn't running.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam(\n    [switch]$RestartAgent\n)\n\n$agentServices = 'SSOAgent', 'SSOCardService'\n$services = Get-Service -Name ($agentServices + 'SCardSvr') -ErrorAction SilentlyContinue\n\nforeach ($svc in $services) {\n    if ($svc.Status -ne 'Running' -and $RestartAgent -and $svc.Name -in $agentServices) {\n        Write-Host \"Starting $($svc.DisplayName)...\"\n        Start-Service -Name $svc.Name -ErrorAction Continue\n        $svc.Refresh()\n    }\n    if ($svc.Status -ne 'Running') { Write-Warning \"$($svc.DisplayName) is $($svc.Status)\" }\n}\n$services | Select-Object Name, DisplayName, Status, StartType\n\n$readers = Get-PnpDevice -Class SmartCardReader -ErrorAction SilentlyContinue\nif (-not $readers) { Write-Warning 'No smart card readers found. Check the reader is plugged in.' }\n$readers | Select-Object @{ n = 'Reader'; e = { $_.FriendlyName } }, Status\n\n$exe = Get-ChildItem -Path \"$env:ProgramFiles\\SSO Agent\\*.exe\", \"${env:ProgramFiles(x86)}\\SSO Agent\\*.exe\" -ErrorAction SilentlyContinue | Select-Object -First 1\nif ($exe) { Write-Output \"SSO agent version: $($exe.VersionInfo.ProductVersion)\" }","Clinical\\Test-ClinicalSystemAccess.ps1":"<#\n.SYNOPSIS\n    Checks that the computer can reach the clinical systems staff use: EPR, PACS, lab results and the e-prescribing service.\n.DESCRIPTION\n    Runs on the target computer and tries a TCP connection to each clinical system from there,\n    so it shows what the ward PC itself can reach (not what the web server can). Use it when a\n    user says \"the EPR won't open\" before escalating to the application team.\n    The list of systems below is a placeholder - change it to your own servers and ports.\n.PARAMETER System\n    Only check the systems whose name contains this text, e.g. PACS. Leave blank to check them all.\n.PARAMETER TimeoutMs\n    How long to wait for each connection, in milliseconds.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam(\n    [string]$System,\n    [ValidateRange(200, 10000)][int]$TimeoutMs = 2000\n)\n\n$systems = @(\n    [pscustomobject]@{ Name = 'EPR (web)';            Server = 'epr.demo.local';      Port = 443 }\n    [pscustomobject]@{ Name = 'EPR (client service)'; Server = 'epr-app.demo.local';  Port = 8443 }\n    [pscustomobject]@{ Name = 'PACS viewer';          Server = 'pacs.demo.local';     Port = 443 }\n    [pscustomobject]@{ Name = 'PACS DICOM';           Server = 'pacs.demo.local';     Port = 104 }\n    [pscustomobject]@{ Name = 'Lab results';          Server = 'labs.demo.local';     Port = 443 }\n    [pscustomobject]@{ Name = 'e-Prescribing';        Server = 'eprescribe.demo.local'; Port = 443 }\n)\nif ($System) { $systems = $systems | Where-Object Name -like \"*$System*\" }\n\nforeach ($s in $systems) {\n    $client = New-Object System.Net.Sockets.TcpClient\n    $sw = [System.Diagnostics.Stopwatch]::StartNew()\n    $ok = $false\n    try { $ok = $client.ConnectAsync($s.Server, $s.Port).Wait($TimeoutMs) -and $client.Connected } catch { $ok = $false }\n    finally { $client.Dispose() }\n    if (-not $ok) { Write-Warning \"$($s.Name): can't reach $($s.Server) on port $($s.Port)\" }\n    [pscustomobject]@{\n        System    = $s.Name\n        Server    = $s.Server\n        Port      = $s.Port\n        Reachable = $ok\n        Ms        = if ($ok) { $sw.ElapsedMilliseconds } else { $null }\n    }\n}","Device\\Get-DeviceInfo.ps1":"<#\n.SYNOPSIS\n    Shows the make, model, serial number, OS build, uptime and free disk space of a computer.\n.DESCRIPTION\n    Reads the details over CIM (WinRM) from the web server, so nothing is copied to the computer.\n    Useful as a first look before any other troubleshooting.\n.PARAMETER ComputerName\n    The computer to look at. Filled in from the target box.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.2\n#>\n[CmdletBinding()]\nparam(\n    [Parameter(Mandatory)][string]$ComputerName\n)\n\n$session = New-CimSession -ComputerName $ComputerName -ErrorAction Stop\ntry {\n    $os   = Get-CimInstance -CimSession $session -ClassName Win32_OperatingSystem\n    $cs   = Get-CimInstance -CimSession $session -ClassName Win32_ComputerSystem\n    $bios = Get-CimInstance -CimSession $session -ClassName Win32_BIOS\n    $disk = Get-CimInstance -CimSession $session -ClassName Win32_LogicalDisk -Filter \"DeviceID='C:'\"\n\n    Write-Host \"Connected to $ComputerName\"\n    [pscustomobject]@{\n        Computer     = $ComputerName\n        Manufacturer = $cs.Manufacturer\n        Model        = $cs.Model\n        Serial       = $bios.SerialNumber\n        OS           = $os.Caption\n        Build        = $os.BuildNumber\n        LastBoot     = $os.LastBootUpTime\n        UptimeDays   = [math]::Round(((Get-Date) - $os.LastBootUpTime).TotalDays, 1)\n        MemoryGB     = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)\n        FreeDiskGB   = [math]::Round($disk.FreeSpace / 1GB, 1)\n        LoggedOnUser = $cs.UserName\n    }\n    if ($disk.FreeSpace / $disk.Size -lt 0.1) { Write-Warning \"C: has less than 10% free space.\" }\n}\nfinally {\n    Remove-CimSession $session\n}","Device\\Get-InstalledSoftware.ps1":"<#\n.SYNOPSIS\n    Lists the software installed on a computer, optionally filtered by name.\n.DESCRIPTION\n    Reads the Uninstall keys (64-bit and 32-bit) on the computer through PowerShell remoting.\n.PARAMETER ComputerName\n    The computer to look at.\n.PARAMETER Name\n    Only show software whose name contains this text, e.g. \"Adobe\". Leave blank for everything.\n.NOTES\n    Owner: Desktop Support\n#>\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [string]$Name\n)\n\nInvoke-Command -ComputerName $ComputerName -ArgumentList $Name -ScriptBlock {\n    param($Name)\n    $keys = 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*',\n            'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*'\n    Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue |\n        Where-Object { $_.DisplayName -and (-not $Name -or $_.DisplayName -like \"*$Name*\") } |\n        Select-Object DisplayName, DisplayVersion, Publisher, InstallDate |\n        Sort-Object DisplayName\n}","Device\\Get-PendingReboot.ps1":"<#\n.SYNOPSIS\n    Shows whether the computer is waiting for a restart, and why.\n.DESCRIPTION\n    Checks the usual places Windows records a pending restart: Windows Update, Component\n    Based Servicing, pending file renames and the ConfigMgr client.\n.NOTES\n    Owner: Desktop Support\n#>\n# RemoteRun: RunOn=Target\nparam()\n\n$reasons = @()\nif (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\WindowsUpdate\\Auto Update\\RebootRequired') { $reasons += 'Windows Update' }\nif (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing\\RebootPending') { $reasons += 'Component Based Servicing' }\n$renames = Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue\nif ($renames) { $reasons += 'Pending file renames' }\ntry {\n    $ccm = Invoke-CimMethod -Namespace 'root\\ccm\\ClientSDK' -ClassName CCM_ClientUtilities -MethodName DetermineIfRebootPending -ErrorAction Stop\n    if ($ccm.RebootPending -or $ccm.IsHardRebootPending) { $reasons += 'ConfigMgr client' }\n} catch { Write-Verbose 'ConfigMgr client not found' }\n\n$os = Get-CimInstance -ClassName Win32_OperatingSystem\n[pscustomobject]@{\n    Computer       = $env:COMPUTERNAME\n    RestartPending = [bool]$reasons\n    Reasons        = $reasons -join ', '\n    LastBoot       = $os.LastBootUpTime\n}","Device\\Get-UsbPeripherals.ps1":"<#\n.SYNOPSIS\n    Lists the USB devices plugged into a computer: barcode scanners, card readers, signature pads, label printers and more.\n.DESCRIPTION\n    Runs on the target computer. Useful when a scanner on a ward or in a clinic \"has stopped\n    working\": shows whether Windows can see the device and whether its driver has a problem.\n.PARAMETER ProblemsOnly\n    Only show devices with a driver problem.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam(\n    [switch]$ProblemsOnly\n)\n\n$devices = Get-PnpDevice -PresentOnly | Where-Object { $_.InstanceId -like 'USB*' -or $_.InstanceId -like 'HID*' } |\n    Where-Object { $_.Class -in 'HIDClass', 'Image', 'SmartCardReader', 'Printer', 'Ports', 'Keyboard', 'USBDevice', 'Camera' }\nif ($ProblemsOnly) { $devices = $devices | Where-Object Status -ne 'OK' }\n\n$devices | Where-Object Status -ne 'OK' | ForEach-Object { Write-Warning \"$($_.FriendlyName): $($_.Status)\" }\n$devices | Sort-Object Class, FriendlyName | Select-Object @{ n = 'Device'; e = { $_.FriendlyName } }, Class, Status, Manufacturer","Device\\Get-WardPcHealth.ps1":"<#\n.SYNOPSIS\n    A quick health check for a shared ward PC or workstation on wheels: uptime, disk, memory, battery and who is logged on.\n.DESCRIPTION\n    Runs on the target computer. Shared clinical PCs are rarely restarted and fill up with user\n    profiles, so this flags long uptimes, low disk space, low memory, a weak battery on mobile\n    workstations, and how many user profiles are on the machine.\n.PARAMETER MaxUptimeDays\n    Warn when the computer has been up longer than this.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.1\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam(\n    [ValidateRange(1, 90)][int]$MaxUptimeDays = 14\n)\n\n$os = Get-CimInstance -ClassName Win32_OperatingSystem\n$cs = Get-CimInstance -ClassName Win32_ComputerSystem\n$disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter \"DeviceID='C:'\"\n$battery = Get-CimInstance -ClassName Win32_Battery -ErrorAction SilentlyContinue | Select-Object -First 1\n$profiles = @(Get-CimInstance -ClassName Win32_UserProfile -Filter 'Special = false')\n\n$uptime = (Get-Date) - $os.LastBootUpTime\n$freePct = [math]::Round($disk.FreeSpace / $disk.Size * 100)\n$freeMemPct = [math]::Round($os.FreePhysicalMemory / $os.TotalVisibleMemorySize * 100)\n\nif ($uptime.TotalDays -gt $MaxUptimeDays) { Write-Warning \"Up for $([math]::Round($uptime.TotalDays)) days. Arrange a restart when the ward allows.\" }\nif ($freePct -lt 10) { Write-Warning \"C: is $freePct% free. Consider removing old user profiles.\" }\nif ($freeMemPct -lt 10) { Write-Warning \"Only $freeMemPct% of memory is free.\" }\nif ($battery -and $battery.EstimatedChargeRemaining -lt 30) { Write-Warning \"Battery at $($battery.EstimatedChargeRemaining)%.\" }\n\n[pscustomobject]@{\n    Computer      = $env:COMPUTERNAME\n    LoggedOnUser  = $cs.UserName\n    UptimeDays    = [math]::Round($uptime.TotalDays, 1)\n    DiskFreePct   = $freePct\n    MemoryFreePct = $freeMemPct\n    BatteryPct    = if ($battery) { $battery.EstimatedChargeRemaining } else { 'No battery' }\n    UserProfiles  = $profiles.Count\n}","Device\\Restart-ConfigMgrClient.ps1":"<#\n.SYNOPSIS\n    Restarts the ConfigMgr client (SMS Agent Host) on a computer.\n.PARAMETER ComputerName\n    The computer whose client should be restarted.\n.NOTES\n    Owner: Desktop Support\n#>\nparam([Parameter(Mandatory)][string]$ComputerName)\n\nWrite-Output \"Restarting the ConfigMgr client on $ComputerName\"\nRestart-Service -Name CcmExec -Force\nGet-Service -Name CcmExec -ComputerName $ComputerName | Select-Object Name, Status","Device\\Restart-Device.ps1":"<#\n.SYNOPSIS\n    Restarts a computer after a warning to the logged-on user.\n.PARAMETER ComputerName\n    The computer to restart.\n.PARAMETER DelayMinutes\n    How long to give the user before the restart (0-60).\n.PARAMETER Message\n    The message shown to the user.\n.NOTES\n    Owner: Desktop Support\n#>\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [ValidateRange(0, 60)][int]$DelayMinutes = 5,\n    [string]$Message = 'ICT need to restart this computer to finish some work. Please save your work.'\n)\n\n$seconds = $DelayMinutes * 60\nInvoke-Command -ComputerName $ComputerName -ArgumentList $seconds, $Message -ScriptBlock {\n    param($seconds, $Message)\n    shutdown.exe /r /t $seconds /c $Message /d p:4:1\n}\nWrite-Output \"$ComputerName will restart in $DelayMinutes minute(s).\"","Device\\Sync-SystemTime.ps1":"<#\n.SYNOPSIS\n    Checks the computer's clock against the domain and re-syncs it if it has drifted.\n.DESCRIPTION\n    Runs on the target computer. Clinical systems, single sign-on and Kerberos all fail when a\n    PC's clock is a few minutes out, and observations or drug rounds can be recorded at the wrong\n    time. Shows the time source and offset, then forces a re-sync with w32tm.\n.PARAMETER CheckOnly\n    Only report the offset; don't re-sync.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam(\n    [switch]$CheckOnly\n)\n\n$source = (w32tm /query /source | Out-String).Trim()\nWrite-Output \"Time source: $source\"\nWrite-Output \"Local time:  $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss')\"\n\n$domain = [System.DirectoryServices.ActiveDirectory.Domain]::GetComputerDomain().Name\n$offsetLine = w32tm /stripchart \"/computer:$domain\" /samples:1 /dataonly | Select-Object -Last 1\nWrite-Output \"Offset from the domain ($domain): $offsetLine\"\n\nif ($CheckOnly) { return }\nw32tm /resync /force | Out-String | Write-Output\nif ($LASTEXITCODE -ne 0) { Write-Error 'The re-sync failed. Check the Windows Time service is running.' }","Network\\Get-NetworkConfig.ps1":"<#\n.SYNOPSIS\n    Shows the IP configuration, DNS servers and default gateway of a computer.\n.NOTES\n    Owner: Network Team\n#>\nparam()\n\nGet-NetIPConfiguration | Where-Object { $_.IPv4DefaultGateway } | ForEach-Object {\n    [pscustomobject]@{\n        Adapter = $_.InterfaceAlias\n        IPv4    = ($_.IPv4Address.IPAddress -join ', ')\n        Gateway = ($_.IPv4DefaultGateway.NextHop -join ', ')\n        DNS     = ($_.DNSServer.ServerAddresses -join ', ')\n        Status  = $_.NetAdapter.Status\n    }\n}","Network\\Get-WirelessStatus.ps1":"<#\n.SYNOPSIS\n    Shows the Wi-Fi connection of a laptop, tablet or workstation on wheels: network, access point, signal and speed.\n.DESCRIPTION\n    Runs on the target computer and reads netsh wlan. Use it when mobile clinical devices drop\n    their connection on the move between wards; a weak signal or roaming to a distant access point\n    shows up here.\n.NOTES\n    Owner: Network Team\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam()\n\n$raw = netsh wlan show interfaces\nif ($raw -match 'There is no wireless interface') { Write-Warning 'This computer has no Wi-Fi adapter.'; return }\n\n$get = { param($label) (($raw | Where-Object { $_ -match \"^\\s*$label\\s*:\" }) -replace \"^\\s*$label\\s*:\\s*\", '' | Select-Object -First 1) }\n$signal = (& $get 'Signal') -replace '%', ''\nif ([int]$signal -lt 50) { Write-Warning \"Weak signal ($signal%). The device may drop off as it moves.\" }\n\n[pscustomobject]@{\n    Computer    = $env:COMPUTERNAME\n    State       = & $get 'State'\n    Network     = & $get 'SSID'\n    AccessPoint = & $get 'BSSID'\n    SignalPct   = [int]$signal\n    Band        = & $get 'Band'\n    Channel     = & $get 'Channel'\n    ReceiveMbps = & $get 'Receive rate \\(Mbps\\)'\n}","Network\\Test-PortConnectivity.ps1":"<#\n.SYNOPSIS\n    Tests which TCP ports are open on a computer from the server.\n.PARAMETER ComputerName\n    The computer to test.\n.PARAMETER Port\n    The ports to test, one per line or comma-separated.\n.NOTES\n    Owner: Network Team\n#>\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [int[]]$Port = @(135, 445, 3389, 5985)\n)\n\nforeach ($p in $Port) {\n    $client = New-Object System.Net.Sockets.TcpClient\n    $open = $client.ConnectAsync($ComputerName, $p).Wait(1500)\n    $client.Close()\n    [pscustomobject]@{ Computer = $ComputerName; Port = $p; Open = $open }\n}","Printing\\Clear-PrintQueue.ps1":"<#\n.SYNOPSIS\n    Clears stuck print jobs and restarts the Print Spooler.\n.DESCRIPTION\n    Stops the spooler, deletes everything in the spool folder and starts it again.\n    Runs on the computer itself. Any jobs waiting to print are lost.\n.NOTES\n    Owner: Desktop Support\n#>\n[CmdletBinding()]\nparam()\n\n$spool = Join-Path $env:SystemRoot 'System32\\spool\\PRINTERS'\n$jobs = @(Get-ChildItem -Path $spool -File -ErrorAction SilentlyContinue)\nWrite-Output \"$($jobs.Count) file(s) in the spool folder on $env:COMPUTERNAME\"\n\nStop-Service -Name Spooler -Force\n$jobs | Remove-Item -Force -ErrorAction Continue\nStart-Service -Name Spooler\n\n$svc = Get-Service -Name Spooler\nWrite-Output \"Print Spooler is $($svc.Status)\"","Printing\\Get-LabelPrinterStatus.ps1":"<#\n.SYNOPSIS\n    Checks the wristband and specimen label printers on a computer, and clears stuck label jobs.\n.DESCRIPTION\n    Runs on the target computer. Finds label printers (Zebra and similar thermal printers),\n    shows whether each is online and how many jobs are waiting, and can clear the jobs on a\n    printer that has stopped, which is the usual fix when wristbands won't print.\n.PARAMETER ClearStuckJobs\n    Remove jobs that are in an error state.\n.NOTES\n    Owner: Desktop Support\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam(\n    [switch]$ClearStuckJobs\n)\n\n$printers = Get-Printer | Where-Object { $_.DriverName -match 'ZDesigner|Zebra|Label|Thermal' }\nif (-not $printers) { Write-Warning 'No label printers found on this computer.'; return }\n\nforeach ($p in $printers) {\n    $jobs = @(Get-PrintJob -PrinterName $p.Name -ErrorAction SilentlyContinue)\n    $stuck = @($jobs | Where-Object { $_.JobStatus -match 'Error|Blocked|Paused' })\n    if ($stuck.Count -and $ClearStuckJobs) {\n        $stuck | Remove-PrintJob\n        Write-Host \"Cleared $($stuck.Count) stuck job(s) on $($p.Name)\"\n    }\n    elseif ($stuck.Count) { Write-Warning \"$($p.Name) has $($stuck.Count) stuck job(s). Run again with -ClearStuckJobs.\" }\n    [pscustomobject]@{\n        Printer = $p.Name\n        Port    = $p.PortName\n        Status  = $p.PrinterStatus\n        Jobs    = $jobs.Count\n        Stuck   = $stuck.Count\n    }\n}","Security\\Get-BitLockerStatus.ps1":"<#\n.SYNOPSIS\n    Shows BitLocker status for each drive and whether the key is backed up to AD.\n.NOTES\n    Owner: Cyber Security\n#>\nparam()\n\n. \"$PSScriptRoot\\Shared\\Common-Functions.ps1\"\n\nGet-BitLockerVolume | ForEach-Object {\n    [pscustomobject]@{\n        Drive      = $_.MountPoint\n        Status     = $_.VolumeStatus\n        Protection = $_.ProtectionStatus\n        Encrypted  = \"$($_.EncryptionPercentage)%\"\n        KeyInAD    = Test-KeyBackedUp -Volume $_\n    }\n}","Security\\Get-LocalAdmins.ps1":"<#\n.SYNOPSIS\n    Lists the members of the local Administrators group.\n.DESCRIPTION\n    Flags anyone who isn't one of the expected admin groups.\n.NOTES\n    Owner: Cyber Security\n#>\nparam()\n\n$expected = 'Administrator', 'Domain Admins', 'SG-Workstation-Admins'\n$members = net localgroup Administrators | Select-Object -Skip 6 | Where-Object { $_ -and $_ -notmatch 'command completed' }\nforeach ($m in $members) {\n    $name = $m.Trim()\n    [pscustomobject]@{ Member = $name; Expected = [bool]($expected | Where-Object { $name -like \"*$_\" }) }\n    if (-not ($expected | Where-Object { $name -like \"*$_\" })) { Write-Warning \"Unexpected local admin: $name\" }\n}","Security\\Get-UsbStorageHistory.ps1":"<#\n.SYNOPSIS\n    Lists the USB storage devices (memory sticks, external drives) that have ever been connected to a computer.\n.DESCRIPTION\n    Runs on the target computer and reads the USBSTOR registry key. Use it when investigating\n    a possible data loss or a device-control alert: it shows the make and serial number of each\n    device, and roughly when it was last connected (when Windows last updated its entry).\n.NOTES\n    Owner: Cyber Security\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam()\n\n$base = 'HKLM:\\SYSTEM\\CurrentControlSet\\Enum\\USBSTOR'\nif (-not (Test-Path $base)) { Write-Output 'No USB storage devices have been connected.'; return }\n\nforeach ($type in Get-ChildItem $base) {\n    foreach ($dev in Get-ChildItem $type.PSPath) {\n        $props = Get-ItemProperty $dev.PSPath\n        [pscustomobject]@{\n            Device   = $props.FriendlyName\n            Serial   = ($dev.PSChildName -split '&')[0]\n            LastSeen = (Get-Item $dev.PSPath).LastWriteTime\n        }\n    }\n}","Security\\Invoke-DefenderScan.ps1":"<#\n.SYNOPSIS\n    Starts a Microsoft Defender scan and shows the latest threats found.\n.PARAMETER ScanType\n    QuickScan (a few minutes) or FullScan (can take an hour or more).\n.PARAMETER UpdateSignatures\n    Update the virus definitions first.\n.NOTES\n    Owner: Cyber Security\n#>\nparam(\n    [ValidateSet('QuickScan', 'FullScan')][string]$ScanType = 'QuickScan',\n    [switch]$UpdateSignatures\n)\n\nif ($UpdateSignatures) {\n    Write-Verbose 'Updating signatures' -Verbose\n    Update-MpSignature\n}\nWrite-Output \"Starting $ScanType on $env:COMPUTERNAME\"\nStart-MpScan -ScanType $ScanType\n$status = Get-MpComputerStatus\nWrite-Output \"Definitions: $($status.AntivirusSignatureVersion) ($($status.AntivirusSignatureLastUpdated))\"\nGet-MpThreatDetection | Select-Object -First 10 InitialDetectionTime, ThreatID, ActionSuccess, Resources","Telecoms\\Get-SoftphoneVersion.ps1":"<#\n.SYNOPSIS\n    Shows the installed softphone client version.\n.NOTES\n    Owner: Telecoms\n#>\nparam()\nGet-ItemProperty 'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*' |\n    Where-Object DisplayName -like '*Softphone*' | Select-Object DisplayName, DisplayVersion","User\\Get-LoggedOnUser.ps1":"<#\n.SYNOPSIS\n    Shows who is logged on to a computer and whether the session is locked.\n.PARAMETER ComputerName\n    The computer to check.\n.NOTES\n    Owner: Service Desk\n#>\nparam([Parameter(Mandatory)][string]$ComputerName)\n\n$cs = Get-CimInstance -ClassName Win32_ComputerSystem -ComputerName $ComputerName\n$locked = [bool](Get-CimInstance -ClassName Win32_Process -ComputerName $ComputerName -Filter \"Name='LogonUI.exe'\")\nif (-not $cs.UserName) { Write-Output \"Nobody is logged on to $ComputerName.\" ; return }\n[pscustomobject]@{ Computer = $ComputerName; User = $cs.UserName; Locked = $locked }","User\\Get-RecentLogons.ps1":"<#\n.SYNOPSIS\n    Shows who has logged on to a shared clinical PC recently, and when.\n.DESCRIPTION\n    Runs on the target computer and reads interactive and remote logons from the Security event\n    log. Useful on shared ward PCs to see who was using a machine at a given time, or to check\n    a \"someone else is logged in\" report.\n.PARAMETER Hours\n    How far back to look.\n.PARAMETER MaxEvents\n    The most logons to show.\n.NOTES\n    Owner: Service Desk\n    Version: 1.0\n#>\n# RemoteRun: RunOn=Target\n[CmdletBinding()]\nparam(\n    [ValidateRange(1, 720)][int]$Hours = 24,\n    [ValidateRange(1, 500)][int]$MaxEvents = 50\n)\n\n$types = @{ 2 = 'At the PC'; 7 = 'Unlock'; 10 = 'Remote desktop'; 11 = 'Cached' }\nGet-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4624; StartTime = (Get-Date).AddHours(-$Hours) } -ErrorAction SilentlyContinue |\n    ForEach-Object {\n        $x = [xml]$_.ToXml()\n        $d = @{}; $x.Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }\n        if ([int]$d.LogonType -in $types.Keys -and $d.TargetUserName -notmatch '\\$$|^(DWM|UMFD)-') {\n            [pscustomobject]@{ Time = $_.TimeCreated; User = \"$($d.TargetDomainName)\\$($d.TargetUserName)\"; How = $types[[int]$d.LogonType] }\n        }\n    } | Select-Object -First $MaxEvents","User\\Get-UserProfileSize.ps1":"<#\n.SYNOPSIS\n    Shows how much disk space each user profile is using.\n.NOTES\n    Owner: Desktop Support\n#>\nparam()\n\nGet-ChildItem 'C:\\Users' -Directory | ForEach-Object {\n    $size = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum\n    [pscustomobject]@{ Profile = $_.Name; SizeGB = [math]::Round($size / 1GB, 2); LastUsed = $_.LastWriteTime }\n} | Sort-Object SizeGB -Descending","User\\Remove-UserProfile.ps1":"<#\n.SYNOPSIS\n    Deletes a user's profile from a computer so it is rebuilt at their next logon.\n.PARAMETER ComputerName\n    The computer to remove the profile from.\n.NOTES\n    Owner: Service Desk\n#>\nparam([Parameter(Mandatory)][string]$ComputerName)\n\n$user = Read-Host 'Which user (e.g. jsmith)?'\n$profile = Get-WmiObject -Class Win32_UserProfile | Where-Object { $_.LocalPath -like \"*\\$user\" }\nif (-not $profile) { Write-Output \"No profile for $user on $env:COMPUTERNAME\"; return }\nif ($profile.Loaded) { throw \"$user is logged on - ask them to log off first.\" }\n$profile.Delete()\nWrite-Output \"Removed the profile of $user\"","User\\Reset-TeamsCache.ps1":"<#\n.SYNOPSIS\n    Clears the Microsoft Teams cache for every user on the computer.\n.DESCRIPTION\n    Closes Teams and deletes the cache folders (classic and new Teams). Users will need to\n    sign in to Teams again.\n.NOTES\n    Owner: Desktop Support\n#>\nparam()\n\nGet-Process -Name 'Teams', 'ms-teams' -ErrorAction SilentlyContinue | Stop-Process -Force\nforeach ($profile in Get-ChildItem 'C:\\Users' -Directory) {\n    $paths = \"$($profile.FullName)\\AppData\\Roaming\\Microsoft\\Teams\",\n             \"$($profile.FullName)\\AppData\\Local\\Packages\\MSTeams_8wekyb3d8bbwe\\LocalCache\"\n    foreach ($p in $paths) {\n        if (Test-Path $p) {\n            Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue\n            Write-Output \"Cleared $p\"\n        }\n    }\n}","User\\Test-HomeDriveAccess.ps1":"<#\n.SYNOPSIS\n    Checks that the computer can reach the home drive and shared drive servers.\n.NOTES\n    Owner: Service Desk\n#>\nparam()\n\n$shares = '\\\\fileserver01\\home$', '\\\\fileserver01\\shared'\nforeach ($s in $shares) {\n    [pscustomobject]@{ Share = $s; Reachable = Test-Path -Path $s; From = $env:COMPUTERNAME }\n}"},"version":{"name":"Remote Run Manager","version":"1.1.0","released":"2026-10-30","credits":{"app":"Tim Mahood (Cyber Team Manager)"},"history":[{"version":"1.1.0","date":"2026-10-30","changes":["Several computers: a big switch at the top of every area page swaps between one computer and several. The computers can be a typed list (commas, spaces or new lines), a saved group, or the computer members of an AD group (including groups inside it)","Saved groups of computers, shared by everyone; whoever saved a group, script owners and app admins can change or delete it","Check all: DNS, ping and WinRM for every computer at once, with offline ones left out of the run by default","Multi-device run page: progress, one row per computer with its status and result, stop the rest, download as CSV and run again on the problem ones","Each computer still gets its own run record and output in the run history","Options: turn multi-device runs on or off, the most computers in one run and how many are worked on at once"]},{"version":"1.0.0","date":"2026-10-28","changes":["First release: one script library (folder or share); script owners tag each script with the areas that can run it, and each area gets its own page","All scripts page for script owners and admins, showing untagged scripts","Access by AD group: app admins, script owners, and an executor group for each area; break-glass admin account","Target computer box with a quick DNS, ping and remote management (WinRM) check","Signature check on every script, shown green, amber or red: executors see who signed it, script owners and admins also see when and the certificate details","Rescan library button for script owners: re-reads the library, re-checks every signature and says what is new, newly signed, changed or removed","Remote-readiness check: spots prompts, missing -ComputerName, local paths, second-hop shares and more, with guidance for the script owner","Parameters shown as a form; the target computer is filled in automatically","Live output (output, host, warnings, errors, verbose), table view, copy and download","Run history for each area; every run kept with its output, the exact script copy, signer and run-as account","Options: library folder, areas and their groups, script owner groups, run-as accounts (encrypted), signing policy, time limits, break-glass account","Audit log, troubleshooting log and user activity log"]}]}}; window.RR_DEMO.data = window.RR_DEMO_DATA; window.RR_GUIDE = "# Remote Run Manager user guide\n\nRemote Run Manager is where ICT staff run the PowerShell scripts they use to fix and look at computers, against a computer, without having to open PowerShell. All the scripts live in one library. Script owners tag each script with the **areas** that can run it (for example On Call, Service Desk, Server Team, Cyber or Telecoms), and each area has its own page. Everything that is run is recorded: who ran it, against which computer, why, as which account, and what it printed.\n\n## Running a script\n\n1. **Pick your area** in the menu on the left. You only see the areas you are a member of, and only the scripts tagged for them.\n2. **Type the target computer** in the box at the top of the page and press **Check** (or Enter). The app looks the name up in DNS, pings it and checks that remote management (WinRM) is reachable:\n   - **Online** (green) - ready to go.\n   - **Online, no remote management** (amber) - it answers ping but WinRM is blocked, so scripts that run on the computer will fail.\n   - **Offline** or **Not found** (red) - it is switched off, asleep, off the network, or the name is wrong.\n3. **Press Run** on the script you want. The button shows the computer it will run against.\n4. If the script has options (parameters), fill them in. Anything marked *required* must be filled in. The computer name is filled in for you.\n5. Add a **reason**, such as the ticket number. It is saved with the run.\n6. Press **Run on** *computer*. The output appears as the script runs.\n\nThe target computer stays in the box when you move between areas, so you can run scripts from several areas against the same computer. The last few computers you checked are listed under the box.\n\n> Scripts that restart or shut down a computer ask you to type the computer name to confirm.\n\n## Running a script on several computers\n\nThe big switch at the top of an area page swaps between **One computer** (left) and **Several computers** (right). The side that's off is greyed out; click it, or the switch, to change over. The app remembers which side you used last.\n\n1. Flip the switch to **Several computers**.\n2. Choose where the computers come from:\n   - **Type a list** - paste or type the names with commas, spaces or new lines between them (straight from a spreadsheet column or a ticket is fine). Duplicates are removed. **Save as a group** keeps the list for next time.\n   - **Saved group** - pick a group someone has saved. Saved groups are shared: everyone who uses the app sees the same ones. Whoever saved a group, script owners and app admins can change or delete it with **Edit**.\n   - **AD group** - type the name of an Active Directory group (suggestions appear as you type) and press **Get computers**. You get the enabled computer accounts in the group, including those in groups inside it.\n3. Press **Check all** to see which are online (it checks them all at once). **See the list** shows each computer and its state.\n4. Press **Run on** *n computers* on the script you want. The dialog shows how many computers answered, and by default leaves out the ones that didn't. The options and reason you enter are used for every computer.\n5. The multi-device run page shows each computer as it goes: waiting, running, then its result. The app works on a few computers at a time (5 unless an admin changes it) and moves on as each finishes. Click a computer to see its full output.\n\nOn the multi-device run page you can:\n\n- filter to **Problems**, **Succeeded** or **Running or waiting**, or find a computer;\n- **Stop the rest** - computers that haven't started are left out and running ones are asked to stop;\n- **Download .csv** - one row per computer with its status and result;\n- **Run again on the problem ones** - puts the computers that failed, timed out, had errors or were stopped into the list at the top, ready to run again.\n\nEach computer still gets its own entry in the run history, marked *multi-device run*.\n\n> Scripts that restart or shut down computers ask you to type `RESTART` to confirm. Be careful with AD groups: check the list before running anything disruptive.\n\n## Reading the output\n\nThe output page shows everything the script prints, as it happens:\n\n| Colour | What it is |\n|---|---|\n| Grey | Normal output |\n| White | Messages written with Write-Host |\n| Yellow | Warnings |\n| Red | Errors |\n| Blue | Verbose messages |\n| Purple | Remote Run Manager's own notes (connecting, finished, stopped) |\n\nUse the tick boxes to hide the kinds you don't need. If the script outputs objects (a list of software, for example), **Table** shows them as a table, and **Download .csv** saves them for Excel. **Copy** and **Download .txt** take the text as shown.\n\nThe status at the top is one of:\n\n- **Succeeded** - finished with no errors.\n- **Completed with errors** - finished, but wrote one or more errors. Read the red lines.\n- **Failed** - couldn't start, couldn't connect, or stopped with an error.\n- **Timed out** - still running when the time limit was reached, so it was stopped. A script waiting for someone to type something will do this.\n- **Stopped** - someone pressed **Stop**.\n\nYou can leave the page while a script runs. It carries on, and you can find it again under **Run history**.\n\n## What the colours on a script mean\n\nEvery script has two checks, shown on its card. Click either one for the details. Executors see whether a script is signed and who signed it; script owners and admins also see when, and the certificate details.\n\n### Signature\n\nScripts must be signed with the code signing certificate, so that nobody can change a script without it showing.\n\n- **Green - Signed** by *name* on *date*. The signature is valid and the script hasn't changed since.\n- **Amber - Signed, but not by an approved signer.** The signature is valid but the certificate isn't one of the approved signers. It can still run.\n- **Red - Not signed.** It can't be run until the script owner signs it.\n- **Red - Changed since it was signed.** Someone edited the file after it was signed. It can't be run until the script owner signs it again.\n\nThe signature is checked again just before a script runs, and the exact copy that ran is kept with the run record.\n\n### Remote readiness\n\nLots of scripts are written to be run by hand on the PC. Run from here against another computer, some of them will hang, fail or act on the wrong computer. The app reads each script (it doesn't run it) and looks for the usual problems.\n\n- **Green - Ready to run remotely.** Nothing found.\n- **Amber - Check before running remotely.** It will probably run, but something may not do what you expect. Read the warnings.\n- **Red - Needs changes to run remotely.** As written, it will fail, hang or do the wrong thing. You will be warned before running it. Let the script owner know.\n\n## Run history\n\n**Run history** lists the runs you can see: your own, and every run made from your areas (script owners and app admins see them all). Filter by area, computer, status and period, and click a run to see its output again. **Area run history** on an area page opens it filtered to that area. Each script's **Details › Runs** tab shows its own history.\n\n## For script owners\n\nScript owners write, sign and look after the scripts. You see every script on **All scripts** in the menu, and every area's page.\n\n### The script library\n\nAll the scripts are `.ps1` files in one library folder, on the web server or on a network share, for example `\\\\fileserver\\ICT$\\ScriptLibrary`. You can put them in sub folders to keep things tidy (for example `Device`, `User`, `Network`); sub folders show as headings on the page but don't decide who can see a script. Folders whose names start with `.` or `_` are ignored, which is handy for drafts.\n\n### Adding or changing a script\n\n1. Write or change the script on your own PC, and test it.\n2. Add a help comment at the top, so people know what it does (see the template below). `.SYNOPSIS` is shown on the card. Put `Owner: <your name or team>` in `.NOTES`.\n3. Sign it using the Trust's code signing process. Signing must be the very last step: any change afterwards, even a space, breaks the signature and the script shows **Changed since it was signed** until it is signed again.\n4. Copy it into the library. It appears on **All scripts** the next time the page is opened, marked **Not tagged with an area**.\n5. Tag it: open **Details › Owner settings**, tick the areas that should be able to run it, and save. Members of those areas see it straight away.\n\nTo retire a script, move it out of the library (or into a folder starting with `_`). Its run history stays. If you move a script to a different sub folder, tag it again: tags belong to the script's place in the library.\n\n### Tagging scripts with areas\n\nA script can be tagged with as many areas as need it. For example, *Get-DeviceInfo* might be tagged for Service Desk, Desktop Support and On Call, while *Invoke-DefenderScan* is only for Cyber. Members of each tagged area's AD group can see and run it from their area's page. A script with no tags is only visible to script owners and app admins, and **All scripts** shows how many are untagged.\n\n### Rescan library\n\nNew, changed and removed scripts show up on their own the next time anyone opens a page. If you have just signed a script, or something doesn't look right, press **Rescan library**. It reads every script in the library again, re-checks every signature, and tells you what it found on that page: new scripts, scripts that are now signed (or no longer signed), changed scripts and removed ones. Only script owners and app admins see the button.\n\n### Making scripts work in Remote Run Manager\n\nRemote Run Manager can run a script in one of two ways. It picks one from the script itself:\n\n| | Runs on the target | Runs from the server |\n|---|---|---|\n| When | The script has **no** computer name parameter | The script has a `-ComputerName` parameter (or `-Computer`, `-Target`, `-HostName`, `-DeviceName`) |\n| How | The script is sent to the target computer and run there through PowerShell remoting (WinRM) | The script runs on the web server, with the target computer passed in `-ComputerName` |\n| `$env:COMPUTERNAME`, `C:\\`, `HKLM:` | Mean the target computer | Mean the **web server** |\n| Good for | Fixing things on the PC: services, files, registry, caches | Looking things up remotely (CIM/WMI), checking ports, anything that talks to several systems |\n\nTo choose yourself, put one of these lines near the top of the script:\n\n```\n# RemoteRun: RunOn=Target\n# RemoteRun: RunOn=Server\n```\n\nThe checks look for these problems:\n\n- **Waits for someone to type or click** (needs changes). `Read-Host`, `Get-Credential`, `Pause`, `Out-GridView`, message boxes and forms. Nobody can answer them, so the script sits there until the time limit. Turn each question into a parameter: the web page shows a box for every parameter and asks for it before the script runs.\n- **Never uses -ComputerName** (needs changes). The script has the parameter but doesn't use it, so everything happens on the web server.\n- **Some commands will run against the web server** (check). On the server, `Get-CimInstance`, `Get-WmiObject`, `Get-Service`, `Get-EventLog` and similar act on the server unless you add `-ComputerName $ComputerName`.\n- **Some commands can only act on the computer they run on** (check). `Restart-Service`, `Stop-Process`, `Start-Process` and similar have no `-ComputerName`. Put them inside `Invoke-Command -ComputerName $ComputerName -ScriptBlock { ... }`, or make the whole script run on the target.\n- **Refers to \"this computer\"** (check). `$env:COMPUTERNAME`, `localhost` and `.` mean the web server when the script runs from the server. Use `$ComputerName`.\n- **Uses local drive or registry paths** (check). `C:\\...` and `HKLM:\\...` are the server's when the script runs from the server.\n- **Needs files that sit next to the script** (needs changes). Only the script itself is sent to the target, so `$PSScriptRoot`, dot-sourced `.ps1` files and modules loaded from a path aren't there. Copy the functions into the script.\n- **Reads or writes a network share** (check). From the target computer, the run-as account's password can't be passed on to a file server (the \"second hop\"), so shares usually say Access denied. Give the target computers' own accounts read access to the share, or run the script from the server and copy files to `\\\\<computer>\\C$`.\n- **Starts its own remote session** (check). A script already running on the target that connects to another computer is a second hop.\n- **Has parameters the web page can't fill in**. The page can pass text, numbers, true/false switches, dates and lists. For credentials, use a run-as account instead of a `[PSCredential]` parameter.\n- **Has a password written in the script** (check). Remove it and use a run-as account.\n- **Restarts or shuts down the computer** (note). People are asked to confirm before running it.\n\nWrite results with `Write-Output` (or just output objects) rather than `Write-Host` where you can. Objects appear in the **Table** view and can be downloaded as CSV.\n\n### A template\n\n```\n<#\n.SYNOPSIS\n    One line saying what the script does - shown on the card.\n.DESCRIPTION\n    More detail, shown under Details.\n.PARAMETER ComputerName\n    The computer to run against. Filled in from the target box.\n.PARAMETER UserName\n    Describe each of your own parameters - shown on the run form.\n.NOTES\n    Owner: Desktop Support\n#>\n[CmdletBinding()]\nparam(\n    [Parameter(Mandatory)][string]$ComputerName,\n    [Parameter(Mandatory)][string]$UserName,\n    [switch]$WhatIf\n)\n\nInvoke-Command -ComputerName $ComputerName -ArgumentList $UserName -ScriptBlock {\n    param($UserName)\n    # This part runs on the target computer\n    Get-CimInstance -ClassName Win32_UserProfile | Where-Object LocalPath -like \"*\\$UserName\" |\n        Select-Object LocalPath, Loaded, LastUseTime\n}\n```\n\n### Owner settings\n\nOn a script's **Details › Owner settings** tab you can:\n\n- **Tick the areas** that can run it.\n- **Run as** a particular account. Otherwise it runs as the default account of the area it's run from (set by the app admins), or the app's own account if the area has none.\n- **Hide it from executors**, for example while you are testing a new version. Script owners and admins still see it.\n\n## For app admins\n\nApp admins can do everything script owners can, plus the **Options** page (open it from your name at the bottom of the menu), **User activity** and **Logs**.\n\n### Setting up\n\n1. On **Options › Library and signing**, set the library folder. The app's own account needs read access to it; give script owners modify rights in Windows and nobody else.\n2. On **Options › Admins, owners and break-glass**, set the AD group(s) for **script owners**.\n3. On **Options › Areas**, press **Add an area** for each group of people who run scripts: a name (On Call, Service Desk...), the AD group(s) whose members can run its scripts (**Search AD** finds groups by name or description), and the account its scripts run as by default. Members can use it straight away; there's no restart.\n4. Ask the script owners to tag the scripts.\n\nRenaming an area keeps the scripts tagged with it. Removing one takes its tag off every script; scripts tagged only with it become untagged. Turning an area off hides it from its executors without losing the tags.\n\n### Run-as accounts\n\nScripts run as the account chosen for the script, or else the default account of the area they're run from, or else the app's own account. Add accounts on **Options › Run-as accounts**:\n\n- Use dedicated service accounts with only the rights the scripts need (for example local admin on workstations).\n- **Test** checks the password with Active Directory and can connect to a computer with PowerShell remoting as the account.\n- Passwords are encrypted for the app's own account on this server, and can't be read back. If the app's account or server changes, enter them again.\n\n### Signing and running\n\nOn **Options › Library and signing**:\n\n- **Allow unsigned scripts to run** - off by default. Leave it off.\n- **Approved signers** - certificate thumbprints or names. Leave blank to accept any valid signature from a certificate the server trusts. Scripts signed by anyone else show amber.\n- **Block scripts that need changes** - stop people running scripts the check marks red.\n- **Ask for a reason before every run** - make the reason box required.\n- **Time limit**, **scripts running at once**, **target check timeout**, and how long runs and activity are kept.\n- **Several computers** - turn the One computer / Several computers switch on or off for everyone, set the most computers in one run (250 by default) and how many each multi-device run works on at once (5 by default; they count towards *scripts running at once*).\n\n### Admins, owners and break-glass\n\n**Options › Admins, owners and break-glass** sets the AD groups for app admins and script owners, and the break-glass admin account: a local account for when AD sign-in isn't working. Keep its password in the password vault. Every sign-in with it is in the audit log, and five wrong passwords lock it for 15 minutes.\n\n## Records and logs\n\n| What | Where | Who can see it |\n|---|---|---|\n| Run history, with output and the exact script that ran | `data\\jobs` | The person who ran it, the area's members, script owners and app admins |\n| Multi-device runs (which computers, and the run for each) | `data\\batches` | As for run history |\n| Saved groups of computers | `data\\targetgroups.json` | Everyone who uses the app |\n| User activity - every page and action, in plain English | `data\\activity` | App admins (**User activity**) |\n| Audit log - runs, changes to settings, areas, tags, accounts and sign-ins | `Logs\\RRManager-Audit.log` | App admins (**Logs**), or CMTrace |\n| Troubleshooting log - errors and timings | `Logs\\RRManager-Troubleshooting.log` | App admins (**Logs**), or CMTrace |\n";</script>
<script>
'use strict';
/*
  Remote Run Manager - front end
  Plain JavaScript with no external dependencies, so it works on networks without internet access.
  Talks to the Pode API under ./api/. With window.RR_DEMO set (the demo build) it runs entirely
  on built-in sample data.
*/

/* ================================================================ helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const toDate = v => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
const fmtDateTime = v => { const d = toDate(v); return d ? d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : (v || '—'); };
const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : (v || '—'); };
const fmtTime = v => { const d = toDate(v); return d ? d.toLocaleTimeString('en-GB') : (v || ''); };
function ago(v) {
  const d = toDate(v); if (!d) return '';
  const s = (Date.now() - d) / 1000, a = Math.abs(s);
  const f = (n, u) => { n = Math.round(n); return `${n} ${u}${n === 1 ? '' : 's'}`; };
  const t = a < 60 ? null : a < 3600 ? f(a / 60, 'min') : a < 86400 ? f(a / 3600, 'hour') : f(a / 86400, 'day');
  if (!t) return 'just now';
  return s < 0 ? `in ${t}` : `${t} ago`;
}
function duration(a, b) {
  const x = toDate(a), y = toDate(b) || (x ? new Date() : null); if (!x || !y) return '—';
  const s = Math.max(0, Math.round((y - x) / 1000));
  return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min ${s % 60} s` : `${Math.floor(s / 3600)} h ${Math.floor(s / 60) % 60} min`;
}
const shortUser = u => String(u || '').split('\\').pop();

async function api(path, { method = 'GET', body, quiet = false } = {}) {
  if (App.demo) return Mock.handle(path, method, body);
  const headers = body ? { 'Content-Type': 'application/json' } : {};
  if (quiet) headers['X-RR-Background'] = '1';
  let res;
  try { res = await fetch('api/' + path, { method, credentials: 'same-origin', headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Can’t reach the web server. Check your network connection, or ask an app admin whether the Remote Run Manager service is running.'); }
  if (res.status === 401) throw new Error('Your sign-in has expired or wasn’t accepted. Refresh the page to sign in again.');
  let data = null;
  try { data = await res.json(); } catch (_) { }
  if (!res.ok) throw new Error((data && data.error) || `${res.status} ${res.statusText}`);
  return data;
}
const logActivity = action => api('activity', { method: 'POST', body: { action } }).catch(() => { });

async function copyText(text, done = 'Copied to the clipboard') {
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(done, 'ok');
}
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* Modal. confirmText:null gives an information dialog with just a Close button. */
function modal({ title, body, confirmText = 'Confirm', danger = false, confirmMatch = null, onConfirm, wide = false, tall = false, onOpen }) {
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `<div class="dialog${wide ? ' wide' : ''}${tall ? ' tall' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <header><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">×</button></header>
      <div class="dialog-body">${body}
        ${confirmMatch ? `<label class="field"><span>Type <code>${esc(confirmMatch)}</code> to confirm</span><input id="confirmInput" autocomplete="off" spellcheck="false"></label>` : ''}
        <div class="alert error hidden" id="dialogError"></div>
      </div>
      <footer><button class="btn" data-close>${confirmText ? 'Cancel' : 'Close'}</button>
        ${confirmText ? `<button class="btn ${danger ? 'danger' : 'primary'}" id="modalOk">${esc(confirmText)}</button>` : ''}</footer></div>`;
    m.classList.remove('hidden');
    const close = v => { m.classList.add('hidden'); m.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(false); };
    document.addEventListener('keydown', onKey);
    $$('[data-close]', m).forEach(b => b.onclick = () => close(false));
    if (onOpen) onOpen(m, close);
    const ok = $('#modalOk', m);
    if (!ok) return;
    const inp = $('#confirmInput', m);
    if (inp) {
      ok.disabled = true;
      inp.addEventListener('input', () => ok.disabled = inp.value.trim().toUpperCase() !== confirmMatch.toUpperCase());
    }
    ok.onclick = async () => {
      ok.disabled = true;
      const errEl = $('#dialogError', m);
      errEl.classList.add('hidden');
      try { const r = onConfirm ? await onConfirm(m) : true; if (r !== false) close(r === undefined ? true : r); else ok.disabled = false; }
      catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); ok.disabled = false; }
    };
  });
}

function route() {
  App.timers.forEach(clearTimeout); App.timers = [];
  if (App.poll) { clearTimeout(App.poll); App.poll = null; }
  closeUserMenu();
  const [v, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
  const arg = rest.length && rest[0] ? decodeURIComponent(rest.join('/')) : null;
  if (!hasAccess() && v !== 'help') { App.view = 'noaccess'; renderNoAccess(); return; }
  let view = VIEWS[v] && (App.me.isAdmin || !ADMIN_VIEWS.includes(v)) && (v !== 'all' || App.me.isOwner) ? v : 'area';
  App.view = view === 'all' ? 'area' : view;
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view && (view !== 'area' || a.dataset.area === (arg || App.areas[0]?.name))));
  const ub = $('#userBtn'); if (ub) ub.classList.toggle('active', view === 'options');
  const titles = { run: 'Run', batch: 'Multi-device run', history: 'Run history', activity: 'User activity', logs: 'Logs', options: 'Options', help: 'Help' };
  const titles2 = Object.assign(titles, { all: 'All scripts' });
  document.title = `${App.demo ? 'DEMO - ' : ''}${view === 'area' ? (arg || App.areas[0]?.name || 'Areas') : titles2[view]} · Remote Run Manager`;
  VIEWS[view](arg);
}

function recentTargets() { return prefGet(RECENT_KEY, []); }

// Names typed or pasted: commas, semicolons, spaces or new lines between them
const NAME_RE = /^[A-Z0-9][A-Z0-9-]{0,62}(\.[A-Z0-9-]{1,63})*$/;
function parseNames(text) {
  const seen = new Set(), names = [], bad = [];
  String(text || '').split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(Boolean).forEach(n => {
    if (!NAME_RE.test(n)) { bad.push(n); return; }
    if (!seen.has(n)) { seen.add(n); names.push(n); }
  });
  return { names, bad };
}

// Script owners and admins: read the library again, re-check every signature, and say what changed (on this page).
async function rescanArea() {
  const btn = $('#rescanBtn'); btn.disabled = true; btn.innerHTML = `${ICON.refresh}Rescanning…`;
  const before = new Map(App.area.data.items.map(s => [s.path, s]));
  await loadArea(true);
  if (!App.area.data || App.view !== 'area') return;
  const after = App.area.data.items, found = [], gone = [], signed = [], unsigned = [], changed = [];
  after.forEach(s => {
    const b = before.get(s.path);
    if (!b) { found.push(s.name); return; }
    if (b.signature.state !== 'ok' && s.signature.state === 'ok') signed.push(s.name);
    else if (b.signature.state === 'ok' && s.signature.state !== 'ok') unsigned.push(s.name);
    else if (b.sha256 !== s.sha256) changed.push(s.name);
  });
  before.forEach((b, p) => { if (!after.some(s => s.path === p)) gone.push(b.name); });
  const parts = [[found, 'new'], [signed, 'now signed'], [unsigned, 'no longer signed'], [changed, 'changed'], [gone, 'removed']]
    .filter(([l]) => l.length).map(([l, w]) => `${l.length} ${w} (${l.join(', ')})`);
  toast(parts.length ? `Rescanned: ${parts.join('; ')}.` : `Rescanned ${plural(after.length, 'script')}. Nothing has changed.`, parts.length ? 'ok' : '');
  refreshNav();
}
