  const sig = s.signature, r = s.readiness, rd = READY[r.status];
  const sigDot = SIG[sig.state].dot;
  const lr = s.lastRun;
  return `<article class="script-card ${s.canRun ? '' : 'blocked'}">
    <div class="sc-head">
      <div class="sc-title"><h3>${esc(s.name)}</h3>${s.hidden ? badge('Hidden from executors', '', 'Only script owners and app admins can see it') : ''}</div>
      <div class="sc-actions">
        <button class="btn primary sc-run" data-run="${esc(s.path)}">${ICON.play}<span>Run</span></button>
        <button class="btn" data-details="${esc(s.path)}">Details</button>
      </div>
    </div>
    <p class="sc-syn">${esc(s.synopsis || 'No description. Script owners can add one with a .SYNOPSIS help comment.')}</p>
    ${App.area.data.canManage ? `<div class="sc-tags">${s.areas.length ? s.areas.map(x => `<span class="tag">${esc(x)}</span>`).join('') : '<span class="tag warn" title="Only script owners and app admins can see it">Not tagged with an area</span>'}
      <button class="link-btn" data-details="${esc(s.path)}" data-tab="owner">Edit</button></div>` : ''}
    <div class="sc-checks">
      <button class="sc-check ${sigDot}" data-details="${esc(s.path)}" data-tab="signature" title="${esc(sig.summary)}"><i class="dot ${sigDot}"></i><b>${esc(sigLabel(sig))}</b><span>${sigDetail(sig, App.area.data.canManage)}</span></button>
      <button class="sc-check ${rd.kind}" data-details="${esc(s.path)}" data-tab="readiness"><i class="dot ${rd.kind}"></i><b>${esc(rd.label)}</b><span>${r.status === 'Ready' ? 'No problems found' : [r.errors ? plural(r.errors, 'problem') : '', r.warnings ? plural(r.warnings, 'warning') : ''].filter(Boolean).join(', ') + ' · see guidance'}</span></button>
    </div>
    <div class="sc-meta">
      <span title="${esc(runOnText(s))}">${s.runOn === 'Target' ? 'Runs on the target' : 'Runs from the server'}</span>
      <span>As ${esc(runAsText(s.runAs))}</span>
      ${s.parameters.filter(p => !p.isTarget).length ? `<span>${plural(s.parameters.filter(p => !p.isTarget).length, 'option')}</span>` : ''}
      ${lr ? `<a href="#run/${esc(lr.id)}" data-lastrun="${esc(lr.id)}">Last run ${esc(ago(lr.created))} by ${esc(shortUser(lr.user))} on ${esc(lr.computer)} ${runBadge(lr.status)}</a>` : '<span class="muted">Not run in the last 30 days</span>'}
    </div>
    ${s.canRun ? '' : `<div class="sc-blocked">${esc(s.blockedReason)}</div>`}
  </article>`;
}
function updateRunButtons() {
  if (App.view !== 'area' || !App.area || !App.area.data) return;
  const t = App.target, multi = isMulti(), n = App.multi.computers.length;
  $$('.sc-run').forEach(b => {
    const s = findScript(b.dataset.run);
    const label = $('span', b);
    if (!s.canRun) { b.disabled = true; b.title = s.blockedReason; label.textContent = 'Run'; return; }
    b.disabled = false;
    if (multi) {
      label.textContent = n ? `Run on ${plural(n, 'computer')}` : 'Run';
      b.title = !n ? 'Add the target computers at the top first' : !App.multi.check ? 'The computers will be checked first' : '';
      return;
    }
    label.textContent = t.name ? `Run on ${t.name}` : 'Run';
    b.title = !t.name ? 'Type a target computer at the top first' : !t.result ? 'The target will be checked first' : !t.result.online ? `${t.name} looks offline` : '';
  });
}

/* ---------------------------------------------------------------- script details */
async function openScript(s, tab = 'about') {
  const d = App.area.data, area = d.area;
  const lines = new Set(); s.readiness.findings.forEach(f => (f.lines || []).forEach(l => lines.add(l)));
  const tabs = [['about', 'About'], ['signature', 'Signature'], ['readiness', `Remote readiness`], ['source', 'Script'], ['history', 'Runs']];
  if (d.canManage) tabs.push(['owner', 'Owner settings']);
  let source = null;
  const body = `<div class="tabs" id="scTabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'active' : ''}">${esc(l)}${k === 'readiness' && s.readiness.status !== 'Ready' ? ` <i class="dot ${READY[s.readiness.status].kind}"></i>` : k === 'signature' && s.signature.state !== 'ok' ? ` <i class="dot ${SIG[s.signature.state].dot}"></i>` : ''}</button>`).join('')}</div><div id="scTab"></div>`;
  const draw = async (k, line) => {
    $$('#scTabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === k));
    const el = $('#scTab');
    if (k === 'about') {
      const ps = s.parameters;
      el.innerHTML = `<p class="lead-text">${esc(s.synopsis || 'No synopsis.')}</p>${s.description ? `<p>${esc(s.description).replace(/\n/g, '<br>')}</p>` : ''}
        <div class="kv">${kv('File', s.path)}${d.canManage ? kv('Areas', s.areas.length ? s.areas.join(', ') : 'Not tagged - only script owners and app admins can see it') : ''}${kv('Script owner', s.owner || '(not stated in .NOTES)')}${kv('How it runs', runOnText(s) + (s.runOnSource === 'script' ? ' - set in the script' : ''))}
          ${kv('Runs as', s.runAs ? `${s.runAs}${s.runAsSource === 'script' ? ' (chosen for this script)' : ` (default for ${s.runAsArea || area})`}` : 'The app’s own account')}${kv('Last changed', fmtDateTime(s.modified))}${kv('Size', `${(s.size / 1024).toFixed(1)} KB`)}</div>
        <h4>Parameters</h4>
        ${ps.length ? table(['Name', 'Type', 'Required', 'Description'], ps.map(p => `<tr><td class="mono">-${esc(p.name)}</td><td class="mono">${esc(p.type)}${p.validateSet.length ? `<div class="hint">${esc(p.validateSet.join(' | '))}</div>` : ''}</td>
          <td>${p.isTarget ? badge('Target computer', 'brand') : p.mandatory ? 'Yes' : `No${p.default ? ` <span class="hint">(default ${esc(p.default)})</span>` : ''}`}</td><td>${esc(p.description || '')}${p.fillable ? '' : ' <span class="badge err">can’t be filled in from the page</span>'}</td></tr>`).join(''))
          : '<p class="muted">None.</p>'}
        ${s.notes ? `<h4>Notes</h4><pre class="code small">${esc(s.notes)}</pre>` : ''}
        <h4>File hash</h4><p class="mono small-break">SHA256 ${esc(s.sha256)}</p>`;
    }
    else if (k === 'signature') {
      const g = s.signature;
      if (!d.canManage) {
        el.innerHTML = `<div class="sig-head ${SIG[g.state].dot}"><i class="dot ${SIG[g.state].dot}"></i><div><b>${esc(sigLabel(g))}</b><div>${esc(g.summary)}</div></div></div>
          <p class="hint">Scripts must be signed so nobody can change one without it showing. The signature is checked again just before the script runs.</p>`;
        return;
      }
      el.innerHTML = `<div class="sig-head ${SIG[g.state].dot}"><i class="dot ${SIG[g.state].dot}"></i><div><b>${esc(sigLabel(g))}</b><div>${esc(g.summary)}</div></div></div>
        ${g.signer ? `<div class="kv">${kv('Signed by', g.signer)}${kv('Signed on', g.signedOn ? fmtDateTime(g.signedOn) + (g.signedOnSource === 'Signer' ? ' (from the signer, no timestamp)' : '') : 'Unknown - the signature has no timestamp')}
          ${kv('Certificate issued by', g.issuer)}${kv('Certificate expires', fmtDate(g.certExpires))}${kv('Timestamped', g.timestamped ? 'Yes - stays valid after the certificate expires' : 'No - stops being valid when the certificate expires')}
          ${kv('Approved signer', g.approved === null || g.approved === undefined ? 'Any trusted signer is accepted' : g.approved ? 'Yes' : 'No')}${kv('Thumbprint', g.thumbprint)}${kv('Subject', g.signerSubject)}</div>` : ''}
        ${g.state !== 'ok' ? `<div class="how-to"><b>To fix it</b><p>Sign the script using the Trust’s code signing process. Make any changes first: signing must be the last step, because any change afterwards breaks the signature. Then put the signed file in the library and press <b>Rescan library</b>.</p></div>` : ''}`;
    }
    else if (k === 'readiness') {
      const r = s.readiness, rd = READY[r.status];
      const order = { error: 0, warning: 1, info: 2 };
      el.innerHTML = `<div class="sig-head ${rd.kind}"><i class="dot ${rd.kind}"></i><div><b>${esc(rd.label)}</b><div>${r.status === 'Ready' ? 'The checks found nothing that would stop it working against a remote computer.' : r.status === 'Check' ? 'It will probably run, but check the warnings below: it may not do what you expect on a remote computer.' : 'As written, this script will fail, hang or act on the wrong computer when it’s run from here. The script owner should make the changes below.'}</div></div></div>
        <p class="hint">The app reads the script with the PowerShell parser - it doesn’t run it - and looks for things that work when a script is run by hand on a PC but not when it’s run against a remote computer. It can’t catch everything, so test against one computer first.</p>
        ${r.findings.slice().sort((a, b) => order[a.level] - order[b.level]).map(f => `<div class="finding ${f.level}">
          <div class="f-head"><i class="dot ${f.level === 'error' ? 'err' : f.level === 'warning' ? 'warn' : 'info'}"></i><b>${esc(f.title)}</b>${f.lines && f.lines.length ? `<span class="f-lines">line${f.lines.length > 1 ? 's' : ''} ${f.lines.map(l => `<a href="#" data-line="${l}">${l}</a>`).join(', ')}</span>` : ''}</div>
          <p>${esc(f.detail)}</p>${f.fix ? `<p class="f-fix"><b>${f.level === 'info' ? 'Note' : 'What to change'}:</b> ${esc(f.fix)}</p>` : ''}${f.example ? `<pre class="code">${esc(f.example)}</pre>` : ''}</div>`).join('')}
        <p class="hint">More guidance: <a href="#help" data-close-go>Help › Making scripts work in Remote Run Manager</a>.</p>`;
      $$('[data-line]', el).forEach(a => a.onclick = e => { e.preventDefault(); draw('source', +a.dataset.line); });
      $$('[data-close-go]', el).forEach(a => a.onclick = () => { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; });
    }
    else if (k === 'source') {
      el.innerHTML = spinner('Reading the script…');
      try {
        if (!source) source = await api(`scripts/source?path=${encodeURIComponent(s.path)}${area ? '&area=' + encodeURIComponent(area) : ''}`);
        const ls = source.source.replace(/\r/g, '').split('\n');
        el.innerHTML = `<div class="toolbar" style="margin-bottom:8px"><button class="btn small" id="srcCopy">Copy</button><span class="hint">${source.signatureBlockRemoved ? 'The signature block at the end isn’t shown.' : ''} Highlighted lines are mentioned in the remote-readiness checks.</span></div>
          <div class="source"><table>${ls.map((l, i) => `<tr id="L${i + 1}" class="${lines.has(i + 1) ? 'flag' : ''}${line === i + 1 ? ' jump' : ''}"><td class="ln">${i + 1}</td><td class="lc">${esc(l) || ' '}</td></tr>`).join('')}</table></div>`;
        $('#srcCopy').onclick = () => copyText(source.source);
        if (line) { const row = $('#L' + line, el); if (row) row.scrollIntoView({ block: 'center' }); }
      }
      catch (e) { el.innerHTML = errorBox(e); }
    }
    else if (k === 'history') {
      el.innerHTML = spinner();
      try {
        const h = await api(`jobs?script=${encodeURIComponent(s.path)}&days=90`);
        el.innerHTML = h.items.length ? runTable(h.items, false) : empty('This script hasn’t been run in the last 90 days.');
        bindRunRows(el);
      }
      catch (e) { el.innerHTML = errorBox(e); }
    }
    else if (k === 'owner') {
      const accts = d.accounts;
      el.innerHTML = `<p class="hint">As a script owner you choose which areas can run this script, which account it runs as, and whether executors can see it at all (for example while you test a new version).</p>
        <div class="field"><span>Areas that can run it</span>
          ${d.areas.length ? `<div class="check-grid areas">${d.areas.map(a => `<label class="check"><input type="checkbox" data-tag="${esc(a)}" ${s.areas.includes(a) ? 'checked' : ''}> ${esc(a)}</label>`).join('')}</div>` : '<p class="muted">There are no areas yet. An app admin adds them on Options › Areas.</p>'}
          <small>Members of each ticked area’s AD group see the script on that area’s page and can run it. With none ticked, only script owners and app admins can see it.</small></div>
        <label class="field"><span>Run as</span><select id="ownRunAs"><option value="">Area default (the run-as account set for the area it’s run from)</option>${accts.map(a => `<option ${s.runAsSource === 'script' && s.runAs === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select>
          <small>App admins add run-as accounts on the Options page.</small></label>
        <label class="check"><input type="checkbox" id="ownHidden" ${s.hidden ? 'checked' : ''}> Hide this script from executors</label>
        <div class="toolbar" style="margin-top:14px"><button class="btn primary" id="ownSave">Save</button></div>`;
      $('#ownSave').onclick = async () => {
        try {
          const areas = $$('[data-tag]', el).filter(x => x.checked).map(x => x.dataset.tag);
          await api('scripts/settings', { method: 'PUT', body: { path: s.path, areas, runAs: $('#ownRunAs').value, hidden: $('#ownHidden').checked } });
          toast(areas.length ? `Saved. ${s.name} can be run from ${areas.join(', ')}.` : `Saved. ${s.name} isn’t tagged with any area, so only script owners and app admins can see it.`, 'ok');
          $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; loadArea(false); refreshNav();
        } catch (e) { toast(e.message, 'err'); }
      };
    }
  };
  modal({ title: s.name, body, confirmText: null, wide: true, tall: true, onOpen: m => { $$('#scTabs button', m).forEach(b => b.onclick = () => draw(b.dataset.tab)); draw(tab); } });
}

/* ---------------------------------------------------------------- run dialog */
function paramField(p) {
  const id = 'p_' + p.name, req = p.mandatory ? ' <em class="req">required</em>' : '';
  const label = `<span>-${esc(p.name)}${req} <span class="hint mono">[${esc(p.type)}]</span></span>`;
  const help = p.description ? `<small>${esc(p.description)}</small>` : '';
  const def = p.default ? String(p.default).replace(/^['"]|['"]$/g, '') : '';
  if (!p.fillable) return `<div class="field">${label}<div class="alert ${p.mandatory ? 'error' : 'info'}">This parameter can’t be filled in from the web page${p.mandatory ? ', so the script can’t run' : ' and will be left at its default'}.</div></div>`;
  if (p.type === 'SwitchParameter' || p.type === 'Boolean') return `<label class="check"><input type="checkbox" id="${id}" data-param="${esc(p.name)}"> -${esc(p.name)}${help ? ` <span class="hint">- ${esc(p.description)}</span>` : ''}</label>`;
  if (p.validateSet.length) return `<label class="field">${label}<select id="${id}" data-param="${esc(p.name)}">${p.mandatory ? '' : '<option value="">(default)</option>'}${p.validateSet.map(v => `<option ${v === def ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>${help}</label>`;
  if (/\[\]$/.test(p.type)) return `<label class="field">${label}<textarea id="${id}" data-param="${esc(p.name)}" rows="3" placeholder="${esc(def ? 'Default: ' + def : 'One per line')}"></textarea>${help || '<small>One per line.</small>'}</label>`;
  const type = /^Int|Double/.test(p.type) ? 'number' : p.type === 'DateTime' ? 'datetime-local' : 'text';
  return `<label class="field">${label}<input id="${id}" type="${type}" data-param="${esc(p.name)}" placeholder="${esc(def ? 'Default: ' + def : '')}" autocomplete="off">${help}</label>`;
}
async function openRun(s) {
  if (isMulti()) return openRunMulti(s);
  const area = App.area.data.area;
  if (!App.target.name) { toast('Type the target computer at the top of the page first.'); $('#tgtInput').focus(); return; }
  if (!App.target.result) { const r = await checkTarget(App.target.name, updateRunButtons); if (!r) return; }
  const t = App.target.result;
  const ps = s.parameters.filter(p => !p.isTarget);
  const r = s.readiness;
  const warnings = [];
  if (!t.online) warnings.push(`<div class="alert error"><b>${esc(t.computer)} looks offline.</b> ${esc(t.message)} The script will probably fail.</div>`);
  else if (!t.winrm) warnings.push(`<div class="alert warn">${esc(t.message)}</div>`);
  if (r.status === 'NeedsChanges') warnings.push(`<div class="alert error"><div><b>This script needs changes to run remotely.</b> ${esc(r.findings.filter(f => f.level === 'error').map(f => f.title).join('; '))}. It may fail, hang until the time limit, or act on the wrong computer. Let the script owner know.</div></div>`);
  else if (r.status === 'Check') warnings.push(`<div class="alert warn"><div><b>Check:</b> ${esc(r.findings.filter(f => f.level === 'warning').map(f => f.title).join('; '))}.</div></div>`);
  if (s.signature.status === 'NotSigned') warnings.push(`<div class="alert warn">This script isn’t signed. Unsigned scripts are allowed by the app’s settings, but be sure you know what it does.</div>`);
  const body = `${warnings.join('')}
    <div class="run-summary">
      ${kv('Target computer', `<b>${esc(t.computer)}</b> ${badge(t.online ? 'Online' : 'Offline', t.online ? 'ok' : 'err')}`, true)}
      ${kv('How it runs', runOnText(s))}
      ${kv('Runs as', s.runAs || 'The app’s own account')}
      ${kv('Signature', `<i class="dot ${SIG[s.signature.state].dot}"></i> ${sigLabel(s.signature) === 'Signed' ? sigDetail(s.signature) : esc(sigLabel(s.signature))}`, true)}
    </div>
    ${ps.length ? `<h4>Options</h4>${ps.map(paramField).join('')}` : ''}
    <label class="field"><span>Reason${App.area.data.policy.requireReason ? ' <em class="req">required</em>' : ' <span class="hint">(optional)</span>'}</span><input id="runReason" placeholder="e.g. INC0123456 - printer jobs stuck" maxlength="500" autocomplete="off"><small>Saved in the run history and activity log.</small></label>
    ${r.restarts ? `<div class="alert warn">This script restarts or shuts down <b>${esc(t.computer)}</b>. Anyone using it will lose unsaved work.</div>` : ''}`;
  await modal({
    title: `Run ${s.name} on ${t.computer}`, body, confirmText: `Run on ${t.computer}`, confirmMatch: r.restarts ? t.computer : null, wide: true,
    onConfirm: async m => {
      const params = {};
      $$('[data-param]', m).forEach(i => { params[i.dataset.param] = i.type === 'checkbox' ? i.checked : i.value; });
      const res = await api('run', { method: 'POST', body: { area, path: s.path, computer: t.computer, params, reason: $('#runReason', m).value.trim() } });
      later(() => { location.hash = '#run/' + res.jobId; }, 10);
    }
  });
}

// Several computers: one dialog, then a multi-device run that works through them a few at a time
async function openRunMulti(s) {
  const area = App.area.data.area, m = App.multi;
  if (!m.computers.length) { toast('Add the target computers at the top of the page first.'); ($('#mList') || $('#mGroup') || $('#mAd'))?.focus(); return; }
  const max = App.me.multiDevice.maxTargets;
  if (m.computers.length > max) { toast(`That's ${m.computers.length} computers. The most in one run is ${max}.`, 'err'); return; }
  if (!m.check) { const r = await checkMulti(updateRunButtons); if (!r) return; }
  const items = multiItems(), down = items.filter(r => r.checked && !r.online), up = items.length - down.length;
  const ps = s.parameters.filter(p => !p.isTarget);
  const r = s.readiness;
  const warnings = [];
  if (r.status === 'NeedsChanges') warnings.push(`<div class="alert error"><div><b>This script needs changes to run remotely.</b> ${esc(r.findings.filter(f => f.level === 'error').map(f => f.title).join('; '))}. It may fail, hang until the time limit, or act on the wrong computer on every one of them. Let the script owner know.</div></div>`);
  else if (r.status === 'Check') warnings.push(`<div class="alert warn"><div><b>Check:</b> ${esc(r.findings.filter(f => f.level === 'warning').map(f => f.title).join('; '))}.</div></div>`);
  if (s.signature.status === 'NotSigned') warnings.push(`<div class="alert warn">This script isn’t signed. Unsigned scripts are allowed by the app’s settings, but be sure you know what it does.</div>`);
  const body = `${warnings.join('')}
    <div class="run-summary">
      ${kv('Target computers', `<b>${plural(items.length, 'computer')}</b><div class="hint">from ${esc(multiSourceText())}</div>`, true)}
      ${kv('Online', `${badge(`${up} online`, 'ok')} ${down.length ? badge(`${down.length} offline or not found`, 'err') : ''}`, true)}
      ${kv('How it runs', runOnText(s))}
      ${kv('Runs as', s.runAs || 'The app’s own account')}
      ${kv('Signature', `<i class="dot ${SIG[s.signature.state].dot}"></i> ${sigLabel(s.signature) === 'Signed' ? sigDetail(s.signature) : esc(sigLabel(s.signature))}`, true)}
      ${kv('At once', `Works on ${App.me.multiDevice.parallel || 5} computers at a time`)}
    </div>
    ${down.length ? `<label class="check"><input type="checkbox" id="mSkip" checked> Leave out the ${plural(down.length, 'computer')} that didn’t answer <span class="hint">(${esc(down.slice(0, 6).map(x => x.computer).join(', '))}${down.length > 6 ? '…' : ''})</span></label>` : ''}
    <details class="m-details"><summary>See the computers</summary>${multiListHtml(items)}</details>
    ${ps.length ? `<h4>Options</h4><p class="hint" style="margin-top:-6px">The same options are used for every computer.</p>${ps.map(paramField).join('')}` : ''}
    <label class="field"><span>Reason${App.area.data.policy.requireReason ? ' <em class="req">required</em>' : ' <span class="hint">(optional)</span>'}</span><input id="runReason" placeholder="e.g. CHG0012345 - ward 5A printer fix" maxlength="500" autocomplete="off"><small>Saved with every computer’s run, in the run history and activity log.</small></label>
    ${r.restarts ? `<div class="alert warn">This script restarts or shuts down <b>every computer in the list</b>. Anyone using them will lose unsaved work.</div>` : ''}`;
  const count = () => { const sk = $('#mSkip'); return sk && sk.checked ? up : items.length; };
  await modal({
    title: `Run ${s.name} on ${plural(items.length, 'computer')}`, body, confirmText: `Run on ${plural(up || items.length, 'computer')}`, confirmMatch: r.restarts ? 'RESTART' : null, wide: true,
    onOpen: mm => {
      const sk = $('#mSkip', mm), ok = $('#modalOk', mm);
      if (sk) sk.onchange = () => { ok.textContent = `Run on ${plural(count(), 'computer')}`; };
      if (!down.length) ok.textContent = `Run on ${plural(items.length, 'computer')}`;
    },
    onConfirm: async mm => {
      const params = {};
      $$('[data-param]', mm).forEach(i => { params[i.dataset.param] = i.type === 'checkbox' ? i.checked : i.value; });
      const skip = $('#mSkip', mm) && $('#mSkip', mm).checked;
      const computers = skip ? items.filter(x => !(x.checked && !x.online)).map(x => x.computer) : items.map(x => x.computer);
      if (!computers.length) throw new Error('None of the computers answered, so there’s nothing to run against. Untick “Leave out” to try them anyway.');
      const res = await api('batches', { method: 'POST', body: { area, path: s.path, computers, params, reason: $('#runReason', mm).value.trim(), source: multiSource() } });
      later(() => { location.hash = '#batch/' + res.batchId; }, 10);
    }
  });
}

/* ================================================================ a run (live output) */
const LINE_TYPES = [['output', 'Output'], ['host', 'Messages'], ['warning', 'Warnings'], ['error', 'Errors'], ['verbose', 'Verbose'], ['system', 'Remote Run Manager']];
async function renderRun(id) {
  const c = $('#content');
  c.innerHTML = spinner();
  const st = { id, job: null, lines: [], view: 'text', show: prefGet('rr.lineTypes', { output: 1, host: 1, warning: 1, error: 1, verbose: 1, system: 1, debug: 1 }) };
  const tick = async () => {
    try {
      const j = await api(`jobs/${encodeURIComponent(id)}?since=${st.lines.length}`, { quiet: !!st.job });
      if (App.view !== 'run') return;
      const fresh = j.lines || [];
      st.lines = st.lines.concat(fresh);
      const first = !st.job;
      st.job = j;
      if (first) draw(); else update(fresh);
      if (['Waiting', 'Queued', 'Running'].includes(j.status)) App.poll = setTimeout(tick, j.status === 'Waiting' ? 3000 : 1000);
    }
    catch (e) { if (!st.job) c.innerHTML = pageHeader('Run', '') + errorBox(e); else toast(e.message, 'err'); }
  };
  const lineHtml = l => `<div class="ln-${esc(l.t)}${st.show[l.t] === 0 ? ' hidden' : ''}"><span class="lt">${esc(fmtTime(l.at))}</span><span class="lx">${esc(l.x) || ' '}</span></div>`;
  const summaryHtml = () => {
    const j = st.job;
    return `<div class="cards run-cards">
      ${card('Status', runBadge(j.status), j.status === 'Waiting' ? 'Waiting for its turn in the multi-device run' : ['Queued', 'Running'].includes(j.status) ? `${spinEl()} running for ${esc(duration(j.started || j.created))}` : `took ${esc(duration(j.started || j.created, j.finished))}`)}
      ${card('Target computer', esc(j.computer), j.runOn === 'Target' ? 'Ran on the computer itself' : `Ran on the web server, -${esc(j.targetParam)} ${esc(j.computer)}`)}
      ${card('Run as', esc(shortUser(j.runAsUser)), j.runAs ? `Run-as account “${esc(j.runAs)}”` : 'The app’s own account')}
      ${card('Errors and warnings', `${j.errors} / ${j.warnings}`, j.errors ? 'See the red lines below' : 'None')}
    </div>`;
  };
  const draw = () => {
    const j = st.job;
    const params = Object.entries(j.params || {}).filter(([k]) => k !== j.targetParam);
    c.innerHTML = pageHeader(`${j.scriptName} on ${j.computer}`,
      `${j.area ? `<a href="#area/${encodeURIComponent(j.area)}">${esc(j.area)}</a>` : 'All scripts'} · started by <b>${esc(j.user)}</b> ${esc(fmtDateTime(j.created))} (${esc(ago(j.created))})${j.batch ? ` · part of a <a href="#batch/${esc(j.batch)}">multi-device run</a>` : ''}`,
      `${j.batch ? `<a class="btn" href="#batch/${esc(j.batch)}">All the computers</a>` : `<a class="btn" href="${j.area ? '#area/' + encodeURIComponent(j.area) : '#all'}">Back to ${esc(j.area || 'All scripts')}</a>`}<button class="btn danger-ghost ${['Waiting', 'Queued', 'Running'].includes(j.status) ? '' : 'hidden'}" id="runStop">Stop</button>`) +
      `<div id="runSummary">${summaryHtml()}</div>
      <div class="panel">
        <h3>Output <span class="right toolbar">
          <span class="line-filters">${LINE_TYPES.map(([k, l]) => `<label class="check small"><input type="checkbox" data-lt="${k}" ${st.show[k] === 0 ? '' : 'checked'}> ${l}</label>`).join('')}</span>
          <span class="segmented" id="viewSeg"><button data-v="text" class="active">Text</button><button data-v="table" ${j.table && j.table.length ? '' : 'disabled title="The script didn’t output any objects"'}>Table</button></span>
          <button class="btn small" id="outCopy">Copy</button><button class="btn small" id="outTxt">Download .txt</button><button class="btn small ${j.table && j.table.length ? '' : 'hidden'}" id="outCsv">Download .csv</button>
        </span></h3>
        <div id="outText" class="console" role="log" aria-live="polite">${st.lines.map(lineHtml).join('')}</div>
        <div id="outTable" class="hidden"></div>
      </div>
      <details class="panel about-run"><summary>About this run</summary><div class="kv">
        ${kv('Script', j.script)}${kv('Run from', j.area || 'All scripts (script owner)')}${kv('Reason', j.reason || '(none given)')}${kv('Options', params.length ? params.map(([k, v]) => `-${k} ${Array.isArray(v) ? v.join(',') : v}`).join('  ') : 'None')}
        ${kv('Signed by', j.signature && j.signature.signer ? `${j.signature.signer}${j.signature.signedOn ? ' on ' + fmtDateTime(j.signature.signedOn) : ''}` : 'Not signed')}
        ${kv('Script hash (SHA256)', j.sha256)}${kv('Remote readiness when run', READY[j.readiness] ? READY[j.readiness].short : j.readiness)}${kv('Run id', j.id)}
      </div><p class="hint">A copy of exactly the script that ran is kept with this record on the server.</p></details>`;
    const out = $('#outText'); out.scrollTop = out.scrollHeight;
    $$('[data-lt]').forEach(cb => cb.onchange = () => { st.show[cb.dataset.lt] = cb.checked ? 1 : 0; if (cb.dataset.lt === 'verbose') st.show.debug = st.show.verbose; prefSet('rr.lineTypes', st.show); $$(`.ln-${cb.dataset.lt}`, out).forEach(x => x.classList.toggle('hidden', !cb.checked)); });
    $$('#viewSeg button').forEach(b => b.onclick = () => { st.view = b.dataset.v; $$('#viewSeg button').forEach(x => x.classList.toggle('active', x === b)); drawTable(); });
    $('#outCopy').onclick = () => copyText(plainText());
    $('#outTxt').onclick = () => { download(`${j.scriptName}-${j.computer}-${j.id}.txt`, plainText()); logActivity(`Downloaded the output of run ${j.id} (${j.scriptName} on ${j.computer})`); };
    $('#outCsv').onclick = () => { const t = st.job.table || []; const cols = Object.keys(t[0] || {}); download(`${j.scriptName}-${j.computer}-${j.id}.csv`, csvText(cols, t), 'text/csv'); logActivity(`Downloaded the table output of run ${j.id} as CSV`); };
    const stop = $('#runStop');
    stop.onclick = () => modal({ title: 'Stop this run?', body: `<p>Stop <b>${esc(j.scriptName)}</b> on <b>${esc(j.computer)}</b>? Anything it has already changed stays changed.</p>`, confirmText: 'Stop it', danger: true,
      onConfirm: async () => { await api(`jobs/${j.id}/stop`, { method: 'POST' }); toast('Asked the script to stop'); } });
  };
  const update = fresh => {
    $('#runSummary').innerHTML = summaryHtml();
    const out = $('#outText');
    if (fresh.length && out) {
      const atEnd = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
      out.insertAdjacentHTML('beforeend', fresh.map(lineHtml).join(''));
      if (atEnd) out.scrollTop = out.scrollHeight;
    }
    if (!['Waiting', 'Queued', 'Running'].includes(st.job.status)) {
      $('#runStop')?.classList.add('hidden');
      const has = st.job.table && st.job.table.length;
      const tb = $('#viewSeg [data-v=table]'); if (tb && has) { tb.disabled = false; tb.title = ''; }
      $('#outCsv')?.classList.toggle('hidden', !has);
      toast(`${st.job.scriptName} on ${st.job.computer}: ${RUN_STATUS[st.job.status][0].toLowerCase()}`, st.job.status === 'Succeeded' ? 'ok' : '');
    }
  };
  const drawTable = () => {
    const t = st.job.table || [];
    $('#outText').classList.toggle('hidden', st.view !== 'text');
    const el = $('#outTable'); el.classList.toggle('hidden', st.view !== 'table');
    if (st.view !== 'table') return;
    const cols = Object.keys(t[0] || {});
    el.innerHTML = t.length ? table(cols, t.map(r => `<tr>${cols.map(k => `<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')) + `<p class="hint">${plural(t.length, 'row')}${t.length >= 1000 ? ' (the first 1000)' : ''}.</p>` : empty('No objects were output.');
  };
  const plainText = () => st.lines.filter(l => st.show[l.t] !== 0).map(l => `${fmtTime(l.at)}  ${l.t === 'output' || l.t === 'host' ? '' : `[${l.t.toUpperCase()}] `}${l.x}`).join('\r\n');
  await tick();
}

/* ================================================================ a multi-device run */
const BATCH_FILTERS = [['', 'All'], ['problems', 'Problems'], ['Succeeded', 'Succeeded'], ['active', 'Running or waiting']];
const isProblem = s => ['Failed', 'TimedOut', 'CompletedWithErrors', 'Stopped'].includes(s);
async function renderBatch(id) {
  const c = $('#content');
  c.innerHTML = spinner();
  const st = { b: null, filter: '', q: '' };
  const tick = async () => {
    try {
      const b = await api(`batches/${encodeURIComponent(id)}`, { quiet: !!st.b });
      if (App.view !== 'batch') return;
      const first = !st.b, wasDone = st.b && st.b.done === st.b.total;
      st.b = b;
      if (first) draw(); else update();
      if (b.done < b.total) App.poll = setTimeout(tick, 2000);
      else if (!first && !wasDone) toast(`${b.scriptName}: finished on all ${plural(b.total, 'computer')}`, (b.counts.Succeeded || 0) === b.total ? 'ok' : '');
    }
    catch (e) { if (!st.b) c.innerHTML = pageHeader('Multi-device run', '') + errorBox(e); else toast(e.message, 'err'); }
  };
  const n = k => st.b.counts[k] || 0;
  const cardsHtml = () => {
    const b = st.b, pct = b.total ? Math.round(b.done / b.total * 100) : 0;
    const problems = n('Failed') + n('TimedOut') + n('CompletedWithErrors') + n('Stopped');
    return `<div class="cards run-cards">
      ${card('Progress', `${b.done} of ${b.total}<div class="b-progress"><i style="width:${pct}%"></i></div>`, `${b.done < b.total ? `${spinEl()} ${n('Running') + n('Queued')} running, ${n('Waiting')} waiting` : `took ${esc(duration(b.created, b.finished))}`}`)}
      ${card('Succeeded', `<span class="ok-text">${n('Succeeded')}</span>`, b.total ? `${Math.round(n('Succeeded') / b.total * 100)}% of the computers` : '')}
      ${card('Problems', `<span class="${problems ? 'err-text' : ''}">${problems}</span>`, [n('Failed') ? `${n('Failed')} failed` : '', n('CompletedWithErrors') ? `${n('CompletedWithErrors')} with errors` : '', n('TimedOut') ? `${n('TimedOut')} timed out` : '', n('Stopped') ? `${n('Stopped')} stopped` : ''].filter(Boolean).join(', ') || 'None')}
      ${card('Run as', esc(shortUser(b.runAsUser)), b.runAs ? `Run-as account “${esc(b.runAs)}”` : 'The app’s own account')}
    </div>`;
  };
  const shown = () => st.b.items.filter(i => (!st.filter || (st.filter === 'problems' ? isProblem(i.status) : st.filter === 'active' ? ['Waiting', 'Queued', 'Running'].includes(i.status) : i.status === st.filter)) &&
    (!st.q || i.computer.includes(st.q.toUpperCase())));
  const tableHtml = () => {
    const items = shown();
    return items.length ? table(['Computer', 'Status', 'Took', 'Errors', 'Result'], items.map(i => `<tr class="clickable" data-job="${esc(i.id)}">
      <td class="mono nowrap">${esc(i.computer)}</td><td class="nowrap">${runBadge(i.status)}${i.status === 'Running' ? ' ' + spinEl() : ''}</td>
      <td class="nowrap">${i.started ? esc(duration(i.started, i.finished)) : ''}</td><td>${i.errors || i.warnings ? `${i.errors} / ${i.warnings}` : ''}</td>
      <td class="b-sum ${i.errors ? 'err-text' : ''}">${esc(i.summary || '')}</td></tr>`).join('')) : empty('No computers match.');
  };
  const filtersHtml = () => BATCH_FILTERS.map(([k, l]) => {
    const cnt = !k ? st.b.total : k === 'problems' ? st.b.items.filter(i => isProblem(i.status)).length : k === 'active' ? st.b.items.filter(i => ['Waiting', 'Queued', 'Running'].includes(i.status)).length : n(k);
    return `<button class="sum-chip ${st.filter === k ? 'active' : ''} ${k === 'problems' && cnt ? 'err' : ''}" data-bf="${k}">${l} <span class="muted">${cnt}</span></button>`;
  }).join('');
  const bindRows = () => $$('#bTable [data-job]').forEach(r => r.onclick = () => { location.hash = '#run/' + r.dataset.job; });
  const draw = () => {
    const b = st.b;
    const src = b.source && b.source.type === 'group' ? `the saved group <b>${esc(b.source.name)}</b>` : b.source && b.source.type === 'adgroup' ? `the AD group <b>${esc(b.source.name)}</b>` : 'a typed list';
    const params = Object.entries(b.params || {});
    c.innerHTML = pageHeader(`${b.scriptName} on ${plural(b.total, 'computer')}`,
      `${b.area ? `<a href="#area/${encodeURIComponent(b.area)}">${esc(b.area)}</a>` : 'All scripts'} · started by <b>${esc(b.user)}</b> ${esc(fmtDateTime(b.created))} (${esc(ago(b.created))}) · computers from ${src}`,
      `<a class="btn" href="${b.area ? '#area/' + encodeURIComponent(b.area) : '#all'}">Back to ${esc(b.area || 'All scripts')}</a>
       <button class="btn danger-ghost ${b.done < b.total && !b.stoppedBy ? '' : 'hidden'}" id="bStop">Stop the rest</button>`) +
      `<div id="bCards">${cardsHtml()}</div>
      ${b.stoppedBy ? `<div class="alert warn">Stopped by ${esc(b.stoppedBy)}. Computers that hadn’t started were left out.</div>` : ''}
      <div class="panel">
        <h3>Computers <span class="right toolbar"><button class="btn small" id="bRetry">Run again on the problem ones</button><button class="btn small" id="bCsv">Download .csv</button></span></h3>
        <div class="team-summary"><span class="b-filters" id="bFilters">${filtersHtml()}</span><div class="search"><input id="bSearch" placeholder="Find a computer" aria-label="Find a computer"></div></div>
        <div id="bTable">${tableHtml()}</div>
        <p class="hint">Click a computer to see its full output.</p>
      </div>
      <details class="panel about-run"><summary>About this run</summary><div class="kv">
        ${kv('Script', b.script)}${kv('Run from', b.area || 'All scripts (script owner)')}${kv('Reason', b.reason || '(none given)')}${kv('Options', params.length ? params.map(([k, v]) => `-${k} ${Array.isArray(v) ? v.join(',') : v}`).join('  ') : 'None')}
        ${kv('How it ran', b.runOn === 'Target' ? 'On each computer (PowerShell remoting)' : `On the web server, -${b.targetParam} set to each computer`)}${kv('At once', `${b.parallel} computers at a time`)}${kv('Multi-device run id', b.id)}
      </div></details>`;
    $$('#bFilters [data-bf]').forEach(x => x.onclick = () => { st.filter = x.dataset.bf; update(); });
    $('#bSearch').oninput = e => { st.q = e.target.value.trim(); $('#bTable').innerHTML = tableHtml(); bindRows(); };
    bindRows();
    $('#bStop').onclick = () => modal({ title: 'Stop the rest?', danger: true, confirmText: 'Stop the rest',
      body: `<p>Computers that haven’t started yet (${n('Waiting')}) will be left out, and the ones running now (${n('Running') + n('Queued')}) will be asked to stop. Anything already changed stays changed.</p>`,
      onConfirm: async () => { const r = await api(`batches/${b.id}/stop`, { method: 'POST' }); toast(`Stopped: ${plural(r.skipped, 'computer')} left out${r.stopping ? `, ${r.stopping} asked to stop` : ''}`); clearTimeout(App.poll); tick(); } });
    $('#bCsv').onclick = () => {
      download(`${b.scriptName}-${b.total}-computers-${b.id}.csv`, csvText(['computer', 'status', 'started', 'finished', 'errors', 'warnings', 'result', 'runId'],
        st.b.items.map(i => ({ computer: i.computer, status: i.status, started: i.started || '', finished: i.finished || '', errors: i.errors, warnings: i.warnings, result: i.summary || '', runId: i.id }))), 'text/csv');
      logActivity(`Downloaded the results of multi-device run ${b.id} (${b.scriptName} on ${b.total} computers) as CSV`);
    };
    $('#bRetry').onclick = () => {
      const list = st.b.items.filter(i => isProblem(i.status)).map(i => i.computer);
      if (!list.length) { toast('There are no problem computers to run it on again.'); return; }
      Object.assign(App.multi, { source: 'list', text: list.join(', ') }); App.multi.computers = list; App.multi.check = null;
      App.mode = 'multi'; prefSet(MODE_KEY, 'multi'); saveMulti();
      location.hash = b.area ? '#area/' + encodeURIComponent(b.area) : '#all';
      toast(`${plural(list.length, 'computer')} put in the list at the top. Press Run on ${b.scriptName} to try again.`);
    };
  };
  const update = () => {
    $('#bCards').innerHTML = cardsHtml();
    $('#bFilters').innerHTML = filtersHtml();
    $$('#bFilters [data-bf]').forEach(x => x.onclick = () => { st.filter = x.dataset.bf; update(); });
    $('#bTable').innerHTML = tableHtml(); bindRows();
    if (st.b.done === st.b.total || st.b.stoppedBy) $('#bStop')?.classList.add('hidden');
  };
  await tick();
}

/* ================================================================ run history */
function runTable(items, showArea = true) {
  return table(['Started', ...(showArea ? ['Area'] : []), 'Script', 'Computer', 'By', 'Status', 'Took', 'Reason'], items.map(j => `<tr class="clickable" data-job="${esc(j.id)}">
    <td class="nowrap" title="${esc(fmtDateTime(j.created))}">${esc(fmtDateTime(j.created))}<div class="hint">${esc(ago(j.created))}</div></td>${showArea ? `<td>${esc(j.area || 'All scripts')}</td>` : ''}
    <td>${esc(j.scriptName)}</td><td class="mono nowrap">${esc(j.computer)}${j.batch ? '<div class="hint">multi-device run</div>' : ''}</td><td>${esc(shortUser(j.user))}</td><td>${runBadge(j.status)}${j.errors ? ` <span class="hint">${plural(j.errors, 'error')}</span>` : ''}</td>
    <td class="nowrap">${esc(duration(j.started || j.created, j.finished))}</td><td>${esc(j.reason || '')}</td></tr>`).join(''));
}
function bindRunRows(el) { $$('[data-job]', el).forEach(r => r.onclick = () => { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; location.hash = '#run/' + r.dataset.job; }); }

async function renderHistory(area) {
  const c = $('#content');
  const f = { area: area || '', computer: '', status: '', days: 14 };
  c.innerHTML = pageHeader('Run history', App.me.isOwner ? 'Every script run. Click a run to see its output.' : 'Every script run you can see: your own, and every run from your areas. Click a run to see its output.') +
    `<div class="filter-bar">
      <label>Area <select id="hArea"><option value="">${App.me.isOwner ? 'All areas' : 'All my areas'}</option>${App.areas.map(t => `<option ${t.name === f.area ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
      <label>Computer <input id="hComp" placeholder="Part of a name" autocomplete="off"></label>
      <label>Status <select id="hStatus"><option value="">Any</option>${Object.entries(RUN_STATUS).map(([k, v]) => `<option value="${k}">${esc(v[0])}</option>`).join('')}</select></label>
      <label>Period <select id="hDays">${[[1, 'Today'], [7, '7 days'], [14, '14 days'], [30, '30 days'], [90, '90 days']].map(([d, l]) => `<option value="${d}" ${d === f.days ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <button class="btn" id="hExport">Download .csv</button>
    </div><div id="hBody" class="panel">${spinner()}</div>`;
  let items = [];
  const load = async () => {
    try {
      const d = await api(`jobs?area=${encodeURIComponent(f.area)}&computer=${encodeURIComponent(f.computer)}&days=${f.days}`);
      items = d.items.filter(j => !f.status || j.status === f.status);
      $('#hBody').innerHTML = items.length ? runTable(items) + `<p class="hint">${plural(items.length, 'run')}.</p>` : empty('No runs match.');
      bindRunRows($('#hBody'));
    } catch (e) { $('#hBody').innerHTML = errorBox(e); }
  };
  $('#hArea').onchange = e => { f.area = e.target.value; load(); };
  let tmr; $('#hComp').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => { f.computer = e.target.value.trim(); load(); }, 300); };
  $('#hStatus').onchange = e => { f.status = e.target.value; load(); };
  $('#hDays').onchange = e => { f.days = +e.target.value; load(); };
  $('#hExport').onclick = () => {
    const cols = ['created', 'area', 'script', 'computer', 'user', 'status', 'errors', 'warnings', 'runAsUser', 'reason', 'id'];
    download('RRManager-run-history.csv', csvText(cols, items), 'text/csv'); logActivity('Downloaded the run history as CSV');
  };
  load();
}

/* ================================================================ user activity (admins) */
async function renderActivity() {
  const c = $('#content');
  const f = { days: 7, user: '', category: '', search: '' };
  c.innerHTML = pageHeader('User activity', 'Everything everyone has done in the app, in plain English. Only app admins can see this page.') +
    `<div class="filter-bar">
      <label>Period <select id="aDays">${[[1, 'Today'], [7, '7 days'], [30, '30 days'], [90, '90 days']].map(([d, l]) => `<option value="${d}" ${d === 7 ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Person <select id="aUser"><option value="">Everyone</option></select></label>
      <label>Type <select id="aCat"><option value="">Everything</option>${['Run', 'Change', 'Admin', 'Export', 'View', 'Denied'].map(x => `<option>${x}</option>`).join('')}</select></label>
      <label>Search <input id="aSearch" placeholder="Computer, script, reason…" autocomplete="off"></label>
      <button class="btn" id="aExport">Download .csv</button>
    </div><div id="aBody" class="panel">${spinner()}</div>`;

        `<p class="hint">${plural(d.total, 'entry', 'entries')}${d.truncated ? ' (showing the newest 5000)' : ''}. Kept for ${d.retentionDays} days.</p>` : empty('Nothing matches.');
    } catch (e) { $('#aBody').innerHTML = errorBox(e); }
  };

  $('#aCat').onchange = e => { f.category = e.target.value; load(); };
  let tmr; $('#aSearch').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => { f.search = e.target.value.trim(); load(); }, 300); };
  $('#aExport').onclick = () => { if (!d) return; download('RRManager-user-activity.csv', csvText(['time', 'user', 'category', 'action', 'result', 'ip', 'error'], d.items), 'text/csv'); logActivity('Downloaded the user activity log as CSV'); };
  load();
}

/* ================================================================ logs (admins) */
async function renderLogs(src) {
  const c = $('#content');
  const source = src === 'Troubleshooting' ? 'Troubleshooting' : 'Audit';
  c.innerHTML = pageHeader('Logs', `The app’s own logs, in <code>Logs\\RRManager-${source}.log</code> (CMTrace format) on the web server.`,
    `<span class="segmented"><button class="${source === 'Audit' ? 'active' : ''}" data-src="Audit">Audit</button><button class="${source === 'Troubleshooting' ? 'active' : ''}" data-src="Troubleshooting">Troubleshooting</button></span>`) +
    `<div class="panel" id="lBody">${spinner()}</div>`;
  $$('[data-src]').forEach(b => b.onclick = () => { location.hash = '#logs/' + b.dataset.src; });
  try {
    const d = await api(`logs?source=${source}&tail=1000`);
    const rows = d.entries.slice().reverse();

/* ================================================================ help */
function mdInline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((#[a-z]+(?:\/[\w-]*)?|https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
}
function renderMarkdown(md) {
  const ls = md.replace(/\r/g, '').split('\n'), out = [], toc = [];
  let i = 0, slugN = 0;
  const para = [];
  const flush = () => { if (para.length) { out.push(`<p>${mdInline(para.join(' '))}</p>`); para.length = 0; } };
  while (i < ls.length) {
    const l = ls[i];
    let m;
    if (!l.trim()) { flush(); i++; continue; }
    if (l.startsWith('```')) {
      flush(); const code = []; i++;
      while (i < ls.length && !ls[i].startsWith('```')) code.push(ls[i++]);
      i++; out.push(`<pre class="code">${esc(code.join('\n'))}</pre>`); continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
      flush();
      const lvl = m[1].length, id = 'g-' + (++slugN);
      out.push(`<h${lvl} id="${id}">${mdInline(m[2])}</h${lvl}>`);
      if (lvl === 2) toc.push(`<a href="#help" data-target="${id}">${esc(m[2].replace(/[`*]/g, ''))}</a>`);
      i++; continue;
    }
    if (/^---+$/.test(l.trim())) { flush(); out.push('<hr>'); i++; continue; }
    if (l.startsWith('>')) {
      flush(); const q = [];
      while (i < ls.length && ls[i].startsWith('>')) q.push(ls[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote><p>${mdInline(q.join(' '))}</p></blockquote>`); continue;
    }
    if (/^\|.*\|\s*$/.test(l)) {
      flush(); const rows = [];
      while (i < ls.length && /^\|.*\|\s*$/.test(ls[i])) rows.push(ls[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^\|[\s:|-]+\|$/.test(r.trim())));
      out.push(`<table><thead><tr>${cells(body[0]).map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if ((m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/))) {

    catch (e) { if (e.code === 403) activity('Denied', `${method} /${p}`, 'Denied', e.message); throw e; }
  }
  return { init, handle };
})();

init();

</script>
